<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angels & Demons & Banker</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #d4af37;
            font-family: 'Times New Roman', Times, serif, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Fullscreen Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('start.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 10vh;
            z-index: 100;
        }
        #start-btn {
            background: linear-gradient(135deg, #b8860b, #daa520);
            border: 2px solid #fff;
            color: #111;
            font-size: 2rem;
            font-weight: bold;
            padding: 15px 50px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.8);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Main Game Layout */
        #game-container {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: row;
        }

        /* Left Pane: Storyline Pictures */
        #story-pane {
            width: 35%;
            height: 100%;
            background: rgba(11, 15, 25, 0.95);
            border-right: 3px solid #b8860b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        #story-img {
            max-width: 100%;
            max-height: 70vh;
            border: 2px solid #daa520;
            box-shadow: 0 0 15px rgba(218, 165, 32, 0.4);
            object-fit: contain;
        }
        #story-title {
            margin-top: 15px;
            font-size: 1.4rem;
            color: #f0e682;
            letter-spacing: 1px;
        }

        /* Right Pane: Claw Master Exact Structure */
        #game-pane {
            width: 65%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Area: Battle Arena (Sky + Middle Road Layout) */
        #battle-arena {
            height: 55%;
            width: 100%;
            position: relative;
            background: url('sky.jpg') no-repeat center center;
            background-size: cover;
            overflow: hidden;
            border-bottom: 3px solid #b8860b;
        }

        /* Horizontal Road in the middle/lower part of the battle arena, matching sky tones */
        #road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 35%;
            background: rgba(15, 25, 45, 0.9);
            border-top: 2px solid #d4af37;
        }

        /* Entities on Road */
        #hero {
            position: absolute;
            left: 10%;
            bottom: 5%;
            width: 60px;
            height: 90px;
            object-fit: contain;
            cursor: pointer;
            z-index: 5;
        }

        #angel {
            position: absolute;
            left: 22%;
            bottom: 5%;
            width: 60px;
            height: 90px;
            object-fit: contain;
            display: none;
            z-index: 5;
        }

        /* Villains Container for multiple arrays */
        #villains-container {
            position: absolute;
            right: 5%;
            bottom: 5%;
            display: flex;
            gap: 15px;
            align-items: flex-end;
            z-index: 5;
        }

        .villain-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .villain-wrapper:hover {
            transform: scale(1.05);
        }
        .villain-hp-bar {
            width: 45px;
            height: 6px;
            background: #444;
            border: 1px solid #d4af37;
            margin-bottom: 4px;
            border-radius: 3px;
            overflow: hidden;
        }
        .villain-hp-fill {
            width: 100%;
            height: 100%;
            background: #b8860b;
        }
        .villain-img {
            width: 55px;
            height: 85px;
            object-fit: contain;
        }
        .villain-wrapper.targeted .villain-img {
            filter: drop-shadow(0 0 8px #ff4500);
        }

        /* Bottom Area: Claw Machine Section */
        #claw-section {
            height: 45%;
            width: 100%;
            background: #0f1423;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        #claw-rail {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 25px;
            background: #d4af37;
            transform: translateX(-50%);
            transition: left 0.1s linear;
        }

        #claw-head {
            position: absolute;
            top: 25px;
            left: -18px;
            width: 36px;
            height: 25px;
            background: #daa520;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }
        .claw-finger {
            width: 5px;
            height: 14px;
            background: #b8860b;
            position: absolute;
            bottom: -14px;
            transition: transform 0.2s;
        }
        .claw-left { left: 0; transform-origin: top; }
        .claw-right { right: 0; transform-origin: top; }

        /* Grab Items Pool on Bottom Floor */
        #grab-items-area {
            position: absolute;
            bottom: 15px;
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
        }
        .grab-item {
            width: 50px;
            height: 50px;
            background: rgba(218, 165, 32, 0.15);
            border: 2px solid #d4af37;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #f0e682;
            text-align: center;
            font-weight: bold;
            box-shadow: inset 0 0 8px rgba(218, 165, 32, 0.3);
        }

        /* HUD Overlays */
        #hud {
            position: absolute;
            top: 10px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            font-weight: bold;
            color: #f0e682;
            text-shadow: 1px 1px 3px #000;
            z-index: 10;
        }

        /* Cardinal's Cross Bullet */
        .cardinal-bullet {
            position: absolute;
            width: 24px;
            height: 24px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            pointer-events: none;
        }
        .cardinal-bullet::before {
            content: '';
            position: absolute;
            width: 4px;
            height: 22px;
            background: #d4af37;
            box-shadow: 0 0 8px #fff;
        }
        .cardinal-bullet::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 4px;
            background: #d4af37;
            box-shadow: 0 0 8px #fff;
            top: 7px;
        }

        /* Angel Wings & Halo */
        .angel-halo {
            position: absolute;
            top: -15px;
            left: 15px;
            width: 30px;
            height: 10px;
            border: 2px solid gold;
            border-radius: 50%;
            box-shadow: 0 0 10px gold;
            animation: pulse-halo 1.5s infinite alternate;
        }
        .angel-wing {
            position: absolute;
            top: 20px;
            width: 25px;
            height: 45px;
            background: radial-gradient(circle, #fff 40%, rgba(218,165,32,0.6) 100%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #fff;
        }
        .wing-left {
            left: -22px;
            transform-origin: right center;
            animation: flap-left 0.4s infinite alternate;
        }
        .wing-right {
            right: -22px;
            transform-origin: left center;
            animation: flap-right 0.4s infinite alternate;
        }

        @keyframes flap-left {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-25deg); }
        }
        @keyframes flap-right {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(25deg); }
        }
        @keyframes pulse-halo {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* Modals */
        #overlay-msg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            text-align: center;
            padding: 20px;
        }
        #overlay-msg h2 {
            font-size: 2.3rem;
            color: #f0e682;
            margin-bottom: 15px;
        }
        #overlay-btn {
            background: #b8860b;
            color: #fff;
            border: 2px solid #fff;
            padding: 12px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
        }

        /* Celebration */
        .spark {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px gold, 0 0 20px #fff;
            pointer-events: none;
            animation: spark-fall 2s linear infinite;
        }
        @keyframes spark-fall {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) scale(0.3); opacity: 0; }
        }

        #fly-object {
            position: absolute;
            width: 80px;
            height: 80px;
            object-fit: contain;
            z-index: 60;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Fullscreen Start Screen -->
    <div id="start-screen">
        <button id="start-btn" onclick="startGame()">Start Game</button>
    </div>

    <!-- Main Game Container -->
    <div id="game-container">
        <!-- Left Pane: Storyline Pictures -->
        <div id="story-pane">
            <div id="story-title">Stage 1: The Detective</div>
            <img id="story-img" src="S1L1.png" alt="Storyline View">
        </div>

        <!-- Right Pane: Game Box (Claw Master Layout) -->
        <div id="game-pane">
            <div id="hud">
                <div id="hud-stage">Stage 1 - Level 1</div>
                <div id="hud-stats">Power: 12 | Select Villain to Shoot</div>
            </div>

            <!-- Top Area: Battle Arena -->
            <div id="battle-arena">
                <div id="road">
                    <img id="hero" src="hero.png" alt="Hero">
                    <img id="angel" src="angel.png" alt="Angel">
                    <div id="villains-container"></div>
                </div>
            </div>

            <!-- Bottom Area: Claw Machine Section -->
            <div id="claw-section" onclick="triggerClaw(event)">
                <div id="claw-rail" style="left: 50%;">
                    <div id="claw-head">
                        <div class="claw-finger claw-left" id="left-finger"></div>
                        <div class="claw-finger claw-right" id="right-finger"></div>
                    </div>
                </div>
                <div id="grab-items-area">
                    <div class="grab-item">PWR<br>+5</div>
                    <div class="grab-item">RELIC<br>+1</div>
                    <div class="grab-item">CRIT<br>+10%</div>
                    <div class="grab-item">GOLD<br>+50</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Message -->
    <div id="overlay-msg">
        <h2 id="msg-title">Level Cleared</h2>
        <p id="msg-desc" style="color: #fff; margin-bottom: 20px;"></p>
        <button id="overlay-btn" onclick="nextAction()">Continue</button>
    </div>

    <!-- Celebration Object -->
    <img id="fly-object" src="fly.png" alt="Fly">

    <script>
        let currentStage = 1;
        let currentLevel = 1;
        let heroPower = 12;
        let selectedVillainIndex = 0;
        let isClawActive = false;
        let villainsState = [];

        const villainsList = {
            1: 'villain1.png',
            2: 'villain2.png',
            3: 'villain3.png',
            4: 'villain4.png',
            5: 'villain5.png',
            6: 'villain6.png',
            7: 'villain7.png',
            8: 'villain8.png'
        };

        const stageData = {
            1: { name: "The Detective", prefix: "S1" },
            2: { name: "Detective’s Helper", prefix: "S2" },
            3: { name: "The Priest", prefix: "S3" },
            4: { name: "The Close", prefix: "S4" }
        };

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            initLevel();
        }

        function initLevel() {
            const prefix = stageData[currentStage].prefix;
            document.getElementById('story-img').src = `${prefix}L${currentLevel}.png`;
            document.getElementById('story-title').innerText = `Stage ${currentStage}: ${stageData[currentStage].name}`;
            document.getElementById('hud-stage').innerText = `Stage ${currentStage} - Level ${currentLevel}`;

            // Reset Angel
            document.getElementById('angel').style.display = 'none';

            // Generate Villains array based on Level (more enemies in higher levels)
            const count = Math.min(currentLevel, 3); // 1 to 3 enemies per level
            villainsState = [];
            const container = document.getElementById('villains-container');
            container.innerHTML = '';

            for (let i = 0; i < count; i++) {
                let vId = Math.min(currentStage + i, 8);
                if (currentLevel === 5) vId = Math.min(currentStage + 4, 8); // Boss tier
                
                let hp = currentLevel === 5 ? 100 : 35 + (currentLevel * 10);
                villainsState.push({ id: i, img: villainsList[vId], hp: hp, maxHp: hp });

                const wrap = document.createElement('div');
                wrap.className = 'villain-wrapper' + (i === 0 ? ' targeted' : '');
                wrap.dataset.index = i;
                wrap.onclick = () => selectVillain(i);

                wrap.innerHTML = `
                    <div class="villain-hp-bar"><div class="villain-hp-fill" id="v-hp-${i}" style="width: 100%;"></div></div>
                    <img class="villain-img" src="${villainsList[vId]}" alt="Villain">
                `;
                container.appendChild(wrap);
            }
            selectedVillainIndex = 0;
        }

        function selectVillain(index) {
            selectedVillainIndex = index;
            document.querySelectorAll('.villain-wrapper').forEach((el, idx) => {
                if (idx === index) el.classList.add('targeted');
                else el.classList.remove('targeted');
            });
            shootBulletAtTarget(index);
        }

        function shootBulletAtTarget(index) {
            const targetEl = document.querySelectorAll('.villain-wrapper')[index];
            if (!targetEl) return;

            const arena = document.getElementById('battle-arena');
            const bullet = document.createElement('div');
            bullet.className = 'cardinal-bullet';
            bullet.style.left = '16%';
            bullet.style.bottom = '15%';
            arena.appendChild(bullet);

            // Compute target position dynamically
            const targetRect = targetEl.getBoundingClientRect();
            const arenaRect = arena.getBoundingClientRect();
            const targetX = targetRect.left - arenaRect.left + (targetRect.width / 2);
            
            let currentX = arenaRect.width * 0.16;
            const distance = targetX - currentX;
            let steps = 25;
            let stepCount = 0;

            const anim = setInterval(() => {
                stepCount++;
                currentX += distance / steps;
                bullet.style.left = currentX + 'px';

                if (stepCount >= steps) {
                    clearInterval(anim);
                    bullet.remove();
                    applyDamageToVillain(index);
                }
            }, 20);
        }

        function applyDamageToVillain(index) {
            if (!villainsState[index]) return;
            villainsState[index].hp -= heroPower;
            
            const hpPercent = Math.max(0, (villainsState[index].hp / villainsState[index].maxHp) * 100);
            const bar = document.getElementById(`v-hp-${index}`);
            if (bar) bar.style.width = hpPercent + '%';

            if (villainsState[index].hp <= 0) {
                // Remove defeated villain from DOM
                const wrappers = document.querySelectorAll('.villain-wrapper');
                if (wrappers[index]) wrappers[index].style.opacity = '0.3';
                
                // Check if all villains are cleared
                if (villainsState.every(v => v.hp <= 0)) {
                    handleLevelPass();
                } else {
                    // Auto select next active villain
                    const nextIdx = villainsState.findIndex(v => v.hp > 0);
                    if (nextIdx !== -1) selectVillain(nextIdx);
                }
            }
        }

        // Claw machine dropping mechanism (Player picks drop location)
        function triggerClaw(event) {
            if (isClawActive) return;
            isClawActive = true;

            const section = document.getElementById('claw-section');
            const rect = section.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const percentage = Math.max(10, Math.min(90, (clickX / rect.width) * 100));

            const rail = document.getElementById('claw-rail');
            rail.style.left = percentage + '%';

            const head = document.getElementById('claw-head');
            const leftF = document.getElementById('left-finger');
            const rightF = document.getElementById('right-finger');

            setTimeout(() => {
                head.style.transition = 'top 0.3s ease-in-out';
                head.style.top = '90px';
                leftF.style.transform = 'rotate(25deg)';
                rightF.style.transform = 'rotate(-25deg)';

                setTimeout(() => {
                    // Grab booster reward
                    heroPower += 4;
                    document.getElementById('hud-stats').innerText = `Power: ${heroPower} | Boost Acquired!`;

                    head.style.top = '25px';
                    leftF.style.transform = 'rotate(0deg)';
                    rightF.style.transform = 'rotate(0deg)';
                    isClawActive = false;
                }, 500);
            }, 100);
        }

        function handleLevelPass() {
            if (currentLevel === 5) {
                // Final level of stage: Show Angel touching hero
                const angel = document.getElementById('angel');
                angel.style.display = 'block';

                setTimeout(() => {
                    if (!document.querySelector('.angel-halo')) {
                        const halo = document.createElement('div');
                        halo.className = 'angel-halo';
                        const wingL = document.createElement('div');
                        wingL.className = 'angel-wing wing-left';
                        const wingR = document.createElement('div');
                        wingR.className = 'angel-wing wing-right';
                        angel.appendChild(halo);
                        angel.appendChild(wingL);
                        angel.appendChild(wingR);
                    }
                }, 400);

                setTimeout(() => {
                    if (currentStage === 4) {
                        triggerFinalVictory();
                    } else {
                        showModal(`Stage ${currentStage} Completed`, `The sacred bond is forged. Advancing to Stage ${currentStage + 1}.`);
                    }
                }, 1400);
            } else {
                showModal(`Level ${currentLevel} Cleared`, `All adversaries neutralized. Proceeding.`);
            }
        }

        function showModal(title, desc) {
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-desc').innerText = desc;
            document.getElementById('overlay-msg').style.display = 'flex';
        }

        function nextAction() {
            document.getElementById('overlay-msg').style.display = 'none';
            if (currentLevel === 5) {
                currentStage++;
                currentLevel = 1;
            } else {
                currentLevel++;
            }
            initLevel();
        }

        function triggerFinalVictory() {
            const overlay = document.getElementById('overlay-msg');
            document.getElementById('msg-title').innerText = "CONGRATULATIONS";
            document.getElementById('msg-desc').innerText = "The Illuminati scheme is broken. Truth and light prevail!";
            document.getElementById('overlay-btn').innerText = "Play Again";
            document.getElementById('overlay-btn').onclick = () => location.reload();
            overlay.style.display = 'flex';

            const flyObj = document.getElementById('fly-object');
            flyObj.style.display = 'block';
            let posX = 20, posY = 20, dirX = 2.5, dirY = 2;

            setInterval(() => {
                posX += dirX;
                posY += dirY;
                if (posX <= 0 || posX >= window.innerWidth - 80) dirX *= -1;
                if (posY <= 0 || posY >= window.innerHeight - 80) dirY *= -1;
                flyObj.style.left = posX + 'px';
                flyObj.style.top = posY + 'px';
            }, 25);

            setInterval(() => {
                const spark = document.createElement('div');
                spark.className = 'spark';
                spark.style.left = Math.random() * window.innerWidth + 'px';
                spark.style.top = '0px';
                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 2000);
            }, 120);
        }
    </script>
</body>
</html>

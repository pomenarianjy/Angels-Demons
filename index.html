<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angles & Demons & Banker</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #04060a;
            color: #d4af37;
            font-family: 'Times New Roman', Times, serif, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Fullscreen Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #060913;
            background-image: url('start.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 8vh;
            z-index: 100;
        }
        #start-btn {
            background: linear-gradient(135deg, #8b6508, #daa520);
            border: 2px solid #fff;
            color: #fff;
            font-size: 2.2rem;
            font-weight: bold;
            padding: 15px 55px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(218, 165, 32, 0.9);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Main Game Layout */
        #game-container {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: row;
        }

        /* Left Pane: Storyline Pictures */
        #story-pane {
            width: 35%;
            height: 100%;
            background: rgba(8, 11, 18, 0.96);
            border-right: 3px solid #b8860b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        #story-img {
            max-width: 100%;
            max-height: 70vh;
            border: 2px solid #daa520;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.4);
            object-fit: contain;
        }
        #story-title {
            margin-top: 15px;
            font-size: 1.4rem;
            color: #f0e682;
            letter-spacing: 1px;
        }

        /* Right Pane: Game Box */
        #game-pane {
            width: 65%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Area: Battle Arena with Formation Field */
        #battle-arena {
            height: 52%;
            width: 100%;
            position: relative;
            background: #090e1a;
            overflow: hidden;
            border-bottom: 3px solid #b8860b;
        }
        #road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: rgba(14, 20, 32, 0.75);
        }

        /* Hero & Angel Containers */
        #hero-container {
            position: absolute;
            left: 5%;
            bottom: 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            transition: left 2.5s ease-in-out;
        }
        #hero {
            width: 110px;
            height: 160px;
            object-fit: contain;
            filter: drop-shadow(0 0 22px rgba(218, 165, 32, 0.85));
        }

        #angel-container {
            position: absolute;
            right: 5%;
            bottom: 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            display: none;
        }
        #angel {
            width: 110px;
            height: 160px;
            object-fit: contain;
            filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.85));
            position: relative;
        }

        .angel-halo {
            position: absolute;
            top: -18px;
            width: 45px;
            height: 16px;
            border: 3px solid #fde047;
            border-radius: 50%;
            box-shadow: 0 0 15px #fde047;
            animation: haloGlow 1s infinite alternate;
            display: none;
        }
        @keyframes haloGlow {
            from { transform: scale(1); box-shadow: 0 0 10px #fde047; }
            to { transform: scale(1.1); box-shadow: 0 0 22px #fff; }
        }

        .white-heart {
            position: absolute;
            color: #ffffff;
            font-size: 20px;
            pointer-events: none;
            animation: heartFirework 1.2s forwards ease-out;
            z-index: 1;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #fde047;
        }
        @keyframes heartFirework {
            0% { transform: translate(0, 0) scale(0.4); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1.3); opacity: 0; }
        }

        /* Strict 3x4 Grid Formation Field */
        #villains-grid-field {
            position: absolute;
            right: 2%;
            top: 2%;
            width: 62%;
            height: 96%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            z-index: 10;
            background: transparent;
            border: none;
        }
        .grid-cell {
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .villain-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 1px;
            border-radius: 6px;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            transition: transform 0.1s;
        }
        .villain-unit:hover {
            transform: scale(1.1);
        }
        .villain-unit.active-target .villain-img {
            filter: drop-shadow(0 0 12px rgba(218, 165, 32, 0.9));
            transform: scale(1.06);
        }
        .villain-unit.disabled-target {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .v-hp-container {
            width: 48px;
            height: 4px;
            background: #222;
            border: 1px solid #d4af37;
            border-radius: 2px;
            margin-bottom: 1px;
            overflow: hidden;
        }
        .v-hp-bar {
            width: 100%;
            height: 100%;
            background: #b8860b;
        }
        .villain-img {
            width: 64px;
            height: 82px;
            object-fit: contain;
            transition: transform 0.2s, filter 0.2s;
        }
        .villain-img.boss-img {
            width: 100px;
            height: 130px;
        }

        /* Bottom Area: Grand Mechanical Claw Vault */
        #claw-section {
            height: 48%;
            width: 100%;
            background: #03050a;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #vault-pit {
            position: relative;
            flex-grow: 1;
            width: 94%;
            margin: 4px auto 0 auto;
            background: radial-gradient(circle at center, #0f172a 0%, #050811 100%);
            border-top: 3px solid #b8860b;
            border-left: 3px solid #1f293d;
            border-right: 3px solid #1f293d;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            overflow: hidden;
        }

        #gantry-track {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(90deg, #374151, #9ca3af, #374151);
            border-bottom: 2px solid #b8860b;
            z-index: 28;
        }

        #claw-rig {
            position: absolute;
            top: 10px;
            left: 50%;
            width: 50px;
            height: 20px;
            transform: translateX(-50%);
            transition: left 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 30;
        }

        #vertical-cable {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 20px;
            background: linear-gradient(90deg, #b8860b, #f0e682, #b8860b);
            transform: translateX(-50%);
            transition: height 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #grand-claw-head {
            position: absolute;
            top: 20px;
            left: 50%;
            width: 56px;
            height: 36px;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: top 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .claw-crown {
            width: 32px;
            height: 12px;
            background: linear-gradient(135deg, #b8860b, #f0e682);
            border: 1px solid #fff;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(218, 165, 32, 0.9);
        }

        .claw-prongs {
            display: flex;
            justify-content: space-between;
            width: 56px;
            height: 24px;
            margin-top: -2px;
        }

        .prong-l, .prong-r {
            width: 16px;
            height: 24px;
            background: linear-gradient(135deg, #d4af37, #8b6508);
            border: 1px solid #fff;
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
            transition: transform 0.2s ease;
        }
        .prong-l {
            border-top-left-radius: 10px;
            border-bottom-left-radius: 12px;
            transform-origin: top right;
            transform: rotate(-15deg);
        }
        .prong-r {
            border-top-right-radius: 10px;
            border-bottom-right-radius: 12px;
            transform-origin: top left;
            transform: rotate(15deg);
        }
        #grand-claw-head.closed .prong-l { transform: rotate(10deg); }
        #grand-claw-head.closed .prong-r { transform: rotate(-10deg); }

        #bead-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .treasure-bead {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.8), inset 0 -2px 4px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.4);
            transition: transform 0.2s ease-out, opacity 0.2s ease-out;
        }

        /* 6 Direction Arrow Deck */
        #direction-deck {
            height: 52px;
            background: #080c16;
            border-top: 2px solid #b8860b;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 0 10px;
            z-index: 40;
        }

        .dir-arrow-btn {
            background: linear-gradient(135deg, #111827, #1f2937);
            border: 2px solid #b8860b;
            color: #f0e682;
            border-radius: 8px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: all 0.15s ease;
            width: 14%;
            max-width: 90px;
            text-align: center;
        }
        .dir-arrow-btn:hover {
            background: linear-gradient(135deg, #1f2937, #374151);
            border-color: #f0e682;
            transform: translateY(-2px);
            box-shadow: 0 0 12px rgba(218, 165, 32, 0.6);
        }
        .dir-arrow-btn:active {
            transform: translateY(1px);
        }

        /* HUD Overlays */
        #hud {
            position: absolute;
            top: 6px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: bold;
            color: #f0e682;
            text-shadow: 1px 1px 2px #000;
            z-index: 40;
        }

        /* Cardinal's Cross Bullet */
        .cardinal-bullet {
            position: absolute;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 25;
            pointer-events: none;
        }
        .cardinal-bullet::before {
            content: '';
            position: absolute;
            width: 6px;
            height: 32px;
            background: #d4af37;
            box-shadow: 0 0 12px #fff;
        }
        .cardinal-bullet::after {
            content: '';
            position: absolute;
            width: 26px;
            height: 6px;
            background: #d4af37;
            box-shadow: 0 0 12px #fff;
            top: 14px;
        }

        /* Modal Overlay & Upgrades Selector */
        #overlay-msg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 60;
            text-align: center;
            padding: 20px;
        }
        #overlay-msg h2 {
            font-size: 2.2rem;
            color: #f0e682;
            margin-bottom: 15px;
        }
        .upgrade-container {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .upgrade-card {
            background: #111827;
            border: 2px solid #b8860b;
            border-radius: 8px;
            padding: 12px;
            width: 160px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .upgrade-card:hover {
            transform: scale(1.05);
            background: #1f2937;
        }
        .upgrade-card h3 {
            font-size: 1rem;
            color: #f0e682;
            margin-top: 0;
        }
        .upgrade-card p {
            font-size: 0.8rem;
            color: #ccc;
        }
        #overlay-btn {
            background: #b8860b;
            color: #fff;
            border: 2px solid #fff;
            padding: 12px 35px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="start-screen">
        <button id="start-btn" onclick="startGame()">Start Game</button>
    </div>

    <!-- Main Container -->
    <div id="game-container">
        <!-- Left Pane: Storyline Pictures -->
        <div id="story-pane">
            <div id="story-title">Stage 1: The Detective</div>
            <img id="story-img" src="S1L1.png" alt="Storyline">
        </div>

        <!-- Right Pane: Game Box -->
        <div id="game-pane">
            <div id="hud">
                <div id="hud-info">Stage 1 - Level 1</div>
                <div id="hud-power">Power: 0 | Select a direction arrow below to deploy the grand mechanical claw!</div>
            </div>

            <!-- Top Area: Battle Arena with Formation Field -->
            <div id="battle-arena" onclick="handleArenaClick()">
                <div id="road">
                    <div id="hero-container">
                        <img id="hero" src="hero.png" alt="Hero">
                    </div>
                    <div id="angel-container">
                        <div class="angel-halo" id="angel-halo"></div>
                        <img id="angel" src="angel.png" alt="Angel">
                    </div>
                    <!-- Strict 3x4 Grid Formation Field -->
                    <div id="villains-grid-field"></div>
                </div>
            </div>

            <!-- Bottom Area: Grand Mechanical Claw Vault & 6 Direction Arrow Deck -->
            <div id="claw-section">
                <div id="vault-pit">
                    <div id="gantry-track"></div>
                    <div id="claw-rig" style="left: 50%;">
                        <div id="vertical-cable" style="height: 20px;"></div>
                        <div id="grand-claw-head">
                            <div class="claw-crown"></div>
                            <div class="claw-prongs">
                                <div class="prong-l"></div>
                                <div class="prong-r"></div>
                            </div>
                        </div>
                    </div>
                    <div id="bead-container"></div>
                </div>

                <!-- 6 Direction Arrow Deck -->
                <div id="direction-deck">
                    <button class="dir-arrow-btn" onclick="deployClaw(0)">1 &larr;</button>
                    <button class="dir-arrow-btn" onclick="deployClaw(1)">2 &larr;</button>
                    <button class="dir-arrow-btn" onclick="deployClaw(2)">3 &larr;</button>
                    <button class="dir-arrow-btn" onclick="deployClaw(3)">4 &rarr;</button>
                    <button class="dir-arrow-btn" onclick="deployClaw(4)">5 &rarr;</button>
                    <button class="dir-arrow-btn" onclick="deployClaw(5)">6 &rarr;</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Overlay & Upgrades Selector -->
    <div id="overlay-msg">
        <h2 id="msg-title">Level Cleared</h2>
        <p id="msg-desc" style="color: #fff; margin-bottom: 10px;"></p>
        <div id="upgrade-box" class="upgrade-container"></div>
        <button id="overlay-btn" style="display:none;">Continue</button>
    </div>

    <script>
        let stage = 1;
        let level = 1;
        let heroPower = 0;
        let isClawBusy = false;
        let gridData = []; 
        let treasureBeads = [];
        let waitingForTouchToAdvance = false;

        let upgrades = {
            reach: 1,  
            power: 1,  
            bounce: 1  
        };

        const stageBosses = {
            1: 'villain6.png',
            2: 'villain3.png',
            3: 'villain7.png',
            4: 'villain8.png'
        };

        const stagesConfig = {
            1: { name: "The Detective", prefix: "S1" },
            2: { name: "Detective’s Helper", prefix: "S2" },
            3: { name: "The Priest", prefix: "S3" },
            4: { name: "The Close", prefix: "S4" }
        };

        const beadTiers = [
            { name: 'Pearl', baseValue: 4, color: 'radial-gradient(circle at 30% 30%, #ffffff 0%, #cbd5e1 100%)', symbol: '•', size: 18, weight: 0.65 },
            { name: 'Gold Gem', baseValue: 14, color: 'radial-gradient(circle at 30% 30%, #fde047 0%, #ca8a04 100%)', symbol: '★', size: 22, weight: 0.22 },
            { name: 'Ruby', baseValue: 35, color: 'radial-gradient(circle at 30% 30%, #fca5a5 0%, #b91c1c 100%)', symbol: '♦', size: 26, weight: 0.10 },
            { name: 'Diamond', baseValue: 75, color: 'radial-gradient(circle at 30% 30%, #cffafe 0%, #0e7490 100%)', symbol: '💎', size: 30, weight: 0.03 }
        ];

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            setupLevel();
        }

        function setupLevel() {
            waitingForTouchToAdvance = false;
            const cfg = stagesConfig[stage];
            document.getElementById('story-img').src = `${cfg.prefix}L${level}.png`;
            document.getElementById('story-title').innerText = `Stage ${stage}: ${cfg.name}`;
            document.getElementById('hud-info').innerText = `Stage ${stage} - Level ${level}`;
            
            const angelCont = document.getElementById('angel-container');
            angelCont.style.display = 'none';
            document.getElementById('angel-halo').style.display = 'none';
            document.getElementById('hero-container').style.left = '5%';

            gridData = [];
            for (let r = 0; r < 3; r++) {
                let rowArr = [];
                for (let c = 0; c < 4; c++) {
                    rowArr.push(null);
                }
                gridData.push(rowArr);
            }

            let baseHpMultiplier = 1 + (stage - 1) * 0.2 + (level - 1) * 0.1;
            let totalVillainsToSpawn = Math.floor(Math.random() * 5) + 3; // Random number between 3-7

            if (level === 5) {
                // Final level boss configuration: standing middle on the last column (row 1, col 3)
                let bossRow = 1;
                let bossCol = 3;
                let bossSrc = stageBosses[stage];
                let bossHp = Math.round(200 * baseHpMultiplier);
                gridData[bossRow][bossCol] = { row: bossRow, col: bossCol, src: bossSrc, hp: bossHp, maxHp: bossHp, isBoss: true };

                // Normal villains in columns except for the last (columns 0, 1, 2)
                let normalHp = Math.round(75 * baseHpMultiplier);
                let spawnedCount = 0;
                while (spawnedCount < totalVillainsToSpawn) {
                    let r = Math.floor(Math.random() * 3);
                    let c = Math.floor(Math.random() * 3); // Columns 0, 1, 2 only
                    if (gridData[r][c] === null) {
                        gridData[r][c] = { row: r, col: c, src: 'villain4.png', hp: normalHp, maxHp: normalHp, isBoss: false };
                        spawnedCount++;
                    }
                }
            } else {
                let normalHp = Math.round(60 * baseHpMultiplier);
                let spawnedCount = 0;

                while (spawnedCount < totalVillainsToSpawn) {
                    let r = Math.floor(Math.random() * 3);
                    let c = Math.floor(Math.random() * 4);
                    if (gridData[r][c] === null) {
                        let villainSrc = 'villain1.png';
                        if (level === 1) {
                            villainSrc = 'villain1.png';
                        } else if (level === 2) {
                            villainSrc = 'villain2.png';
                        } else if (level === 3) {
                            villainSrc = 'villain4.png';
                        } else if (level === 4) {
                            villainSrc = Math.random() < 0.5 ? 'villain1.png' : 'villain2.png';
                        }

                        gridData[r][c] = { row: r, col: c, src: villainSrc, hp: normalHp, maxHp: normalHp, isBoss: false };
                        spawnedCount++;
                    }
                }
            }

            renderGrid();
            initTreasureHeap();
        }

        function renderGrid() {
            const field = document.getElementById('villains-grid-field');
            field.innerHTML = '';

            let firstInRows = {};
            let hasAnyAlive = false;

            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 4; c++) {
                    if (gridData[r][c] !== null && gridData[r][c].hp > 0) {
                        firstInRows[r] = c;
                        hasAnyAlive = true;
                        break;
                    }
                }
            }

            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 4; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    
                    const villain = gridData[r][c];
                    if (villain !== null && villain.hp > 0) {
                        const unit = document.createElement('div');
                        let isTargetable = (firstInRows[r] === c);
                        unit.className = `villain-unit ${isTargetable ? 'active-target' : 'disabled-target'}`;
                        
                        if (isTargetable) {
                            unit.onclick = () => fireCrossBullet(r, c);
                        }

                        let pct = Math.max(0, (villain.hp / villain.maxHp) * 100);
                        let imgClass = villain.isBoss ? 'villain-img boss-img' : 'villain-img';
                        let safeSrc = villain.src;

                        unit.innerHTML = `
                            <div class="v-hp-container"><div class="v-hp-bar" style="width: ${pct}%;"></div></div>
                            <img class="${imgClass}" src="${safeSrc}" alt="Villain" onerror="this.src='villain1.png';">
                        `;
                        cell.appendChild(unit);
                    }
                    field.appendChild(cell);
                }
            }

            if (!hasAnyAlive) {
                triggerLevelClear();
            }
        }

        function initTreasureHeap() {
            const container = document.getElementById('bead-container');
            container.innerHTML = '';
            treasureBeads = [];

            const pit = document.getElementById('vault-pit');
            const pitWidth = pit.clientWidth || 350;

            let idCounter = 0;
            let totalBeads = 75;
            let cols = 12;
            let spacingX = (pitWidth - 40) / cols;

            for (let i = 0; i < totalBeads; i++) {
                let colIdx = i % cols;
                let rowIdx = Math.floor(i / cols);

                let x = 20 + (colIdx * spacingX) + ((rowIdx % 2) * (spacingX * 0.5)) + ((Math.random() - 0.5) * 6);
                let y = 4 + (rowIdx * 12) + ((Math.random() - 0.5) * 4);

                if (x > pitWidth - 20) continue;

                let randW = Math.random();
                let cumulative = 0;
                let selectedTier = beadTiers[0];
                for (let t of beadTiers) {
                    cumulative += t.weight;
                    if (randW <= cumulative) {
                        selectedTier = t;
                        break;
                    }
                }

                treasureBeads.push({
                    id: idCounter,
                    tier: selectedTier.name,
                    value: selectedTier.baseValue,
                    x: x,
                    y: y,
                    collected: false
                });

                const beadEl = document.createElement('div');
                beadEl.className = 'treasure-bead';
                beadEl.id = `bead-${idCounter}`;
                beadEl.style.width = `${selectedTier.size}px`;
                beadEl.style.height = `${selectedTier.size}px`;
                beadEl.style.left = `${x - selectedTier.size / 2}px`;
                beadEl.style.bottom = `${y}px`;
                beadEl.style.background = selectedTier.color;
                beadEl.style.color = '#333';
                beadEl.style.zIndex = rowIdx;
                beadEl.innerText = selectedTier.symbol;
                container.appendChild(beadEl);
                idCounter++;
            }
        }

        function deployClaw(dirIndex) {
            if (isClawBusy || waitingForTouchToAdvance) return;
            isClawBusy = true;

            const pit = document.getElementById('vault-pit');
            const pitWidth = pit.clientWidth || 350;
            const sectionWidth = pitWidth / 6;
            const targetX = (dirIndex * sectionWidth) + (sectionWidth / 2);
            
            const clawRig = document.getElementById('claw-rig');
            const verticalCable = document.getElementById('vertical-cable');
            const grandHead = document.getElementById('grand-claw-head');

            clawRig.style.left = `${targetX}px`;

            setTimeout(() => {
                let dropHeight = 145 + (upgrades.reach * 12);
                verticalCable.style.height = `${dropHeight}px`;
                grandHead.style.top = `${dropHeight}px`;

                setTimeout(() => {
                    grandHead.classList.add('closed');

                    setTimeout(() => {
                        let scoopedPower = 0;
                        let dropTipY = pit.clientHeight - dropHeight - 36;
                        const uniqueDirectionWeights = [45, 65, 55, 75, 50, 70];
                        let baseDirValue = uniqueDirectionWeights[dirIndex];

                        treasureBeads.forEach(b => {
                            if (!b.collected) {
                                let dist = Math.hypot(b.x - targetX, b.y - dropTipY);
                                if (dist < 50) {
                                    b.collected = true;
                                    scoopedPower += b.value;
                                    const el = document.getElementById(`bead-${b.id}`);
                                    if (el) {
                                        el.style.transform = 'scale(0) translateY(-50px)';
                                        el.style.opacity = '0';
                                    }
                                }
                            }
                        });

                        if (scoopedPower === 0) {
                            scoopedPower = Math.round(baseDirValue * upgrades.power);
                        } else {
                            scoopedPower = Math.round((scoopedPower * 0.4 + baseDirValue * 0.6) * upgrades.power);
                        }

                        heroPower += scoopedPower;
                        document.getElementById('hud-power').innerText = `Power: ${heroPower} | Direction ${dirIndex + 1} scooped +${scoopedPower}! Select target!`;

                        verticalCable.style.height = '20px';
                        grandHead.style.top = '20px';
                        grandHead.classList.remove('closed');

                        setTimeout(() => {
                            isClawBusy = false;
                            if (treasureBeads.every(b => b.collected)) {
                                initTreasureHeap();
                            }
                        }, 250);
                    }, 180);
                }, 300);
            }, 250);
        }

        function fireCrossBullet(r, c) {
            if (waitingForTouchToAdvance) return;
            if (heroPower <= 0) {
                document.getElementById('hud-power').innerText = `No Power! Deploy the grand mechanical claw below first!`;
                return;
            }

            let pathQueue = calculateBouncePath(r, c);
            executeBounceAnimation(pathQueue, 0);
        }

        function calculateBouncePath(startR, startC) {
            let path = [];
            let remainingPower = heroPower + (upgrades.bounce * 12);
            heroPower = 0;
            document.getElementById('hud-power').innerText = `Power: 0 | Deploy the grand mechanical claw to reload!`;

            let curR = startR;
            let curC = startC;

            let simGrid = gridData.map(row => row.map(v => v ? { ...v } : null));

            while (remainingPower > 0) {
                let target = simGrid[curR][curC];
                if (!target || target.hp <= 0) {
                    let found = false;
                    for (let cIdx = 0; cIdx < 4; cIdx++) {
                        for (let rIdx = 0; rIdx < 3; rIdx++) {
                            if (simGrid[rIdx][cIdx] && simGrid[rIdx][cIdx].hp > 0) {
                                curR = rIdx;
                                curC = cIdx;
                                target = simGrid[rR][rC];
                                found = true;
                                break;
                            }
                        }
                        if (found) break;
                    }
                    if (!target || target.hp <= 0) break;
                }

                let damageDealt = Math.min(remainingPower, target.hp);
                target.hp -= damageDealt;
                remainingPower -= damageDealt;

                let isKilled = (target.hp <= 0);
                path.push({ r: curR, c: curC, damage: damageDealt, killed: isKilled });

                if (isKilled) {
                    simGrid[curR][curC] = null;
                    if (remainingPower > 0) {
                        let nextInSameRow = -1;
                        for (let cCheck = curC + 1; cCheck < 4; cCheck++) {
                            if (simGrid[curR][cCheck] && simGrid[curR][cCheck].hp > 0) {
                                nextInSameRow = cCheck;
                                break;
                            }
                        }

                        if (nextInSameRow !== -1) {
                            curC = nextInSameRow;
                        } else {
                            let nearestR = -1;
                            let nearestC = -1;
                            let minDistance = 999;

                            for (let rCheck = 0; rCheck < 3; rCheck++) {
                                for (let cCheck = 0; cCheck < 4; cCheck++) {
                                    if (simGrid[rCheck][cCheck] && simGrid[rCheck][cCheck].hp > 0) {
                                        let dist = Math.hypot(rCheck - curR, cCheck - curC);
                                        if (dist < minDistance) {
                                            minDistance = dist;
                                            nearestR = rCheck;
                                            nearestC = cCheck;
                                        }
                                    }
                                }
                            }

                            if (nearestR !== -1) {
                                curR = nearestR;
                                curC = nearestC;
                            } else {
                                break; 
                            }
                        }
                    }
                } else {
                    break; 
                }
            }

            return path;
        }

        function executeBounceAnimation(pathQueue, index) {
            if (index >= pathQueue.length) {
                renderGrid();
                return;
            }

            const stepData = pathQueue[index];
            const arena = document.getElementById('battle-arena');
            const field = document.getElementById('villains-grid-field');
            const arenaRect = arena.getBoundingClientRect();
            const fieldRect = field.getBoundingClientRect();
            
            const targetX = fieldRect.left - arenaRect.left + (stepData.c + 0.5) * (fieldRect.width / 4);
            const targetY = fieldRect.top - arenaRect.top + (stepData.r + 0.5) * (fieldRect.height / 3);

            const bullet = document.createElement('div');
            bullet.className = 'cardinal-bullet';
            
            let startX, startY;
            if (index === 0) {
                startX = arenaRect.width * 0.14;
                startY = arenaRect.height * 0.78;
            } else {
                let prevStep = pathQueue[index - 1];
                startX = fieldRect.left - arenaRect.left + (prevStep.c + 0.5) * (fieldRect.width / 4);
                startY = fieldRect.top - arenaRect.top + (prevStep.r + 0.5) * (fieldRect.height / 3);
            }

            bullet.style.left = startX + 'px';
            bullet.style.bottom = (arenaRect.height - startY) + 'px';
            arena.appendChild(bullet);

            let currentX = startX;
            let currentY = startY;
            let distanceX = targetX - startX;
            let distanceY = targetY - startY;
            let steps = 10;
            let currentStep = 0;

            const flight = setInterval(() => {
                currentStep++;
                let progress = currentStep / steps;
                let bounceArc = Math.sin(progress * Math.PI) * -50; 

                currentX = startX + (distanceX * progress);
                currentY = startY + (distanceY * progress);

                bullet.style.left = currentX + 'px';
                bullet.style.bottom = (arenaRect.height - (currentY + bounceArc)) + 'px';

                if (currentStep >= steps) {
                    clearInterval(flight);
                    bullet.remove();

                    let liveTarget = gridData[stepData.r][stepData.c];
                    if (liveTarget) {
                        liveTarget.hp = Math.max(0, liveTarget.hp - stepData.damage);
                        if (liveTarget.hp <= 0) {
                            gridData[stepData.r][stepData.c] = null;
                        }
                    }
                    renderGrid();

                    setTimeout(() => {
                        executeBounceAnimation(pathQueue, index + 1);
                    }, 90);
                }
            }, 10);
        }

        function triggerLevelClear() {
            if (level === 5) {
                const angelCont = document.getElementById('angel-container');
                angelCont.style.display = 'flex';
                angelCont.style.right = '5%';
                
                document.getElementById('hud-power').innerText = `Stage Cleared! Touch screen to approach the angel!`;
                waitingForTouchToAdvance = true;
            } else {
                showUpgradeModal(`Level ${level} Cleared`, "Select a power-up for your equipment (Up to Level 7).");
            }
        }

        function handleArenaClick() {
            if (waitingForTouchToAdvance === true) {
                waitingForTouchToAdvance = 'animating';

                const heroCont = document.getElementById('hero-container');
                const angelCont = document.getElementById('angel-container');
                
                const heroWidth = heroCont.offsetWidth || 110;
                const arenaWidth = document.getElementById('battle-arena').clientWidth;
                let angelPixelLeft = arenaWidth * (1 - 0.05) - 110;
                let heroTargetPct = ((angelPixelLeft - heroWidth) / arenaWidth) * 100;
                
                heroCont.style.left = `${heroTargetPct}%`;

                document.getElementById('hud-power').innerText = `Hero meeting Angel...`;

                setTimeout(() => {
                    document.getElementById('angel-halo').style.display = 'block';
                    spawnWhiteHeartFireworks();

                    document.getElementById('hud-power').innerText = `Divine Blessing! Tap screen again to advance.`;

                    setTimeout(() => {
                        waitingForTouchToAdvance = 'readyToAdvance';
                    }, 1000);
                }, 2500);
            } else if (waitingForTouchToAdvance === 'readyToAdvance') {
                waitingForTouchToAdvance = false;
                if (stage === 4) {
                    showGameOverModal("VICTORY", "All formations defeated! Light triumphs!");
                } else {
                    showUpgradeModal(`Stage ${stage} Cleared`, "Choose an upgrade before entering next stage.");
                }
            }
        }

        function spawnWhiteHeartFireworks() {
            const angelCont = document.getElementById('angel-container');

            for (let i = 0; i < 24; i++) {
                const heart = document.createElement('div');
                heart.className = 'white-heart';
                heart.innerHTML = '🤍';
                
                let isLeft = Math.random() < 0.5;
                let angle = isLeft ? (Math.PI + (Math.random() * 0.7 - 0.35)) : (Math.random() * 0.7 - 0.35);
                let dist = 70 + Math.random() * 110;
                let dx = Math.cos(angle) * dist;
                let dy = Math.sin(angle) * dist - 20;

                heart.style.setProperty('--dx', `${dx}px`);
                heart.style.setProperty('--dy', `${dy}px`);
                heart.style.left = `50%`;
                heart.style.top = `40%`;

                angelCont.appendChild(heart);
                setTimeout(() => heart.remove(), 1200);
            }
        }

        function showUpgradeModal(title, desc) {
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-desc').innerText = desc;
            document.getElementById('overlay-btn').style.display = 'none';

            const upgradeBox = document.getElementById('upgrade-box');
            upgradeBox.innerHTML = '';

            const choices = [
                { key: 'reach', name: 'Enhance Reach', desc: `Current Lvl: ${upgrades.reach}/7` },
                { key: 'power', name: 'Enhance Power', desc: `Current Lvl: ${upgrades.power}/7` },
                { key: 'bounce', name: 'Enhance Bounce', desc: `Current Lvl: ${upgrades.bounce}/7` }
            ];

            choices.forEach(c => {
                const card = document.createElement('div');
                card.className = 'upgrade-card';
                card.innerHTML = `<h3>${c.name}</h3><p>${c.desc}</p><p style="color:#d4af37; margin-top:5px;">${upgrades[c.key] < 7 ? 'Upgrade (+1)' : 'MAXED'}</p>`;
                card.onclick = (e) => {
                    e.stopPropagation();
                    if (upgrades[c.key] < 7) upgrades[c.key]++;
                    closeUpgradeModal();
                };
                upgradeBox.appendChild(card);
            });

            document.getElementById('overlay-msg').style.display = 'flex';
        }

        function closeUpgradeModal() {
            document.getElementById('overlay-msg').style.display = 'none';
            if (level === 5) {
                stage++;
                level = 1;
            } else {
                level++;
            }
            setupLevel();
        }

        function showGameOverModal(title, desc) {
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-desc').innerText = desc;
            document.getElementById('upgrade-box').innerHTML = '';
            const btn = document.getElementById('overlay-btn');
            btn.style.display = 'inline-block';
            btn.innerText = "Play Again";
            btn.onclick = (e) => {
                e.stopPropagation();
                location.reload();
            };
            document.getElementById('overlay-msg').style.display = 'flex';
        }
    </script>

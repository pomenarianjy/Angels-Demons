<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angels & Demons & Banker</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #04060a;
            color: #d4af37;
            font-family: 'Times New Roman', Times, serif, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Fullscreen Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('start.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 12vh;
            z-index: 100;
        }
        #start-btn {
            background: linear-gradient(135deg, #8b6508, #daa520);
            border: 2px solid #fff;
            color: #fff;
            font-size: 2.2rem;
            font-weight: bold;
            padding: 15px 55px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(218, 165, 32, 0.9);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Main Game Layout */
        #game-container {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: row;
        }

        /* Left Pane: Storyline Pictures */
        #story-pane {
            width: 35%;
            height: 100%;
            background: rgba(8, 11, 18, 0.96);
            border-right: 3px solid #b8860b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        #story-img {
            max-width: 100%;
            max-height: 70vh;
            border: 2px solid #daa520;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.4);
            object-fit: contain;
        }
        #story-title {
            margin-top: 15px;
            font-size: 1.4rem;
            color: #f0e682;
            letter-spacing: 1px;
        }

        /* Right Pane: Game Box */
        #game-pane {
            width: 65%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Area: Battle Arena */
        #battle-arena {
            height: 52%;
            width: 100%;
            position: relative;
            background: url('sky.jpg') no-repeat center center;
            background-size: cover;
            overflow: hidden;
            border-bottom: 3px solid #b8860b;
        }

        #road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 45%;
            background: rgba(14, 20, 32, 0.88);
            border-top: 2px solid #d4af37;
        }

        #hero-container {
            position: absolute;
            left: 5%;
            bottom: 8%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        #hero {
            width: 55px;
            height: 85px;
            object-fit: contain;
        }
        #angel {
            position: absolute;
            left: 15%;
            bottom: 8%;
            width: 55px;
            height: 85px;
            object-fit: contain;
            display: none;
            z-index: 10;
        }

        /* Villains Container */
        #villains-container {
            position: absolute;
            right: 5%;
            bottom: 8%;
            display: flex;
            gap: 12px;
            align-items: flex-end;
            z-index: 10;
        }
        .villain-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            transition: transform 0.1s;
        }
        .villain-slot:hover {
            transform: scale(1.05);
        }
        .villain-slot.active-target {
            background: rgba(218, 165, 32, 0.25);
            border: 1px dashed #d4af37;
        }
        .v-hp-container {
            width: 45px;
            height: 5px;
            background: #222;
            border: 1px solid #d4af37;
            border-radius: 3px;
            margin-bottom: 3px;
            overflow: hidden;
        }
        .v-hp-bar {
            width: 100%;
            height: 100%;
            background: #b8860b;
            transition: width 0.2s;
        }
        .villain-img {
            width: 48px;
            height: 75px;
            object-fit: contain;
        }

        /* Bottom Area: 180-Degree Arc Claw Section */
        #claw-section {
            height: 48%;
            width: 100%;
            background: #0b0f19;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }

        #claw-track-arc {
            position: absolute;
            top: 10px;
            left: 50%;
            width: 80%;
            height: 120px;
            transform: translateX(-50%);
            border-top: 2px dashed rgba(212, 175, 55, 0.4);
            border-radius: 180px 180px 0 0;
            pointer-events: none;
        }

        #claw-crane-arm {
            position: absolute;
            top: 10px;
            left: 50%;
            width: 4px;
            height: 80px;
            background: #d4af37;
            transform-origin: top center;
            transform: translateX(-50%) rotate(0deg);
            transition: transform 0.4s ease-out;
            z-index: 15;
        }

        #claw-grabber {
            position: absolute;
            bottom: -15px;
            left: -16px;
            width: 32px;
            height: 20px;
            background: #daa520;
            border-radius: 3px;
            display: flex;
            justify-content: space-between;
            transition: width 0.3s;
        }
        .claw-claw-l, .claw-claw-r {
            width: 5px;
            height: 12px;
            background: #b8860b;
            position: absolute;
            bottom: -12px;
            transition: transform 0.2s;
        }
        .claw-claw-l { left: 0; transform-origin: top; }
        .claw-claw-r { right: 0; transform-origin: top; }

        #bead-pool {
            position: absolute;
            bottom: 10px;
            left: 5%;
            width: 90%;
            height: 100px;
            background: rgba(16, 23, 38, 0.9);
            border: 1px solid #b8860b;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .bead {
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(0,0,0,0.6);
            transition: transform 0.3s ease;
        }
        .bead-white {
            background: radial-gradient(circle, #ffffff 30%, #cccccc 100%);
            color: #333;
            border: 1px solid #aaa;
        }
        .bead-gold {
            background: radial-gradient(circle, #ffdf00 30%, #b8860b 100%);
            color: #000;
            border: 1px solid #fff;
            box-shadow: 0 0 12px #ffd700;
        }

        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 10px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: bold;
            color: #f0e682;
            text-shadow: 1px 1px 3px #000;
            z-index: 25;
        }

        /* Cardinal's Cross Bullet */
        .cardinal-bullet {
            position: absolute;
            width: 22px;
            height: 22px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 25;
            pointer-events: none;
        }
        .cardinal-bullet::before {
            content: '';
            position: absolute;
            width: 4px;
            height: 20px;
            background: #d4af37;
            box-shadow: 0 0 8px #fff;
        }
        .cardinal-bullet::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 4px;
            background: #d4af37;
            box-shadow: 0 0 8px #fff;
            top: 6px;
        }

        /* Angel Elements */
        .angel-halo {
            position: absolute;
            top: -14px;
            left: 12px;
            width: 28px;
            height: 9px;
            border: 2px solid gold;
            border-radius: 50%;
            box-shadow: 0 0 12px gold;
            animation: pulse-halo 1.5s infinite alternate;
        }
        .angel-wing {
            position: absolute;
            top: 18px;
            width: 22px;
            height: 40px;
            background: radial-gradient(circle, #fff 40%, rgba(218,165,32,0.6) 100%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #fff;
        }
        .wing-left { left: -20px; transform-origin: right center; animation: flap-left 0.4s infinite alternate; }
        .wing-right { right: -20px; transform-origin: left center; animation: flap-right 0.4s infinite alternate; }

        @keyframes flap-left { 0% { transform: rotate(0deg); } 100% { transform: rotate(-25deg); } }
        @keyframes flap-right { 0% { transform: rotate(0deg); } 100% { transform: rotate(25deg); } }
        @keyframes pulse-halo { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.1); opacity: 1; } }

        /* Modal Overlay & Upgrade Screen */
        #overlay-msg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 60;
            text-align: center;
            padding: 20px;
        }
        #overlay-msg h2 {
            font-size: 2.2rem;
            color: #f0e682;
            margin-bottom: 15px;
        }
        .upgrade-container {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .upgrade-card {
            background: #111827;
            border: 2px solid #b8860b;
            border-radius: 8px;
            padding: 15px;
            width: 180px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .upgrade-card:hover {
            transform: scale(1.05);
            background: #1f2937;
        }
        .upgrade-card h3 {
            font-size: 1.1rem;
            color: #f0e682;
            margin-top: 0;
        }
        .upgrade-card p {
            font-size: 0.85rem;
            color: #ccc;
        }
        #overlay-btn {
            background: #b8860b;
            color: #fff;
            border: 2px solid #fff;
            padding: 12px 35px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
            margin-top: 15px;
        }

        /* Sparks Celebration */
        .spark {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px gold, 0 0 20px #fff;
            pointer-events: none;
            animation: spark-fall 2s linear infinite;
        }
        @keyframes spark-fall {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) scale(0.3); opacity: 0; }
        }
        #fly-object {
            position: absolute;
            width: 80px;
            height: 80px;
            object-fit: contain;
            z-index: 70;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="start-screen">
        <button id="start-btn" onclick="startGame()">Start Game</button>
    </div>

    <!-- Main Container -->
    <div id="game-container">
        <!-- Left Pane: Storyline Pictures -->
        <div id="story-pane">
            <div id="story-title">Stage 1: The Detective</div>
            <img id="story-img" src="S1L1.png" alt="Storyline">
        </div>

        <!-- Right Pane: Game Box -->
        <div id="game-pane">
            <div id="hud">
                <div id="hud-info">Stage 1 - Level 1</div>
                <div id="hud-power">Power: 0 | Tap Pool for 180° Claw Drop</div>
            </div>

            <!-- Top Area: Battle Arena -->
            <div id="battle-arena">
                <div id="road">
                    <div id="hero-container">
                        <img id="hero" src="hero.png" alt="Hero">
                    </div>
                    <img id="angel" src="angel.png" alt="Angel">
                    <div id="villains-container"></div>
                </div>
            </div>

            <!-- Bottom Area: 180-Degree Arc Claw Section -->
            <div id="claw-section" onpointerdown="execute180Claw(event)">
                <div id="claw-track-arc"></div>
                <div id="claw-crane-arm" style="transform: translateX(-50%) rotate(0deg);">
                    <div id="claw-grabber" id="claw-grabber-box">
                        <div class="claw-claw-l" id="claw-l"></div>
                        <div class="claw-claw-r" id="claw-r"></div>
                    </div>
                </div>
                <div id="bead-pool"></div>
            </div>
        </div>
    </div>

    <!-- Modal Overlay & Upgrades Selector -->
    <div id="overlay-msg">
        <h2 id="msg-title">Level Cleared</h2>
        <p id="msg-desc" style="color: #fff; margin-bottom: 10px;"></p>
        <div id="upgrade-box" class="upgrade-container"></div>
        <button id="overlay-btn" style="display:none;" onclick="proceedNext()">Continue</button>
    </div>

    <!-- Celebration Fly Object -->
    <img id="fly-object" src="fly.png" alt="Fly">

    <script>
        let stage = 1;
        let level = 1;
        let heroPower = 0;
        let activeTargetIndex = 0;
        let isClawBusy = false;
        let villainsData = [];
        let beadsOnPool = [];

        // Upgrades up to 7 levels each
        let upgrades = {
            clawSize: 1,  // Max 7
            power: 1,     // Max 7
            bounce: 1     // Max 7
        };

        const villainFiles = {
            1: 'villain1.png', 2: 'villain2.png', 3: 'villain3.png', 4: 'villain4.png',
            5: 'villain5.png', 6: 'villain6.png', 7: 'villain7.png', 8: 'villain8.png'
        };

        const stagesConfig = {
            1: { name: "The Detective", prefix: "S1" },
            2: { name: "Detective’s Helper", prefix: "S2" },
            3: { name: "The Priest", prefix: "S3" },
            4: { name: "The Close", prefix: "S4" }
        };

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            setupLevel();
        }

        function setupLevel() {
            const cfg = stagesConfig[stage];
            document.getElementById('story-img').src = `${cfg.prefix}L${level}.png`;
            document.getElementById('story-title').innerText = `Stage ${stage}: ${cfg.name}`;
            document.getElementById('hud-info').innerText = `Stage ${stage} - Level ${level}`;

            document.getElementById('angel').style.display = 'none';

            // Difficulty scaling: more villains and harder stats each level & stage
            const villainCount = Math.min(3 + stage + Math.floor(level / 2), 7);
            villainsData = [];
            const container = document.getElementById('villains-container');
            container.innerHTML = '';

            for (let i = 0; i < villainCount; i++) {
                let vId = level === 5 ? Math.min(stage + 4, 8) : Math.min(stage + (i % 4), 8);
                let maxHp = level === 5 ? 180 + (stage * 30) : 50 + (stage * 15) + (level * 12);
                
                villainsData.push({ 
                    index: i, 
                    id: vId, 
                    hp: maxHp, 
                    maxHp: maxHp, 
                    distance: 140 + (i * 20) // Spaced out distances
                });

                const slot = document.createElement('div');
                slot.className = `villain-slot ${i === 0 ? 'active-target' : ''}`;
                slot.onclick = () => selectTarget(i);
                slot.innerHTML = `
                    <div class="v-hp-container"><div class="v-hp-bar" id="v-hp-${i}" style="width: 100%;"></div></div>
                    <img class="villain-img" src="${villainFiles[vId]}" alt="Villain">
                `;
                container.appendChild(slot);
            }
            activeTargetIndex = 0;
            spawnBeads();
        }

        function spawnBeads() {
            const pool = document.getElementById('bead-pool');
            pool.innerHTML = '';
            beadsOnPool = [];

            // More beads to be picked up in higher difficulty levels
            const totalBeads = 12 + (level * 3) + (stage * 2);
            for (let i = 0; i < totalBeads; i++) {
                const isGold = Math.random() < (0.2 + (upgrades.power * 0.02)); // Gold beads chance
                const x = 15 + Math.random() * (pool.clientWidth - 40);
                const y = 10 + Math.random() * (pool.clientHeight - 30);
                
                beadsOnPool.push({ id: i, type: isGold ? 'gold' : 'white', value: isGold ? (5 * upgrades.power) : (1 * upgrades.power), x, y, collected: false });

                const beadEl = document.createElement('div');
                beadEl.className = `bead ${isGold ? 'bead-gold' : 'bead-white'}`;
                beadEl.id = `bead-${i}`;
                beadEl.style.left = `${x}px`;
                beadEl.style.top = `${y}px`;
                beadEl.innerText = isGold ? '★' : '•';
                pool.appendChild(beadEl);
            }
        }

        // 180 Degree Claw Execution affected by Claw Size upgrade
        function execute180Claw(event) {
            if (isClawBusy) return;
            isClawBusy = true;

            const section = document.getElementById('claw-section');
            const rect = section.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            
            const ratio = Math.max(0, Math.min(1, clickX / rect.width));
            const angleDeg = (ratio * 180) - 90;

            const crane = document.getElementById('claw-crane-arm');
            const grabber = document.getElementById('claw-grabber');
            const lClaw = document.getElementById('claw-l');
            const rClaw = document.getElementById('claw-r');

            // Apply Claw Size upgrade width dynamically
            const grabberWidth = 32 + (upgrades.clawSize * 8);
            grabber.style.width = `${grabberWidth}px`;
            grabber.style.left = `-${grabberWidth / 2}px`;

            crane.style.transform = `translateX(-50%) rotate(${angleDeg}deg)`;

            setTimeout(() => {
                lClaw.style.transform = 'rotate(35deg)';
                rClaw.style.transform = 'rotate(-35deg)';

                setTimeout(() => {
                    let turnPoints = 0;
                    beadsOnPool.forEach(b => {
                        if (!b.collected) {
                            const normalizedXOffset = Math.abs((b.x / rect.width) - ratio);
                            // Catch zone width scales with claw size upgrade level (up to 7 levels)
                            const reachThreshold = 0.12 + (upgrades.clawSize * 0.03);
                            if (normalizedXOffset < reachThreshold) {
                                b.collected = true;
                                turnPoints += b.value;
                                const el = document.getElementById(`bead-${b.id}`);
                                if (el) el.style.transform = 'scale(0) translateY(-35px)';
                            }
                        }
                    });

                    heroPower += turnPoints;
                    document.getElementById('hud-power').innerText = `Power: ${heroPower} | Grabbed +${turnPoints} Pts!`;

                    crane.style.transform = 'translateX(-50%) rotate(0deg)';
                    lClaw.style.transform = 'rotate(0deg)';
                    rClaw.style.transform = 'rotate(0deg)';
                    isClawBusy = false;

                    if (beadsOnPool.every(b => b.collected)) {
                        spawnBeads();
                    }
                }, 400);
            }, 350);
        }

        function selectTarget(index) {
            if (villainsData[index].hp <= 0) return;
            activeTargetIndex = index;
            document.querySelectorAll('.villain-slot').forEach((el, idx) => {
                if (idx === index) el.classList.add('active-target');
                else el.classList.remove('active-target');
            });
            fireCrossBullet(index);
        }

        function fireCrossBullet(targetIndex) {
            if (heroPower <= 0) {
                document.getElementById('hud-power').innerText = `No Power! Drop the 180° claw to gather bead points!`;
                return;
            }

            const slots = document.querySelectorAll('.villain-slot');
            if (!slots[targetIndex]) return;

            const arena = document.getElementById('battle-arena');
            const bullet = document.createElement('div');
            bullet.className = 'cardinal-bullet';
            bullet.style.left = '12%';
            bullet.style.bottom = '18%';
            arena.appendChild(bullet);

            const targetRect = slots[targetIndex].getBoundingClientRect();
            const arenaRect = arena.getBoundingClientRect();
            const targetX = targetRect.left - arenaRect.left + (targetRect.width / 2);

            let currentX = arenaRect.width * 0.12;
            let distance = targetX - currentX;
            let steps = 18;
            let step = 0;

            const flight = setInterval(() => {
                step++;
                currentX += distance / steps;
                bullet.style.left = currentX + 'px';

                if (step >= steps) {
                    clearInterval(flight);
                    
                    // Bounce mechanics if bounce upgrade > 1
                    if (upgrades.bounce > 1 && step === steps) {
                        let bounceDist = 40 * upgrades.bounce;
                        bullet.style.left = (currentX + bounceDist) + 'px';
                        setTimeout(() => bullet.remove(), 150);
                    } else {
                        bullet.remove();
                    }

                    processDamage(targetIndex);
                }
            }, 18);
        }

        function processDamage(targetIndex) {
            let enemy = villainsData[targetIndex];
            if (!enemy || enemy.hp <= 0) return;

            // Bounce upgrade also adds bonus splash multiplier damage
            let damageDealt = heroPower + (upgrades.bounce * 3);
            heroPower = 0; 
            document.getElementById('hud-power').innerText = `Power: 0 | Gather beads to reload!`;

            enemy.hp -= damageDealt;
            const pct = Math.max(0, (enemy.hp / enemy.maxHp) * 100);
            document.getElementById(`v-hp-${targetIndex}`).style.width = pct + '%';

            if (enemy.hp <= 0) {
                document.querySelectorAll('.villain-slot')[targetIndex].style.opacity = '0.25';
                
                if (villainsData.every(e => e.hp <= 0)) {
                    triggerLevelClear();
                } else {
                    const nextAlive = villainsData.findIndex(e => e.hp > 0);
                    if (nextAlive !== -1) selectTarget(nextAlive);
                }
            } else {
                advanceVillains();
            }
        }

        function advanceVillains() {
            let heroDied = false;
            villainsData.forEach((v) => {
                if (v.hp > 0) {
                    v.distance -= (14 + stage * 2); // Encroach faster at higher stages
                    if (v.distance <= 35) {
                        heroDied = true;
                    }
                }
            });

            if (heroDied) {
                showGameOverModal("DEFEAT", "The villains breached your defenses and touched the hero!");
            }
        }

        function triggerLevelClear() {
            if (level === 5) {
                const angel = document.getElementById('angel');
                angel.style.display = 'block';

                setTimeout(() => {
                    if (!document.querySelector('.angel-halo')) {
                        const halo = document.createElement('div');
                        halo.className = 'angel-halo';
                        const wL = document.createElement('div');
                        wL.className = 'angel-wing wing-left';
                        const wR = document.createElement('div');
                        wR.className = 'angel-wing wing-right';
                        angel.appendChild(halo);
                        angel.appendChild(wL);
                        angel.appendChild(wR);
                    }
                }, 400);

                setTimeout(() => {
                    if (stage === 4) {
                        launchFinalCelebration();
                    } else {
                        showUpgradeModal(`Stage ${stage} Cleared`, "Choose a power-up before entering the next stage.");
                    }
                }, 1300);
            } else {
                showUpgradeModal(`Level ${level} Cleared`, "Choose one of 3 power-ups to enhance your equipment (Up to Level 7).");
            }
        }

        function showUpgradeModal(title, desc) {
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-desc').innerText = desc;
            document.getElementById('overlay-btn').style.display = 'none';

            const upgradeBox = document.getElementById('upgrade-box');
            upgradeBox.innerHTML = '';

            const choices = [
                { key: 'clawSize', name: 'Enhance Claw Size', desc: `Current Lvl: ${upgrades.clawSize}/7` },
                { key: 'power', name: 'Enhance Power', desc: `Current Lvl: ${upgrades.power}/7` },
                { key: 'bounce', name: 'Enhance Bounce', desc: `Current Lvl: ${upgrades.bounce}/7` }
            ];

            choices.forEach(c => {
                const card = document.createElement('div');
                card.className = 'upgrade-card';
                card.innerHTML = `<h3>${c.name}</h3><p>${c.desc}</p><p style="color:#d4af37; margin-top:5px;">${upgrades[c.key] < 7 ? 'Upgrade (+1)' : 'MAXED'}</p>`;
                card.onclick = () => {
                    if (upgrades[c.key] < 7) upgrades[c.key]++;
                    closeUpgradeModal();
                };
                upgradeBox.appendChild(card);
            });

            document.getElementById('overlay-msg').style.display = 'flex';
        }

        function closeUpgradeModal() {
            document.getElementById('overlay-msg').style.display = 'none';
            if (level === 5) {
                stage++;
                level = 1;
            } else {
                level++;
            }
            setupLevel();
        }

        function showGameOverModal(title, desc) {
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-desc').innerText = desc;
            document.getElementById('upgrade-box').innerHTML = '';
            document.getElementById('overlay-btn').style.display = 'inline-block';
            document.getElementById('overlay-btn').innerText = "Try Again";
            document.getElementById('overlay-btn').onclick = () => location.reload();
            document.getElementById('overlay-msg').style.display = 'flex';
        }

        function launchFinalCelebration() {
            const overlay = document.getElementById('overlay-msg');
            document.getElementById('msg-title').innerText = "CONGRATULATIONS";
            document.getElementById('msg-desc').innerText = "The grand conspiracy is unraveled. Truth and light triumph!";
            document.getElementById('upgrade-box').innerHTML = '';
            document.getElementById('overlay-btn').style.display = 'inline-block';
            document.getElementById('overlay-btn').innerText = "Play Again";
            document.getElementById('overlay-btn').onclick = () => location.reload();
            overlay.style.display = 'flex';

            const flyObj = document.getElementById('fly-object');
            flyObj.style.display = 'block';
            let posX = 50, posY = 50, vx = 2.2, vy = 1.8;

            setInterval(() => {
                posX += vx;
                posY += vy;
                if (posX <= 0 || posX >= window.innerWidth - 80) vx *= -1;
                if (posY <= 0 || posY >= window.innerHeight - 80) vy *= -1;
                flyObj.style.left = posX + 'px';
                flyObj.style.top = posY + 'px';
            }, 25);

            setInterval(() => {
                const sp = document.createElement('div');
                sp.className = 'spark';
                sp.style.left = Math.random() * window.innerWidth + 'px';
                sp.style.top = '0px';
                document.body.appendChild(sp);
                setTimeout(() => sp.remove(), 2000);
            }, 100);
        }
    </script>
</body>
</html>

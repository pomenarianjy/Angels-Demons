<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angels & Demons & Banker</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #05070c;
            color: #d4af37;
            font-family: 'Times New Roman', Times, serif, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Fullscreen Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('start.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 12vh;
            z-index: 100;
        }
        #start-btn {
            background: linear-gradient(135deg, #8b6508, #daa520);
            border: 2px solid #fff;
            color: #fff;
            font-size: 2.2rem;
            font-weight: bold;
            padding: 15px 55px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(218, 165, 32, 0.9);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Main Game Layout */
        #game-container {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: row;
        }

        /* Left Pane: Storyline Pictures */
        #story-pane {
            width: 35%;
            height: 100%;
            background: rgba(8, 11, 18, 0.96);
            border-right: 3px solid #b8860b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        #story-img {
            max-width: 100%;
            max-height: 70vh;
            border: 2px solid #daa520;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.4);
            object-fit: contain;
        }
        #story-title {
            margin-top: 15px;
            font-size: 1.4rem;
            color: #f0e682;
            letter-spacing: 1px;
        }

        /* Right Pane: Game Box */
        #game-pane {
            width: 65%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Area: Battle Arena (Sky + Middle Road Layout) */
        #battle-arena {
            height: 55%;
            width: 100%;
            position: relative;
            background: url('sky.jpg') no-repeat center center;
            background-size: cover;
            overflow: hidden;
            border-bottom: 3px solid #b8860b;
        }

        /* Middle/Lower Horizontal Road matching sky tones */
        #road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40%;
            background: rgba(14, 20, 32, 0.85);
            border-top: 2px solid #d4af37;
            display: flex;
            align-items: center;
        }

        /* Hero on Left Facing Right */
        #hero-container {
            position: absolute;
            left: 8%;
            bottom: 10%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        #hero {
            width: 65px;
            height: 95px;
            object-fit: contain;
            transform: scaleX(1); /* Facing right */
        }
        #angel {
            position: absolute;
            left: 20%;
            bottom: 10%;
            width: 65px;
            height: 95px;
            object-fit: contain;
            display: none;
            z-index: 10;
        }

        /* Villains Array on Right */
        #villains-container {
            position: absolute;
            right: 5%;
            bottom: 10%;
            display: flex;
            gap: 12px;
            align-items: flex-end;
            z-index: 10;
        }
        .villain-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 5px;
            border-radius: 6px;
            transition: transform 0.1s;
        }
        .villain-slot:hover {
            transform: scale(1.05);
        }
        .villain-slot.active-target {
            background: rgba(218, 165, 32, 0.2);
            border: 1px dashed #d4af37;
        }
        .v-hp-container {
            width: 50px;
            height: 6px;
            background: #222;
            border: 1px solid #d4af37;
            border-radius: 3px;
            margin-bottom: 4px;
            overflow: hidden;
        }
        .v-hp-bar {
            width: 100%;
            height: 100%;
            background: #b8860b;
            transition: width 0.2s;
        }
        .villain-img {
            width: 55px;
            height: 85px;
            object-fit: contain;
        }

        /* Bottom Area: Claw Machine Mechanics */
        #claw-section {
            height: 45%;
            width: 100%;
            background: #0b0f19;
            position: relative;
            overflow: hidden;
        }

        /* Claw Crane Rail & Head */
        #claw-rail {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 25px;
            background: #d4af37;
            transform: translateX(-50%);
            transition: left 0.08s ease-out;
        }
        #claw-head {
            position: absolute;
            top: 25px;
            left: -18px;
            width: 36px;
            height: 25px;
            background: #daa520;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }
        .claw-finger {
            width: 5px;
            height: 14px;
            background: #b8860b;
            position: absolute;
            bottom: -14px;
            transition: transform 0.2s;
        }
        .claw-left { left: 0; transform-origin: top; }
        .claw-right { right: 0; transform-origin: top; }

        /* Item Drop Area Pool */
        #claw-drop-zone {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: rgba(15, 22, 36, 0.9);
            border-top: 1px solid #b8860b;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 15px;
        }
        .claw-item-pod {
            width: 50px;
            height: 50px;
            background: rgba(218, 165, 32, 0.15);
            border: 2px solid #d4af37;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: #f0e682;
            font-weight: bold;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(218, 165, 32, 0.4);
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 10px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            font-weight: bold;
            color: #f0e682;
            text-shadow: 1px 1px 3px #000;
            z-index: 20;
        }

        /* Cardinal's Cross Bullet */
        .cardinal-bullet {
            position: absolute;
            width: 24px;
            height: 24px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 25;
            pointer-events: none;
        }
        .cardinal-bullet::before {
            content: '';
            position: absolute;
            width: 4px;
            height: 22px;
            background: #d4af37;
            box-shadow: 0 0 8px #fff;
        }
        .cardinal-bullet::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 4px;
            background: #d4af37;
            box-shadow: 0 0 8px #fff;
            top: 7px;
        }

        /* Angel Wings & Halo */
        .angel-halo {
            position: absolute;
            top: -15px;
            left: 17px;
            width: 30px;
            height: 10px;
            border: 2px solid gold;
            border-radius: 50%;
            box-shadow: 0 0 12px gold;
            animation: pulse-halo 1.5s infinite alternate;
        }
        .angel-wing {
            position: absolute;
            top: 20px;
            width: 25px;
            height: 45px;
            background: radial-gradient(circle, #fff 40%, rgba(218,165,32,0.6) 100%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #fff;
        }
        .wing-left { left: -22px; transform-origin: right center; animation: flap-left 0.4s infinite alternate; }
        .wing-right { right: -22px; transform-origin: left center; animation: flap-right 0.4s infinite alternate; }

        @keyframes flap-left { 0% { transform: rotate(0deg); } 100% { transform: rotate(-25deg); } }
        @keyframes flap-right { 0% { transform: rotate(0deg); } 100% { transform: rotate(25deg); } }
        @keyframes pulse-halo { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.1); opacity: 1; } }

        /* Modal Overlay */
        #overlay-msg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.88);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 60;
            text-align: center;
            padding: 20px;
        }
        #overlay-msg h2 {
            font-size: 2.5rem;
            color: #f0e682;
            margin-bottom: 15px;
        }
        #overlay-btn {
            background: #b8860b;
            color: #fff;
            border: 2px solid #fff;
            padding: 12px 35px;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
        }

        /* Sparks Celebration */
        .spark {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px gold, 0 0 20px #fff;
            pointer-events: none;
            animation: spark-fall 2s linear infinite;
        }
        @keyframes spark-fall {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) scale(0.3); opacity: 0; }
        }
        #fly-object {
            position: absolute;
            width: 80px;
            height: 80px;
            object-fit: contain;
            z-index: 70;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="start-screen">
        <button id="start-btn" onclick="startGame()">Start Game</button>
    </div>

    <!-- Main Container -->
    <div id="game-container">
        <!-- Left Pane: Storyline Pictures -->
        <div id="story-pane">
            <div id="story-title">Stage 1: The Detective</div>
            <img id="story-img" src="S1L1.png" alt="Storyline">
        </div>

        <!-- Right Pane: Game Box -->
        <div id="game-pane">
            <div id="hud">
                <div id="hud-info">Stage 1 - Level 1</div>
                <div id="hud-power">Power: 15 | Click Villain to Shoot</div>
            </div>

            <!-- Top Area: Battle Arena -->
            <div id="battle-arena">
                <div id="road">
                    <div id="hero-container">
                        <img id="hero" src="hero.png" alt="Hero">
                    </div>
                    <img id="angel" src="angel.png" alt="Angel">
                    <div id="villains-container"></div>
                </div>
            </div>

            <!-- Bottom Area: Claw Machine Section -->
            <div id="claw-section" onpointerdown="handleClawDrop(event)">
                <div id="claw-rail" style="left: 50%;">
                    <div id="claw-head">
                        <div class="claw-finger claw-left" id="left-finger"></div>
                        <div class="claw-finger claw-right" id="right-finger"></div>
                    </div>
                </div>
                <div id="claw-drop-zone">
                    <div class="claw-item-pod">PWR<br>+5</div>
                    <div class="claw-item-pod">CRIT<br>+10%</div>
                    <div class="claw-item-pod">RELIC<br>+1</div>
                    <div class="claw-item-pod">SPEED<br>+1</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Level Clear Modal -->
    <div id="overlay-msg">
        <h2 id="msg-title">Level Cleared</h2>
        <p id="msg-desc" style="color: #fff; margin-bottom: 20px;"></p>
        <button id="overlay-btn" onclick="proceedNext()">Continue</button>
    </div>

    <!-- Celebration Fly Object -->
    <img id="fly-object" src="fly.png" alt="Fly">

    <script>
        let stage = 1;
        let level = 1;
        let heroPower = 15;
        let activeTargetIndex = 0;
        let isClawBusy = false;
        let villainsData = [];

        const villainFiles = {
            1: 'villain1.png', 2: 'villain2.png', 3: 'villain3.png', 4: 'villain4.png',
            5: 'villain5.png', 6: 'villain6.png', 7: 'villain7.png', 8: 'villain8.png'
        };

        const stagesConfig = {
            1: { name: "The Detective", prefix: "S1" },
            2: { name: "Detective’s Helper", prefix: "S2" },
            3: { name: "The Priest", prefix: "S3" },
            4: { name: "The Close", prefix: "S4" }
        };

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            setupLevel();
        }

        function setupLevel() {
            const cfg = stagesConfig[stage];
            document.getElementById('story-img').src = `${cfg.prefix}L${level}.png`;
            document.getElementById('story-title').innerText = `Stage ${stage}: ${cfg.name}`;
            document.getElementById('hud-info').innerText = `Stage ${stage} - Level ${level}`;

            document.getElementById('angel').style.display = 'none';

            // Generate enemy array based on level progression
            const enemyCount = level === 5 ? 1 : Math.min(level, 3);
            villainsData = [];
            const container = document.getElementById('villains-container');
            container.innerHTML = '';

            for (let i = 0; i < enemyCount; i++) {
                let vId = level === 5 ? Math.min(stage + 4, 8) : Math.min(stage + i, 8);
                let maxHp = level === 5 ? 120 : 40 + (level * 15);
                
                villainsData.push({ index: i, id: vId, hp: maxHp, maxHp: maxHp });

                const slot = document.createElement('div');
                slot.className = `villain-slot ${i === 0 ? 'active-target' : ''}`;
                slot.onclick = () => selectTarget(i);
                slot.innerHTML = `
                    <div class="v-hp-container"><div class="v-hp-bar" id="v-hp-${i}" style="width: 100%;"></div></div>
                    <img class="villain-img" src="${villainFiles[vId]}" alt="Villain">
                `;
                container.appendChild(slot);
            }
            activeTargetIndex = 0;
        }

        function selectTarget(index) {
            if (villainsData[index].hp <= 0) return;
            activeTargetIndex = index;
            document.querySelectorAll('.villain-slot').forEach((el, idx) => {
                if (idx === index) el.classList.add('active-target');
                else el.classList.remove('active-target');
            });
            fireBulletAt(index);
        }

        function fireBulletAt(index) {
            const slots = document.querySelectorAll('.villain-slot');
            if (!slots[index]) return;

            const arena = document.getElementById('battle-arena');
            const bullet = document.createElement('div');
            bullet.className = 'cardinal-bullet';
            bullet.style.left = '14%';
            bullet.style.bottom = '20%';
            arena.appendChild(bullet);

            const targetRect = slots[index].getBoundingClientRect();
            const arenaRect = arena.getBoundingClientRect();
            const targetX = targetRect.left - arenaRect.left + (targetRect.width / 2);

            let currentX = arenaRect.width * 0.14;
            const distance = targetX - currentX;
            let steps = 20;
            let step = 0;

            const flyInterval = setInterval(() => {
                step++;
                currentX += distance / steps;
                bullet.style.left = currentX + 'px';

                if (step >= steps) {
                    clearInterval(flyInterval);
                    bullet.remove();
                    applyDamage(index);
                }
            }, 18);
        }

        function applyDamage(index) {
            let enemy = villainsData[index];
            if (!enemy || enemy.hp <= 0) return;

            enemy.hp -= heroPower;
            const pct = Math.max(0, (enemy.hp / enemy.maxHp) * 100);
            document.getElementById(`v-hp-${index}`).style.width = pct + '%';

            if (enemy.hp <= 0) {
                document.querySelectorAll('.villain-slot')[index].style.opacity = '0.3';
                
                if (villainsData.every(e => e.hp <= 0)) {
                    triggerLevelClear();
                } else {
                    const nextAlive = villainsData.findIndex(e => e.hp > 0);
                    if (nextAlive !== -1) selectTarget(nextAlive);
                }
            }
        }

        // Claw Machine Interactive Drop Control
        function handleClawDrop(event) {
            if (isClawBusy) return;
            isClawBusy = true;

            const section = document.getElementById('claw-section');
            const rect = section.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const dropPct = Math.max(10, Math.min(90, (clickX / rect.width) * 100));

            const rail = document.getElementById('claw-rail');
            rail.style.left = dropPct + '%';

            const head = document.getElementById('claw-head');
            const lFinger = document.getElementById('left-finger');
            const rFinger = document.getElementById('right-finger');

            setTimeout(() => {
                head.style.transition = 'top 0.25s ease-in-out';
                head.style.top = '100px';
                lFinger.style.transform = 'rotate(25deg)';
                rFinger.style.transform = 'rotate(-25deg)';

                setTimeout(() => {
                    heroPower += 5;
                    document.getElementById('hud-power').innerText = `Power: ${heroPower} | Power-Up Grabbed!`;

                    head.style.top = '25px';
                    lFinger.style.transform = 'rotate(0deg)';
                    rFinger.style.transform = 'rotate(0deg)';
                    isClawBusy = false;
                }, 450);
            }, 80);
        }

        function triggerLevelClear() {
            if (level === 5) {
                const angel = document.getElementById('angel');
                angel.style.display = 'block';

                setTimeout(() => {
                    if (!document.querySelector('.angel-halo')) {
                        const halo = document.createElement('div');
                        halo.className = 'angel-halo';
                        const wL = document.createElement('div');
                        wL.className = 'angel-wing wing-left';
                        const wR = document.createElement('div');
                        wR.className = 'angel-wing wing-right';
                        angel.appendChild(halo);
                        angel.appendChild(wL);
                        angel.appendChild(wR);
                    }
                }, 400);

                setTimeout(() => {
                    if (stage === 4) {
                        launchFinalCelebration();
                    } else {
                        showModal(`Stage ${stage} Clear`, `The divine bond is secured. Advancing to Stage ${stage + 1}.`);
                    }
                }, 1300);
            } else {
                showModal(`Level ${level} Cleared`, `Enemies vanquished. Ready for next phase.`);
            }
        }

        function showModal(title, desc) {
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-desc').innerText = desc;
            document.getElementById('overlay-msg').style.display = 'flex';
        }

        function proceedNext() {
            document.getElementById('overlay-msg').style.display = 'none';
            if (level === 5) {
                stage++;
                level = 1;
            } else {
                level++;
            }
            setupLevel();
        }

        function launchFinalCelebration() {
            const overlay = document.getElementById('overlay-msg');
            document.getElementById('msg-title').innerText = "CONGRATULATIONS";
            document.getElementById('msg-desc').innerText = "The grand conspiracy is unraveled. Truth and light triumph!";
            document.getElementById('overlay-btn').innerText = "Play Again";
            document.getElementById('overlay-btn').onclick = () => location.reload();
            overlay.style.display = 'flex';

            const flyObj = document.getElementById('fly-object');
            flyObj.style.display = 'block';
            let posX = 50, posY = 50, vx = 2.2, vy = 1.8;

            setInterval(() => {
                posX += vx;
                posY += vy;
                if (posX <= 0 || posX >= window.innerWidth - 80) vx *= -1;
                if (posY <= 0 || posY >= window.innerHeight - 80) vy *= -1;
                flyObj.style.left = posX + 'px';
                flyObj.style.top = posY + 'px';
            }, 25);

            setInterval(() => {
                const sp = document.createElement('div');
                sp.className = 'spark';
                sp.style.left = Math.random() * window.innerWidth + 'px';
                sp.style.top = '0px';
                document.body.appendChild(sp);
                setTimeout(() => sp.remove(), 2000);
            }, 100);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angels & Demons & Banker - Enhanced Hero & Diverse Treasure Heap</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #04060a;
            color: #d4af37;
            font-family: 'Times New Roman', Times, serif, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Fullscreen Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #060913;
            background-image: url('start.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 8vh;
            z-index: 100;
        }
        #start-btn {
            background: linear-gradient(135deg, #8b6508, #daa520);
            border: 2px solid #fff;
            color: #fff;
            font-size: 2.2rem;
            font-weight: bold;
            padding: 15px 55px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(218, 165, 32, 0.9);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Main Game Layout */
        #game-container {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: row;
        }

        /* Left Pane: Storyline Pictures */
        #story-pane {
            width: 35%;
            height: 100%;
            background: rgba(8, 11, 18, 0.96);
            border-right: 3px solid #b8860b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        #story-img {
            max-width: 100%;
            max-height: 70vh;
            border: 2px solid #daa520;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.4);
            object-fit: contain;
        }
        #story-title {
            margin-top: 15px;
            font-size: 1.4rem;
            color: #f0e682;
            letter-spacing: 1px;
        }

        /* Right Pane: Game Box */
        #game-pane {
            width: 65%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Area: Battle Arena with Invisible Formation Field */
        #battle-arena {
            height: 42%;
            width: 100%;
            position: relative;
            background: #090e1a;
            overflow: hidden;
            border-bottom: 3px solid #b8860b;
        }
        #road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: rgba(14, 20, 32, 0.75);
        }

        /* Hero & Angel (Made significantly bigger) */
        #hero-container {
            position: absolute;
            left: 5%;
            bottom: 10%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        #hero {
            width: 130px;
            height: 180px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(218, 165, 32, 0.7));
        }
        #angel {
            position: absolute;
            left: 18%;
            bottom: 10%;
            width: 130px;
            height: 180px;
            object-fit: contain;
            display: none;
            z-index: 10;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.7));
        }

        /* Completely Invisible 3x4 Grid Formation Field for Villains */
        #villains-grid-field {
            position: absolute;
            right: 3%;
            top: 8%;
            width: 58%;
            height: 84%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            z-index: 10;
            background: transparent;
            border: none;
        }
        .grid-cell {
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .villain-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 2px;
            border-radius: 6px;
            transition: transform 0.1s;
        }
        .villain-unit:hover {
            transform: scale(1.06);
        }
        .villain-unit.active-target {
            background: rgba(218, 165, 32, 0.2);
            border: 1px solid rgba(212, 175, 55, 0.6);
            box-shadow: 0 0 12px rgba(218, 165, 32, 0.4);
        }
        .villain-unit.disabled-target {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .v-hp-container {
            width: 38px;
            height: 4px;
            background: #222;
            border: 1px solid #d4af37;
            border-radius: 2px;
            margin-bottom: 2px;
            overflow: hidden;
        }
        .v-hp-bar {
            width: 100%;
            height: 100%;
            background: #b8860b;
        }
        .villain-img {
            width: 45px;
            height: 60px;
            object-fit: contain;
        }

        /* Bottom Area: 6-Direction Lucky Draw Claw Vault */
        #claw-section {
            height: 58%;
            width: 100%;
            background: #03050a;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #vault-pit {
            position: relative;
            flex-grow: 1;
            width: 92%;
            margin: 6px auto 0 auto;
            background: radial-gradient(circle at center, #0f172a 0%, #050811 100%);
            border-top: 3px solid #b8860b;
            border-left: 3px solid #1f293d;
            border-right: 3px solid #1f293d;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            overflow: hidden;
        }

        #claw-pivot {
            position: absolute;
            top: 4px;
            left: 50%;
            width: 18px;
            height: 18px;
            background: #daa520;
            border-radius: 50%;
            transform: translateX(-50%);
            z-index: 30;
            box-shadow: 0 0 12px #f0e682;
        }

        #rotating-arm {
            position: absolute;
            top: 13px;
            left: 50%;
            width: 6px;
            height: 30px;
            background: linear-gradient(90deg, #8b6508, #daa520);
            transform-origin: top center;
            transform: translateX(-50%) rotate(0deg);
            z-index: 25;
            pointer-events: none;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), height 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #claw-head {
            position: absolute;
            bottom: -22px;
            left: 50%;
            width: 36px;
            height: 22px;
            transform: translateX(-50%);
            display: flex;
            justify-content: space-between;
            z-index: 26;
        }
        .claw-hook-l, .claw-hook-r {
            width: 10px;
            height: 22px;
            background: #b8860b;
            border: 1px solid #f0e682;
        }
        .claw-hook-l { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
        .claw-hook-r { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }

        #bead-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* Overflowing compact diverse treasure heap beads */
        .treasure-bead {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: bold;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.7), 0 3px 6px rgba(0,0,0,0.9);
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
        }

        /* 6 Direction Control Deck */
        #direction-deck {
            height: 72px;
            background: #080c16;
            border-top: 2px solid #b8860b;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 0 10px;
            z-index: 40;
        }

        .dir-btn {
            background: linear-gradient(135deg, #111827, #1f2937);
            border: 2px solid #b8860b;
            color: #f0e682;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 14.5%;
            max-width: 110px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: all 0.15s ease;
        }
        .dir-btn:hover {
            background: linear-gradient(135deg, #1f2937, #374151);
            border-color: #f0e682;
            transform: translateY(-2px);
        }
        .dir-btn:active {
            transform: translateY(1px);
        }
        .dir-label {
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .dir-value {
            font-size: 0.85rem;
            color: #38bdf8;
            margin-top: 2px;
            font-weight: bold;
        }

        /* HUD Overlays */
        #hud {
            position: absolute;
            top: 8px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: bold;
            color: #f0e682;
            text-shadow: 1px 1px 2px #000;
            z-index: 40;
        }

        /* Cardinal's Cross Bullet */
        .cardinal-bullet {
            position: absolute;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 25;
            pointer-events: none;
        }
        .cardinal-bullet::before {
            content: '';
            position: absolute;
            width: 4px;
            height: 20px;
            background: #d4af37;
            box-shadow: 0 0 8px #fff;
        }
        .cardinal-bullet::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 4px;
            background: #d4af37;
            box-shadow: 0 0 8px #fff;
            top: 6px;
        }

        /* Modal Overlay & Upgrades Selector */
        #overlay-msg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 60;
            text-align: center;
            padding: 20px;
        }
        #overlay-msg h2 {
            font-size: 2.2rem;
            color: #f0e682;
            margin-bottom: 15px;
        }
        .upgrade-container {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .upgrade-card {
            background: #111827;
            border: 2px solid #b8860b;
            border-radius: 8px;
            padding: 12px;
            width: 160px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .upgrade-card:hover {
            transform: scale(1.05);
            background: #1f2937;
        }
        .upgrade-card h3 {
            font-size: 1rem;
            color: #f0e682;
            margin-top: 0;
        }
        .upgrade-card p {
            font-size: 0.8rem;
            color: #ccc;
        }
        #overlay-btn {
            background: #b8860b;
            color: #fff;
            border: 2px solid #fff;
            padding: 12px 35px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Start Screen with start.jpg background -->
    <div id="start-screen">
        <button id="start-btn" onclick="startGame()">Start Game</button>
    </div>

    <!-- Main Container -->
    <div id="game-container">
        <!-- Left Pane: Storyline Pictures -->
        <div id="story-pane">
            <div id="story-title">Stage 1: The Detective</div>
            <img id="story-img" src="S1L1.png" alt="Storyline">
        </div>

        <!-- Right Pane: Game Box -->
        <div id="game-pane">
            <div id="hud">
                <div id="hud-info">Stage 1 - Level 1</div>
                <div id="hud-power">Power: 0 | Pick one of the 6 lucky directions below to scoop high-value treasures!</div>
            </div>

            <!-- Top Area: Battle Arena with Invisible Formation Field -->
            <div id="battle-arena">
                <div id="road">
                    <div id="hero-container">
                        <img id="hero" src="hero.png" alt="Hero">
                    </div>
                    <img id="angel" src="angel.png" alt="Angel">
                    <!-- Invisible 3x4 Grid Formation Container -->
                    <div id="villains-grid-field"></div>
                </div>
            </div>

            <!-- Bottom Area: Compact Treasure Heap Pit & 6-Direction Lucky Draw Claw -->
            <div id="claw-section">
                <div id="vault-pit">
                    <div id="claw-pivot"></div>
                    <div id="rotating-arm">
                        <div id="claw-head">
                            <div class="claw-hook-l"></div>
                            <div class="claw-hook-r"></div>
                        </div>
                    </div>
                    <div id="bead-container"></div>
                </div>

                <!-- 6 Lucky Draw Direction Deck -->
                <div id="direction-deck">
                    <button class="dir-btn" onclick="triggerLuckyDraw(0)">
                        <span class="dir-label">Far Left</span>
                        <span class="dir-value" id="val-0">+0</span>
                    </button>
                    <button class="dir-btn" onclick="triggerLuckyDraw(1)">
                        <span class="dir-label">Mid Left</span>
                        <span class="dir-value" id="val-1">+0</span>
                    </button>
                    <button class="dir-btn" onclick="triggerLuckyDraw(2)">
                        <span class="dir-label">Center-L</span>
                        <span class="dir-value" id="val-2">+0</span>
                    </button>
                    <button class="dir-btn" onclick="triggerLuckyDraw(3)">
                        <span class="dir-label">Center-R</span>
                        <span class="dir-value" id="val-3">+0</span>
                    </button>
                    <button class="dir-btn" onclick="triggerLuckyDraw(4)">
                        <span class="dir-label">Mid Right</span>
                        <span class="dir-value" id="val-4">+0</span>
                    </button>
                    <button class="dir-btn" onclick="triggerLuckyDraw(5)">
                        <span class="dir-label">Far Right</span>
                        <span class="dir-value" id="val-5">+0</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Overlay & Upgrades Selector -->
    <div id="overlay-msg">
        <h2 id="msg-title">Level Cleared</h2>
        <p id="msg-desc" style="color: #fff; margin-bottom: 10px;"></p>
        <div id="upgrade-box" class="upgrade-container"></div>
        <button id="overlay-btn" style="display:none;" onclick="proceedNext()">Continue</button>
    </div>

    <script>
        let stage = 1;
        let level = 1;
        let heroPower = 0;
        let isClawBusy = false;
        let gridData = []; 
        let treasureBeads = [];
        let directionValues = [0, 0, 0, 0, 0, 0];

        let upgrades = {
            reach: 1,  
            power: 1,  
            bounce: 1  
        };

        const villainFiles = {
            1: 'villain1.png', 2: 'villain2.png', 3: 'villain3.png', 4: 'villain4.png',
            5: 'villain5.png', 6: 'villain6.png', 7: 'villain7.png', 8: 'villain8.png'
        };

        const stagesConfig = {
            1: { name: "The Detective", prefix: "S1" },
            2: { name: "Detective’s Helper", prefix: "S2" },
            3: { name: "The Priest", prefix: "S3" },
            4: { name: "The Close", prefix: "S4" }
        };

        // Expanded and highly diverse treasure tiers with much higher distinct power values and unique colors/symbols
        const beadTiers = [
            { name: 'Bronze', baseValue: 5, color: 'radial-gradient(circle at 30% 30%, #d97706 0%, #b45309 60%, #78350f 100%)', symbol: 'B', size: 16, weight: 0.28 },
            { name: 'Jade', baseValue: 12, color: 'radial-gradient(circle at 30% 30%, #34d399 0%, #059669 60%, #065f46 100%)', symbol: 'J', size: 18, weight: 0.24 },
            { name: 'Sapphire', baseValue: 25, color: 'radial-gradient(circle at 30% 30%, #60a5fa 0%, #2563eb 100%, #1e40af 100%)', symbol: 'S', size: 20, weight: 0.18 },
            { name: 'Ruby', baseValue: 50, color: 'radial-gradient(circle at 30% 30%, #f87171 0%, #dc2626 60%, #991b1b 100%)', symbol: 'R', size: 22, weight: 0.14 },
            { name: 'Amethyst', baseValue: 90, color: 'radial-gradient(circle at 30% 30%, #c084fc 0%, #9333ea 60%, #581c87 100%)', symbol: 'A', size: 24, weight: 0.10 },
            { name: 'Diamond', baseValue: 150, color: 'radial-gradient(circle at 30% 30%, #a5f3fc 0%, #06b6d4 60%, #0e7490 100%)', symbol: '💎', size: 26, weight: 0.06 }
        ];

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            setupLevel();
        }

        function setupLevel() {
            const cfg = stagesConfig[stage];
            document.getElementById('story-img').src = `${cfg.prefix}L${level}.png`;
            document.getElementById('story-title').innerText = `Stage ${stage}: ${cfg.name}`;
            document.getElementById('hud-info').innerText = `Stage ${stage} - Level ${level}`;
            document.getElementById('angel').style.display = 'none';

            gridData = [];
            for (let r = 0; r < 3; r++) {
                let rowArr = [];
                for (let c = 0; c < 4; c++) {
                    if (Math.random() < 0.75) {
                        let vId = level === 5 ? Math.min(stage + 4, 8) : Math.min(stage + ((r + c) % 4), 8);
                        let maxHp = level === 5 ? 400 + (stage * 80) : 150 + (stage * 50) + (level * 35);
                        rowArr.push({
                            row: r,
                            col: c,
                            id: vId,
                            hp: maxHp,
                            maxHp: maxHp
                        });
                    } else {
                        rowArr.push(null);
                    }
                }
                gridData.push(rowArr);
            }

            let colZeroHasVillain = gridData.some(row => row[0] !== null);
            if (!colZeroHasVillain) {
                let rRand = Math.floor(Math.random() * 3);
                let vId = Math.min(stage, 8);
                let maxHp = 150 + (stage * 50);
                gridData[rRand][0] = { row: rRand, col: 0, id: vId, hp: maxHp, maxHp: maxHp };
            }

            renderGrid();
            initTreasureHeap();
        }

        function renderGrid() {
            const field = document.getElementById('villains-grid-field');
            field.innerHTML = '';

            let activeCol = -1;
            for (let c = 0; c < 4; c++) {
                let hasAlive = false;
                for (let r = 0; r < 3; r++) {
                    if (gridData[r][c] !== null && gridData[r][c].hp > 0) {
                        hasAlive = true;
                        break;
                    }
                }
                if (hasAlive) {
                    activeCol = c;
                    break;
                }
            }

            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 4; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    
                    const villain = gridData[r][c];
                    if (villain !== null && villain.hp > 0) {
                        const unit = document.createElement('div');
                        let isTargetable = (c === activeCol);
                        unit.className = `villain-unit ${isTargetable ? 'active-target' : 'disabled-target'}`;
                        
                        if (isTargetable) {
                            unit.onclick = () => fireCrossBullet(r, c);
                        }

                        let pct = Math.max(0, (villain.hp / villain.maxHp) * 100);
                        unit.innerHTML = `
                            <div class="v-hp-container"><div class="v-hp-bar" style="width: ${pct}%;"></div></div>
                            <img class="villain-img" src="${villainFiles[villain.id]}" alt="Villain" onerror="this.src='hero.png';">
                        `;
                        cell.appendChild(unit);
                    }
                    field.appendChild(cell);
                }
            }

            if (activeCol === -1) {
                triggerLevelClear();
            }
        }

        function initTreasureHeap() {
            const container = document.getElementById('bead-container');
            container.innerHTML = '';
            treasureBeads = [];

            const pit = document.getElementById('vault-pit');
            const pitWidth = pit.clientWidth || 350;
            const pitHeight = pit.clientHeight || 180;

            let idCounter = 0;
            let totalBeads = 75;

            for (let i = 0; i < totalBeads; i++) {
                let randW = Math.random();
                let cumulative = 0;
                let selectedTier = beadTiers[0];
                for (let t of beadTiers) {
                    cumulative += t.weight;
                    if (randW <= cumulative) {
                        selectedTier = t;
                        break;
                    }
                }

                let x = 20 + Math.random() * (pitWidth - 40);
                let centerFactor = 1 - Math.abs(x - (pitWidth / 2)) / (pitWidth / 2);
                let y = 5 + Math.random() * (pitHeight * 0.55 + centerFactor * 35);

                treasureBeads.push({
                    id: idCounter,
                    tier: selectedTier.name,
                    value: selectedTier.baseValue * upgrades.power,
                    x: x,
                    y: y,
                    collected: false
                });

                const beadEl = document.createElement('div');
                beadEl.className = 'treasure-bead';
                beadEl.id = `bead-${idCounter}`;
                beadEl.style.width = `${selectedTier.size}px`;
                beadEl.style.height = `${selectedTier.size}px`;
                beadEl.style.left = `${x - selectedTier.size / 2}px`;
                beadEl.style.bottom = `${y}px`;
                beadEl.style.background = selectedTier.color;
                beadEl.style.color = '#fff';
                beadEl.innerText = selectedTier.symbol;
                container.appendChild(beadEl);
                idCounter++;
            }

            updateDirectionValues();
        }

        function updateDirectionValues() {
            const angles = [-65, -38, -12, 12, 38, 65];
            const pit = document.getElementById('vault-pit');
            const pitWidth = pit.clientWidth || 350;
            const pivotX = pitWidth / 2;
            const pivotY = 13;
            const reach = 120 + (upgrades.reach * 15);

            for (let i = 0; i < 6; i++) {
                let angleRad = angles[i] * (Math.PI / 180);
                let targetX = pivotX + Math.sin(angleRad) * reach;
                let targetYFromBottom = pit.clientHeight - pivotY - Math.cos(angleRad) * reach;

                let sumVal = 0;
                treasureBeads.forEach(b => {
                    if (!b.collected) {
                        let dist = Math.hypot(b.x - targetX, b.y - targetYFromBottom);
                        if (dist < 65) {
                            sumVal += b.value;
                        }
                    }
                });

                if (sumVal === 0) {
                    sumVal = (20 + Math.floor(Math.random() * 50)) * upgrades.power;
                }

                directionValues[i] = sumVal;
                document.getElementById(`val-${i}`).innerText = `+${sumVal}`;
            }
        }

        function triggerLuckyDraw(dirIndex) {
            if (isClawBusy) return;
            isClawBusy = true;

            const angles = [-65, -38, -12, 12, 38, 65];
            let targetAngle = angles[dirIndex];
            let targetReach = 120 + (upgrades.reach * 15);

            const arm = document.getElementById('rotating-arm');
            arm.style.transform = `translateX(-50%) rotate(${targetAngle}deg)`;
            arm.style.height = `${targetReach}px`;

            setTimeout(() => {
                let earned = directionValues[dirIndex];
                
                const pit = document.getElementById('vault-pit');
                let pivotX = pit.clientWidth / 2;
                let pivotY = 13;
                let angleRad = targetAngle * (Math.PI / 180);
                let tipX = pivotX + Math.sin(angleRad) * targetReach;
                let tipYFromBottom = pit.clientHeight - pivotY - Math.cos(angleRad) * targetReach;

                treasureBeads.forEach(b => {
                    if (!b.collected) {
                        let dist = Math.hypot(b.x - tipX, b.y - tipYFromBottom);
                        if (dist < 70) {
                            b.collected = true;
                            const el = document.getElementById(`bead-${b.id}`);
                            if (el) {
                                el.style.transform = 'scale(0) translateY(-40px)';
                                el.style.opacity = '0';
                            }
                        }
                    }
                });

                heroPower += earned;
                document.getElementById('hud-power').innerText = `Power: ${heroPower} | Lucky Draw Scooped +${earned}! Click target villain!`;

                arm.style.height = '30px';
                arm.style.transform = 'translateX(-50%) rotate(0deg)';

                setTimeout(() => {
                    isClawBusy = false;
                    if (treasureBeads.every(b => b.collected)) {
                        initTreasureHeap();
                    } else {
                        updateDirectionValues();
                    }
                }, 250);
            }, 250);
        }

        function fireCrossBullet(r, c) {
            if (heroPower <= 0) {
                document.getElementById('hud-power').innerText = `No Power! Choose one of the 6 lucky draw directions below first!`;
                return;
            }

            const arena = document.getElementById('battle-arena');
            const bullet = document.createElement('div');
            bullet.className = 'cardinal-bullet';
            bullet.style.left = '14%';
            bullet.style.bottom = '22%';
            arena.appendChild(bullet);

            const field = document.getElementById('villains-grid-field');
            const arenaRect = arena.getBoundingClientRect();
            const fieldRect = field.getBoundingClientRect();
            
            const targetX = fieldRect.left - arenaRect.left + (c + 0.5) * (fieldRect.width / 4);
            const targetY = fieldRect.top - arenaRect.top + (r + 0.5) * (fieldRect.height / 3);

            let currentX = arenaRect.width * 0.14;
            let currentY = arenaRect.height * 0.78;
            let distanceX = targetX - currentX;
            let distanceY = targetY - currentY;
            let steps = 18;
            let step = 0;

            const flight = setInterval(() => {
                step++;
                currentX += distanceX / steps;
                currentY += distanceY / steps;
                bullet.style.left = currentX + 'px';
                bullet.style.bottom = (arenaRect.height - currentY) + 'px';

                if (step >= steps) {
                    clearInterval(flight);
                    bullet.remove();
                    processDamage(r, c);
                }
            }, 18);
        }

        function processDamage(r, c) {
            let villain = gridData[r][c];
            if (!villain || villain.hp <= 0) return;

            let damageDealt = heroPower + (upgrades.bounce * 15);
            heroPower = 0;
            document.getElementById('hud-power').innerText = `Power: 0 | Select a lucky draw direction to reload!`;

            villain.hp -= damageDealt;

            if (villain.hp <= 0) {
                gridData[r][c] = null; 
            }

            renderGrid();
        }

        function triggerLevelClear() {
            if (level === 5) {
                document.getElementById('angel').style.display = 'block';
                setTimeout(() => {
                    if (stage === 4) {
                        showGameOverModal("VICTORY", "All formations defeated! Light triumphs!");
                    } else {
                        showUpgradeModal(`Stage ${stage} Cleared`, "Choose an upgrade before entering next stage.");
                    }
                }, 1000);
            } else {
                showUpgradeModal(`Level ${level} Cleared`, "Select a power-up for your equipment (Up to Level 7).");
            }
        }

        function showUpgradeModal(title, desc) {
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-desc').innerText = desc;
            document.getElementById('overlay-btn').style.display = 'none';

            const upgradeBox = document.getElementById('upgrade-box');
            upgradeBox.innerHTML = '';

            const choices = [
                { key: 'reach', name: 'Enhance Reach', desc: `Current Lvl: ${upgrades.reach}/7` },
                { key: 'power', name: 'Enhance Power', desc: `Current Lvl: ${upgrades.power}/7` },
                { key: 'bounce', name: 'Enhance Bounce', desc: `Current Lvl: ${upgrades.bounce}/7` }
            ];

            choices.forEach(c => {
                const card = document.createElement('div');
                card.className = 'upgrade-card';
                card.innerHTML = `<h3>${c.name}</h3><p>${c.desc}</p><p style="color:#d4af37; margin-top:5px;">${upgrades[c.key] < 7 ? 'Upgrade (+1)' : 'MAXED'}</p>`;
                card.onclick = () => {
                    if (upgrades[c.key] < 7) upgrades[c.key]++;
                    closeUpgradeModal();
                };
                upgradeBox.appendChild(card);
            });

            document.getElementById('overlay-msg').style.display = 'flex';
        }

        function closeUpgradeModal() {
            document.getElementById('overlay-msg').style.display = 'none';
            if (level === 5) {
                stage++;
                level = 1;
            } else {
                level++;
            }
            setupLevel();
        }

        function showGameOverModal(title, desc) {
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-desc').innerText = desc;
            document.getElementById('upgrade-box').innerHTML = '';
            document.getElementById('overlay-btn').style.display = 'inline-block';
            document.getElementById('overlay-btn').innerText = "Play Again";
            document.getElementById('overlay-btn').onclick = () => location.reload();
            document.getElementById('overlay-msg').style.display = 'flex';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angels & Demons & Banker - Grand Mechanical Claw & Diverse Treasure Heap</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #04060a;
            color: #d4af37;
            font-family: 'Times New Roman', Times, serif, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Fullscreen Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #060913;
            background-image: url('start.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 8vh;
            z-index: 100;
        }
        #start-btn {
            background: linear-gradient(135deg, #8b6508, #daa520);
            border: 2px solid #fff;
            color: #fff;
            font-size: 2.2rem;
            font-weight: bold;
            padding: 15px 55px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(218, 165, 32, 0.9);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Main Game Layout */
        #game-container {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: row;
        }

        /* Left Pane: Storyline Pictures */
        #story-pane {
            width: 35%;
            height: 100%;
            background: rgba(8, 11, 18, 0.96);
            border-right: 3px solid #b8860b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        #story-img {
            max-width: 100%;
            max-height: 70vh;
            border: 2px solid #daa520;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.4);
            object-fit: contain;
        }
        #story-title {
            margin-top: 15px;
            font-size: 1.4rem;
            color: #f0e682;
            letter-spacing: 1px;
        }

        /* Right Pane: Game Box */
        #game-pane {
            width: 65%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Area: Battle Arena with Invisible Formation Field */
        #battle-arena {
            height: 42%;
            width: 100%;
            position: relative;
            background: #090e1a;
            overflow: hidden;
            border-bottom: 3px solid #b8860b;
        }
        #road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: rgba(14, 20, 32, 0.75);
        }

        /* Hero & Angel (Distinctly separate, massive hero picture) */
        #hero-container {
            position: absolute;
            left: 5%;
            bottom: 10%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        #hero {
            width: 160px;
            height: 220px;
            object-fit: contain;
            filter: drop-shadow(0 0 22px rgba(218, 165, 32, 0.85));
        }
        #angel {
            position: absolute;
            left: 21%;
            bottom: 10%;
            width: 160px;
            height: 220px;
            object-fit: contain;
            display: none;
            z-index: 10;
            filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.85));
        }

        /* Completely Invisible 3x4 Grid Formation Field exclusively for Villains */
        #villains-grid-field {
            position: absolute;
            right: 3%;
            top: 8%;
            width: 58%;
            height: 84%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            z-index: 10;
            background: transparent;
            border: none;
        }
        .grid-cell {
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .villain-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 2px;
            border-radius: 6px;
            transition: transform 0.1s;
        }
        .villain-unit:hover {
            transform: scale(1.06);
        }
        .villain-unit.active-target {
            background: rgba(218, 165, 32, 0.2);
            border: 1px solid rgba(212, 175, 55, 0.6);
            box-shadow: 0 0 12px rgba(218, 165, 32, 0.4);
        }
        .villain-unit.disabled-target {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .v-hp-container {
            width: 38px;
            height: 4px;
            background: #222;
            border: 1px solid #d4af37;
            border-radius: 2px;
            margin-bottom: 2px;
            overflow: hidden;
        }
        .v-hp-bar {
            width: 100%;
            height: 100%;
            background: #b8860b;
        }
        .villain-img {
            width: 45px;
            height: 60px;
            object-fit: contain;
        }

        /* Bottom Area: Grand Mechanical Claw Vault */
        #claw-section {
            height: 58%;
            width: 100%;
            background: #03050a;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #vault-pit {
            position: relative;
            flex-grow: 1;
            width: 94%;
            margin: 6px auto 0 auto;
            background: radial-gradient(circle at center, #0f172a 0%, #050811 100%);
            border-top: 3px solid #b8860b;
            border-left: 3px solid #1f293d;
            border-right: 3px solid #1f293d;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            overflow: hidden;
        }

        /* Grand Gantry Track & Mechanical Grand Claw Assembly */
        #gantry-track {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background: linear-gradient(90deg, #374151, #9ca3af, #374151);
            border-bottom: 2px solid #b8860b;
            z-index: 28;
        }

        #claw-rig {
            position: absolute;
            top: 12px;
            left: 50%;
            width: 50px;
            height: 20px;
            transform: translateX(-50%);
            transition: left 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 30;
        }

        #vertical-cable {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 25px;
            background: linear-gradient(90deg, #b8860b, #f0e682, #b8860b);
            transform: translateX(-50%);
            transition: height 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Grand Ornamented Claw Head */
        #grand-claw-head {
            position: absolute;
            top: 25px;
            left: 50%;
            width: 56px;
            height: 36px;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: top 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .claw-crown {
            width: 32px;
            height: 12px;
            background: linear-gradient(135deg, #b8860b, #f0e682);
            border: 1px solid #fff;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(218, 165, 32, 0.9);
        }

        .claw-prongs {
            display: flex;
            justify-content: space-between;
            width: 56px;
            height: 24px;
            margin-top: -2px;
        }

        .prong-l, .prong-r {
            width: 16px;
            height: 24px;
            background: linear-gradient(135deg, #d4af37, #8b6508);
            border: 1px solid #fff;
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
            transition: transform 0.3s ease;
        }
        .prong-l {
            border-top-left-radius: 10px;
            border-bottom-left-radius: 12px;
            transform-origin: top right;
            transform: rotate(-15deg);
        }
        .prong-r {
            border-top-right-radius: 10px;
            border-bottom-right-radius: 12px;
            transform-origin: top left;
            transform: rotate(15deg);
        }
        #grand-claw-head.closed .prong-l { transform: rotate(10deg); }
        #grand-claw-head.closed .prong-r { transform: rotate(-10deg); }

        #bead-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* Diverse Treasure Heap Beads */
        .treasure-bead {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: bold;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.7), 0 3px 6px rgba(0,0,0,0.9);
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
        }

        /* 6 Direction Arrow Deck right beneath the claw vault */
        #direction-deck {
            height: 60px;
            background: #080c16;
            border-top: 2px solid #b8860b;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 0 10px;
            z-index: 40;
        }

        .dir-arrow-btn {
            background: linear-gradient(135deg, #111827, #1f2937);
            border: 2px solid #b8860b;
            color: #f0e682;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: all 0.15s ease;
            width: 14%;
            max-width: 90px;
            text-align: center;
        }
        .dir-arrow-btn:hover {
            background: linear-gradient(135deg, #1f2937, #374151);
            border-color: #f0e682;
            transform: translateY(-2px);
            box-shadow: 0 0 12px rgba(218, 165, 32, 0.6);
        }
        .dir-arrow-btn:active {
            transform: translateY(1px);
        }

        /* HUD Overlays */
        #hud {
            position: absolute;
            top: 8px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: bold;
            color: #f0e682;
            text-shadow: 1px 1px 2px #000;
            z-index: 40;
        }

        /* Cardinal's Cross Bullet */
        .cardinal-bullet {
            position: absolute;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 25;
            pointer-events: none;
        }
        .cardinal-bullet::before {
            content: '';
            position: absolute;
            width: 4px;
            height: 20px;
            background: #d4af37;
            box-shadow: 0 0 8px #fff;
        }
        .cardinal-bullet::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 4px;
            background: #d4af37;
            box-shadow: 0 0 8px #fff;
            top: 6px;
        }

        /* Modal Overlay & Upgrades Selector */
        #overlay-msg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 60;
            text-align: center;
            padding: 20px;
        }
        #overlay-msg h2 {
            font-size: 2.2rem;
            color: #f0e682;
            margin-bottom: 15px;
        }
        .upgrade-container {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .upgrade-card {
            background: #111827;
            border: 2px solid #b8860b;
            border-radius: 8px;
            padding: 12px;
            width: 160px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .upgrade-card:hover {
            transform: scale(1.05);
            background: #1f2937;
        }
        .upgrade-card h3 {
            font-size: 1rem;
            color: #f0e682;
            margin-top: 0;
        }
        .upgrade-card p {
            font-size: 0.8rem;
            color: #ccc;
        }
        #overlay-btn {
            background: #b8860b;
            color: #fff;
            border: 2px solid #fff;
            padding: 12px 35px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Start Screen with start.jpg background -->
    <div id="start-screen">
        <button id="start-btn" onclick="startGame()">Start Game</button>
    </div>

    <!-- Main Container -->
    <div id="game-container">
        <!-- Left Pane: Storyline Pictures -->
        <div id="story-pane">
            <div id="story-title">Stage 1: The Detective</div>
            <img id="story-img" src="S1L1.png" alt="Storyline">
        </div>

        <!-- Right Pane: Game Box -->
        <div id="game-pane">
            <div id="hud">
                <div id="hud-info">Stage 1 - Level 1</div>
                <div id="hud-power">Power: 0 | Select a direction arrow below to deploy the grand mechanical claw!</div>
            </div>

            <!-- Top Area: Battle Arena with Invisible Formation Field -->
            <div id="battle-arena">
                <div id="road">
                    <div id="hero-container">
                        <img id="hero" src="hero.png" alt="Hero">
                    </div>
                    <img id="angel" src="angel.png" alt="Angel">
                    <!-- Invisible 3x4 Grid Formation Field strictly for Villains -->
                    <div id="villains-grid-field"></div>
                </div>
            </div>

            <!-- Bottom Area: Grand Mechanical Claw Vault & 6 Direction Arrow Deck -->
            <div id="claw-section">
                <div id="vault-pit">
                    <div id="gantry-track"></div>
                    <div id="claw-rig" style="left: 50%;">
                        <div id="vertical-cable" style="height: 25px;"></div>
                        <div id="grand-claw-head">
                            <div class="claw-crown"></div>
                            <div class="claw-prongs">
                                <div class="prong-l"></div>
                                <div class="prong-r"></div>
                            </div>
                        </div>
                    </div>
                    <div id="bead-container"></div>
                </div>

                <!-- 6 Direction Arrow Deck right beneath the claw vault -->
                <div id="direction-deck">
                    <button class="dir-arrow-btn" onclick="deployClaw(0)">1 &larr;</button>
                    <button class="dir-arrow-btn" onclick="deployClaw(1)">2 &larr;</button>
                    <button class="dir-arrow-btn" onclick="deployClaw(2)">3 &larr;</button>
                    <button class="dir-arrow-btn" onclick="deployClaw(3)">4 &rarr;</button>
                    <button class="dir-arrow-btn" onclick="deployClaw(4)">5 &rarr;</button>
                    <button class="dir-arrow-btn" onclick="deployClaw(5)">6 &rarr;</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Overlay & Upgrades Selector -->
    <div id="overlay-msg">
        <h2 id="msg-title">Level Cleared</h2>
        <p id="msg-desc" style="color: #fff; margin-bottom: 10px;"></p>
        <div id="upgrade-box" class="upgrade-container"></div>
        <button id="overlay-btn" style="display:none;" onclick="proceedNext()">Continue</button>
    </div>

    <script>
        let stage = 1;
        let level = 1;
        let heroPower = 0;
        let isClawBusy = false;
        let gridData = []; 
        let treasureBeads = [];

        let upgrades = {
            reach: 1,  
            power: 1,  
            bounce: 1  
        };

        const villainFiles = {
            1: 'villain1.png', 2: 'villain2.png', 3: 'villain3.png', 4: 'villain4.png',
            5: 'villain5.png', 6: 'villain6.png', 7: 'villain7.png', 8: 'villain8.png'
        };

        const stagesConfig = {
            1: { name: "The Detective", prefix: "S1" },
            2: { name: "Detective’s Helper", prefix: "S2" },
            3: { name: "The Priest", prefix: "S3" },
            4: { name: "The Close", prefix: "S4" }
        };

        // Diverse treasure tiers with unique colors, symbols, and high power yield
        const beadTiers = [
            { name: 'Bronze', baseValue: 8, color: 'radial-gradient(circle at 30% 30%, #d97706 0%, #b45309 60%, #78350f 100%)', symbol: 'B', size: 16, weight: 0.28 },
            { name: 'Jade', baseValue: 18, color: 'radial-gradient(circle at 30% 30%, #34d399 0%, #059669 60%, #065f46 100%)', symbol: 'J', size: 18, weight: 0.24 },
            { name: 'Sapphire', baseValue: 35, color: 'radial-gradient(circle at 30% 30%, #60a5fa 0%, #2563eb 100%, #1e40af 100%)', symbol: 'S', size: 20, weight: 0.18 },
            { name: 'Ruby', baseValue: 70, color: 'radial-gradient(circle at 30% 30%, #f87171 0%, #dc2626 60%, #991b1b 100%)', symbol: 'R', size: 22, weight: 0.14 },
            { name: 'Amethyst', baseValue: 120, color: 'radial-gradient(circle at 30% 30%, #c084fc 0%, #9333ea 60%, #581c87 100%)', symbol: 'A', size: 24, weight: 0.10 },
            { name: 'Diamond', baseValue: 200, color: 'radial-gradient(circle at 30% 30%, #a5f3fc 0%, #06b6d4 60%, #0e7490 100%)', symbol: '💎', size: 26, weight: 0.06 }
        ];

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            setupLevel();
        }

        function setupLevel() {
            const cfg = stagesConfig[stage];
            document.getElementById('story-img').src = `${cfg.prefix}L${level}.png`;
            document.getElementById('story-title').innerText = `Stage ${stage}: ${cfg.name}`;
            document.getElementById('hud-info').innerText = `Stage ${stage} - Level ${level}`;
            document.getElementById('angel').style.display = 'none';

            gridData = [];
            for (let r = 0; r < 3; r++) {
                let rowArr = [];
                for (let c = 0; c < 4; c++) {
                    if (Math.random() < 0.75) {
                        // Strict check: Only pick from villainFiles, never hero.png
                        let vId = level === 5 ? Math.min(stage + 4, 8) : Math.min(stage + ((r + c) % 4), 8);
                        let maxHp = level === 5 ? 400 + (stage * 80) : 150 + (stage * 50) + (level * 35);
                        rowArr.push({
                            row: r,
                            col: c,
                            id: vId,
                            hp: maxHp,
                            maxHp: maxHp
                        });
                    } else {
                        rowArr.push(null);
                    }
                }
                gridData.push(rowArr);
            }

            let colZeroHasVillain = gridData.some(row => row[0] !== null);
            if (!colZeroHasVillain) {
                let rRand = Math.floor(Math.random() * 3);
                let vId = Math.min(stage, 8);
                let maxHp = 150 + (stage * 50);
                gridData[rRand][0] = { row: rRand, col: 0, id: vId, hp: maxHp, maxHp: maxHp };
            }

            renderGrid();
            initTreasureHeap();
        }

        function renderGrid() {
            const field = document.getElementById('villains-grid-field');
            field.innerHTML = '';

            let activeCol = -1;
            for (let c = 0; c < 4; c++) {
                let hasAlive = false;
                for (let r = 0; r < 3; r++) {
                    if (gridData[r][c] !== null && gridData[r][c].hp > 0) {
                        hasAlive = true;
                        break;
                    }
                }
                if (hasAlive) {
                    activeCol = c;
                    break;
                }
            }

            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 4; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    
                    const villain = gridData[r][c];
                    if (villain !== null && villain.hp > 0) {
                        const unit = document.createElement('div');
                        let isTargetable = (c === activeCol);
                        unit.className = `villain-unit ${isTargetable ? 'active-target' : 'disabled-target'}`;
                        
                        if (isTargetable) {
                            unit.onclick = () => fireCrossBullet(r, c);
                        }

                        let pct = Math.max(0, (villain.hp / villain.maxHp) * 100);
                        unit.innerHTML = `
                            <div class="v-hp-container"><div class="v-hp-bar" style="width: ${pct}%;"></div></div>
                            <img class="villain-img" src="${villainFiles[villain.id]}" alt="Villain" onerror="this.src='villain1.png';">
                        `;
                        cell.appendChild(unit);
                    }
                    field.appendChild(cell);
                }
            }

            if (activeCol === -1) {
                triggerLevelClear();
            }
        }

        function initTreasureHeap() {
            const container = document.getElementById('bead-container');
            container.innerHTML = '';
            treasureBeads = [];

            const pit = document.getElementById('vault-pit');
            const pitWidth = pit.clientWidth || 350;
            const pitHeight = pit.clientHeight || 180;

            let idCounter = 0;
            let totalBeads = 75;

            for (let i = 0; i < totalBeads; i++) {
                let randW = Math.random();
                let cumulative = 0;
                let selectedTier = beadTiers[0];
                for (let t of beadTiers) {
                    cumulative += t.weight;
                    if (randW <= cumulative) {
                        selectedTier = t;
                        break;
                    }
                }

                let x = 20 + Math.random() * (pitWidth - 40);
                let centerFactor = 1 - Math.abs(x - (pitWidth / 2)) / (pitWidth / 2);
                let y = 5 + Math.random() * (pitHeight * 0.55 + centerFactor * 35);

                treasureBeads.push({
                    id: idCounter,
                    tier: selectedTier.name,
                    value: selectedTier.baseValue * upgrades.power,
                    x: x,
                    y: y,
                    collected: false
                });

                const beadEl = document.createElement('div');
                beadEl.className = 'treasure-bead';
                beadEl.id = `bead-${idCounter}`;
                beadEl.style.width = `${selectedTier.size}px`;
                beadEl.style.height = `${selectedTier.size}px`;
                beadEl.style.left = `${x - selectedTier.size / 2}px`;
                beadEl.style.bottom = `${y}px`;
                beadEl.style.background = selectedTier.color;
                beadEl.style.color = '#fff';
                beadEl.innerText = selectedTier.symbol;
                container.appendChild(beadEl);
                idCounter++;
            }
        }

        function deployClaw(dirIndex) {
            if (isClawBusy) return;
            isClawBusy = true;

            const pit = document.getElementById('vault-pit');
            const pitWidth = pit.clientWidth || 350;
            
            // 6 sections across the pit width
            const sectionWidth = pitWidth / 6;
            const targetX = (dirIndex * sectionWidth) + (sectionWidth / 2);
            
            const clawRig = document.getElementById('claw-rig');
            const verticalCable = document.getElementById('vertical-cable');
            const grandHead = document.getElementById('grand-claw-head');

            // 1. Smooth Horizontal Movement
            clawRig.style.left = `${targetX}px`;

            setTimeout(() => {
                // 2. Slow drop down into the treasure heap
                let dropHeight = 90 + (upgrades.reach * 12);
                verticalCable.style.height = `${dropHeight}px`;
                grandHead.style.top = `${dropHeight}px`;

                setTimeout(() => {
                    // 3. Close the grand claw prongs
                    grandHead.classList.add('closed');

                    setTimeout(() => {
                        let scoopedPower = 0;
                        let dropTipY = pit.clientHeight - dropHeight - 36;

                        treasureBeads.forEach(b => {
                            if (!b.collected) {
                                let dist = Math.hypot(b.x - targetX, b.y - dropTipY);
                                if (dist < 55) {
                                    b.collected = true;
                                    scoopedPower += b.value;
                                    const el = document.getElementById(`bead-${b.id}`);
                                    if (el) {
                                        el.style.transform = 'scale(0) translateY(-50px)';
                                        el.style.opacity = '0';
                                    }
                                }
                            }
                        });

                        if (scoopedPower === 0) {
                            scoopedPower = 40 * upgrades.power; // Guarantee reward if empty spot
                        }

                        heroPower += scoopedPower;
                        document.getElementById('hud-power').innerText = `Power: ${heroPower} | Grand Claw scooped +${scoopedPower}! Select a target villain!`;

                        // 4. Retract claw and open prongs
                        verticalCable.style.height = '25px';
                        grandHead.style.top = '25px';
                        grandHead.classList.remove('closed');

                        setTimeout(() => {
                            isClawBusy = false;
                            if (treasureBeads.every(b => b.collected)) {
                                initTreasureHeap();
                            }
                        }, 600);
                    }, 350);
                }, 600);
            }, 600);
        }

        function fireCrossBullet(r, c) {
            if (heroPower <= 0) {
                document.getElementById('hud-power').innerText = `No Power! Deploy the grand mechanical claw below first!`;
                return;
            }

            const arena = document.getElementById('battle-arena');
            const bullet = document.createElement('div');
            bullet.className = 'cardinal-bullet';
            bullet.style.left = '14%';
            bullet.style.bottom = '22%';
            arena.appendChild(bullet);

            const field = document.getElementById('villains-grid-field');
            const arenaRect = arena.getBoundingClientRect();
            const fieldRect = field.getBoundingClientRect();
            
            const targetX = fieldRect.left - arenaRect.left + (c + 0.5) * (fieldRect.width / 4);
            const targetY = fieldRect.top - arenaRect.top + (r + 0.5) * (fieldRect.height / 3);

            let currentX = arenaRect.width * 0.14;
            let currentY = arenaRect.height * 0.78;
            let distanceX = targetX - currentX;
            let distanceY = targetY - currentY;
            let steps = 18;
            let step = 0;

            const flight = setInterval(() => {
                step++;
                currentX += distanceX / steps;
                currentY += distanceY / steps;
                bullet.style.left = currentX + 'px';
                bullet.style.bottom = (arenaRect.height - currentY) + 'px';

                if (step >= steps) {
                    clearInterval(flight);
                    bullet.remove();
                    processDamage(r, c);
                }
            }, 18);
        }

        function processDamage(r, c) {
            let villain = gridData[r][c];
            if (!villain || villain.hp <= 0) return;

            let damageDealt = heroPower + (upgrades.bounce * 15);
            heroPower = 0;
            document.getElementById('hud-power').innerText = `Power: 0 | Deploy the grand mechanical claw to reload!`;

            villain.hp -= damageDealt;

            if (villain.hp <= 0) {
                gridData[r][c] = null; 
            }

            renderGrid();
        }

        function triggerLevelClear() {
            if (level === 5) {
                document.getElementById('angel').style.display = 'block';
                setTimeout(() => {
                    if (stage === 4) {
                        showGameOverModal("VICTORY", "All formations defeated! Light triumphs!");
                    } else {
                        showUpgradeModal(`Stage ${stage} Cleared`, "Choose an upgrade before entering next stage.");
                    }
                }, 1000);
            } else {
                showUpgradeModal(`Level ${level} Cleared`, "Select a power-up for your equipment (Up to Level 7).");
            }
        }

        function showUpgradeModal(title, desc) {
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-desc').innerText = desc;
            document.getElementById('overlay-btn').style.display = 'none';

            const upgradeBox = document.getElementById('upgrade-box');
            upgradeBox.innerHTML = '';

            const choices = [
                { key: 'reach', name: 'Enhance Reach', desc: `Current Lvl: ${upgrades.reach}/7` },
                { key: 'power', name: 'Enhance Power', desc: `Current Lvl: ${upgrades.power}/7` },
                { key: 'bounce', name: 'Enhance Bounce', desc: `Current Lvl: ${upgrades.bounce}/7` }
            ];

            choices.forEach(c => {
                const card = document.createElement('div');
                card.className = 'upgrade-card';
                card.innerHTML = `<h3>${c.name}</h3><p>${c.desc}</p><p style="color:#d4af37; margin-top:5px;">${upgrades[c.key] < 7 ? 'Upgrade (+1)' : 'MAXED'}</p>`;
                card.onclick = () => {
                    if (upgrades[c.key] < 7) upgrades[c.key]++;
                    closeUpgradeModal();
                };
                upgradeBox.appendChild(card);
            });

            document.getElementById('overlay-msg').style.display = 'flex';
        }

        function closeUpgradeModal() {
            document.getElementById('overlay-msg').style.display = 'none';
            if (level === 5) {
                stage++;
                level = 1;
            } else {
                level++;
            }
            setupLevel();
        }

        function showGameOverModal(title, desc) {
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-desc').innerText = desc;
            document.getElementById('upgrade-box').innerHTML = '';
            document.getElementById('overlay-btn').style.display = 'inline-block';
            document.getElementById('overlay-btn').innerText = "Play Again";
            document.getElementById('overlay-btn').onclick = () => location.reload();
            document.getElementById('overlay-msg').style.display = 'flex';
        }
    </script>
</body>
</html>

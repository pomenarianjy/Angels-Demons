<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angles & Demons & Banker</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #04060a;
            color: #d4af37;
            font-family: 'Times New Roman', Times, serif, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Fullscreen Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #060913;
            background-image: url('start.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 8vh;
            z-index: 100;
        }
        #start-btn {
            background: linear-gradient(135deg, #8b6508, #daa520);
            border: 2px solid #fff;
            color: #fff;
            font-size: 2.2rem;
            font-weight: bold;
            padding: 15px 55px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(218, 165, 32, 0.9);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Main Game Layout */
        #game-container {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: row;
        }

        /* Left Pane: Storyline Pictures */
        #story-pane {
            width: 35%;
            height: 100%;
            background: rgba(8, 11, 18, 0.96);
            border-right: 3px solid #b8860b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        #story-img {
            max-width: 100%;
            max-height: 70vh;
            border: 2px solid #daa520;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.4);
            object-fit: contain;
        }
        #story-title {
            margin-top: 15px;
            font-size: 1.4rem;
            color: #f0e682;
            letter-spacing: 1px;
        }

        /* Right Pane: Game Box */
        #game-pane {
            width: 65%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Area: Battle Arena with Formation Field */
        #battle-arena {
            height: 52%;
            width: 100%;
            position: relative;
            background-color: #090e1a;
            overflow: hidden;
            border-bottom: 3px solid #b8860b;
        }
        #road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(4, 6, 10, 0.55), rgba(4, 6, 10, 0.55)), url('sky.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
        }

        /* Hero & Angel Containers - Resized to match visible pixel dimensions (approx 170px tall) */
        #hero-container {
            position: absolute;
            left: 5%;
            bottom: 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            transition: left 2.5s ease-in-out;
        }
        #hero {
            width: auto;       
            height: 170px;      
            object-fit: contain;
            filter: drop-shadow(0 0 22px rgba(218, 165, 32, 0.85));
        }

        #angel-container {
            position: absolute;
            right: 5%;
            bottom: 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 15; /* Raised z-index again so it's above Hero if they meet */
            display: none;
        }
        #angel {
            width: auto;      
            height: 170px;      
            object-fit: contain;
            filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.9));
            position: relative;
        }

        .angel-halo {
            position: absolute;
            top: -8px; /* Adjusted for 170px height */
            width: 45px; /* Adjusted for 170px height */
            height: 15px; /* Adjusted for 170px height */
            border: 2px solid #fde047;
            border-radius: 50%;
            box-shadow: 0 0 12px #fde047;
            animation: haloGlow 1s infinite alternate;
            display: none;
        }
        @keyframes haloGlow {
            from { transform: scale(1); box-shadow: 0 0 10px #fde047; }
            to { transform: scale(1.1); box-shadow: 0 0 25px #fff; }
        }

        .white-heart {
            position: absolute;
            color: #ffffff;
            font-size: 20px;
            pointer-events: none;
            animation: heartFirework 1.2s forwards ease-out;
            z-index: 1;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #fde047;
        }
        @keyframes heartFirework {
            0% { transform: translate(0, 0) scale(0.4); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1.3); opacity: 0; }
        }

        /* Strict 3x4 Grid Formation Field */
        #villains-grid-field {
            position: absolute;
            right: 2%;
            top: 2%;
            width: 62%;
            height: 96%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            z-index: 10;
            background: transparent;
            border: none;
        }
        .grid-cell {
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .villain-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 1px;
            border-radius: 6px;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            transition: transform 0.1s;
            opacity: 1.0 !important; /* Reverted: Units are NOT faded if not first */
        }
        .villain-unit:hover {
            transform: scale(1.1);
        }
        .villain-unit.active-target .villain-img {
            filter: drop-shadow(0 0 12px rgba(218, 165, 32, 0.9));
            transform: scale(1.06);
        }
        .villain-unit.disabled-target {
            /* Reverted: Units are NOT faded if not first */
            opacity: 1.0 !important; 
            cursor: pointer; /* Reverted: Can click any visible villain */
        }
        .v-hp-container {
            width: 48px;
            height: 4px;
            background: #222;
            border: 1px solid #d4af37;
            border-radius: 2px;
            margin-bottom: 1px;
            overflow: hidden;
        }
        .v-hp-bar {
            width: 100%;
            height: 100%;
            background: #b8860b;
        }
        .villain-img {
            width: 64px;
            height: 82px;
            object-fit: contain;
            transition: transform 0.2s, filter 0.2s;
        }
        /* Explicit Boss Mapping & Styling */
        .villain-img.boss-img {
            width: 115px;
            height: 145px;
            filter: drop-shadow(0 0 15px rgba(255, 69, 0, 0.8));
        }

        /* Bottom Area: Grand Mechanical Claw Vault */
        #claw-section {
            height: 48%;
            width: 100%;
            background: #03050a;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #vault-pit {
            position: relative;
            flex-grow: 1;
            width: 94%;
            margin: 4px auto 0 auto;
            background-image: linear-gradient(rgba(3, 5, 10, 0.6), rgba(3, 5, 10, 0.6)), url('ground.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            border-top: 3px solid #b8860b;
            border-left: 3px solid #1f293d;
            border-right: 3px solid #1f293d;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            overflow: hidden;
        }

        #gantry-track {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(90deg, #374151, #9ca3af, #374151);
            border-bottom: 2px solid #b8860b;
            z-index: 28;
        }

        #claw-rig {
            position: absolute;
            top: 10px;
            left: 50%;
            width: 50px;
            height: 20px;
            transform: translateX(-50%);
            transition: left 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 30;
        }

        #vertical-cable {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 20px;
            background: linear-gradient(90deg, #b8860b, #f0e682, #b8860b);
            transform: translateX(-50%);
            transition: height 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #grand-claw-head {
            position: absolute;
            top: 20px;
            left: 50%;
            width: 56px;
            height: 36px;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: top 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .claw-crown {
            width: 32px;
            height: 12px;
            background: linear-gradient(135deg, #b8860b, #f0e682);
            border: 1px solid #fff;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(218, 165, 32, 0.9);
        }

        .claw-prongs {
            display: flex;
            justify-content: space-between;
            width: 56px;
            height: 24px;
            margin-top: -2px;
        }

        .prong-l, .prong-r {
            width: 16px;
            height: 24px;
            background: linear-gradient(135deg, #d4af37, #8b6508);
            border: 1px solid #fff;
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
            transition: transform 0.2s ease;
        }
        .prong-l {
            border-top-left-radius: 10px;
            border-bottom-left-radius: 12px;
            transform-origin: top right;
            transform: rotate(-15deg);
        }
        .prong-r {
            border-top-right-radius: 10px;
            border-bottom-right-radius: 12px;
            transform-origin: top left;
            transform: rotate(15deg);
        }
        #grand-claw-head.closed .prong-l { transform: rotate(10deg); }
        #grand-claw-head.closed .prong-r { transform: rotate(-10deg); }

        #bead-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .treasure-bead {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.8), inset 0 -2px 4px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.4);
            transition: transform 0.2s ease-out, opacity 0.2s ease-out;
        }

        /* 6 Direction Arrow Deck */
        #direction-deck {
            height: 52px;
            background: #080c16;
            border-top: 2px solid #b8860b;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 0 10px;
            z-index: 40;
        }

            background: linear-gradient(135deg, #111827, #1f2937);
            border:

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angles & Demons & Banker</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #04060a;
            color: #d4af37;
            font-family: 'Times New Roman', Times, serif, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Fullscreen Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #060913;
            background-image: url('start.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 8vh;
            z-index: 100;
        }
        #start-btn {
            background: linear-gradient(135deg, #8b6508, #daa520);
            border: 2px solid #fff;
            color: #fff;
            font-size: 2.2rem;
            font-weight: bold;
            padding: 15px 55px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(218, 165, 32, 0.9);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Main Game Layout */
        #game-container {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: row;
        }

        /* Left Pane: Storyline Pictures */
        #story-pane {
            width: 50%;
            height: 100%;
            background-image: linear-gradient(rgba(4, 6, 10, 0.75), rgba(4, 6, 10, 0.75)), url('left.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            border-right: 3px solid #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        #story-img {
            max-width: 100%;
            max-height: 65vh;
            border: 2px solid #daa520;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.4);
            object-fit: contain;
        }
        #story-title {
            margin-top: 15px;
            font-size: 1.4rem;
            color: #f0e682;
            letter-spacing: 1px;
            text-shadow: 1px 1px 3px #000;
        }

        /* Right Pane: Game Box */
        #game-pane {
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Area: Battle Arena */
        #battle-arena {
            height: 52%;
            width: 100%;
            position: relative;
            background-color: #090e1a;
            overflow: hidden;
            border-bottom: 3px solid #000000;
        }
        #road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(4, 6, 10, 0.55), rgba(4, 6, 10, 0.55)), url('sky.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
        }

        /* Hero Container & Movement */
        #hero-container {
            position: absolute;
            left: 5%;
            bottom: 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            transition: left 2.5s ease-in-out;
        }
        #hero {
            width: 150px;      
            height: 225px;      
            object-fit: contain;
            filter: drop-shadow(0 0 22px rgba(218, 165, 32, 0.85));
        }

        /* Attack Projectile Animation */
        .attack-projectile {
            position: absolute;
            width: 24px;
            height: 24px;
            background: radial-gradient(circle, #ff4500, #ff0000);
            border-radius: 50%;
            box-shadow: 0 0 12px #ff4500;
            z-index: 25;
            pointer-events: none;
            transition: all 0.4s linear;
        }

        /* Angel Container & Alignment */
        #angel-container {
            position: absolute;
            right: 5%;
            bottom: 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 15;
            cursor: pointer;
            display: none;
        }
        #angel {
            width: 130px;      
            height: 195px;      
            object-fit: contain;
            filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.9));
            position: relative;
        }

        .angel-halo {
            position: absolute;
            top: -5px;
            width: 48px;
            height: 16px;
            border: 2px solid #fde047;
            border-radius: 50%;
            box-shadow: 0 0 15px #fde047;
            animation: haloGlow 1s infinite alternate;
            display: none;
        }
        @keyframes haloGlow {
            from { transform: scale(1); box-shadow: 0 0 10px #fde047; }
            to { transform: scale(1.1); box-shadow: 0 0 25px #fff; }
        }

        .white-heart {
            position: absolute;
            color: #ffffff;
            font-size: 20px;
            pointer-events: none;
            animation: heartFirework 1.4s forwards ease-out;
            z-index: 1;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #fde047;
        }
        @keyframes heartFirework {
            0% { transform: translate(0, 0) scale(0.4); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1.4); opacity: 0; }
        }

        /* Strict 3x4 Grid Formation Field */
        #villains-grid-field {
            position: absolute;
            right: 2%;
            top: 2%;
            width: 62%;
            height: 96%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            z-index: 10;
            background: transparent;
            border: none;
        }
        .grid-cell {
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .villain-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 1px;
            border-radius: 6px;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            transition: transform 0.1s;
            opacity: 1.0 !important;
        }
        .villain-unit:hover {
            transform: scale(1.1);
        }
        .villain-unit.active-target .villain-img {
            filter: drop-shadow(0 0 12px rgba(218, 165, 32, 0.9));
            transform: scale(1.06);
        }
        .v-hp-container {
            width: 48px;
            height: 4px;
            background: #222;
            border: 1px solid #d4af37;
            border-radius: 2px;
            margin-bottom: 1px;
            overflow: hidden;
        }
        .v-hp-bar {
            width: 100%;
            height: 100%;
            background: #b8860b;
        }
        .villain-img {
            width: 64px;
            height: 82px;
            object-fit: contain;
            transition: transform 0.2s, filter 0.2s;
        }
        .villain-img.boss-img {
            width: 115px;
            height: 145px;
            filter: drop-shadow(0 0 15px rgba(255, 69, 0, 0.8));
        }

        /* Bottom Area: New Case Vault (Keeps background.png) */
        #claw-section {
            height: 48%;
            width: 100%;
            background-color: #03050a;
            background-image: linear-gradient(rgba(3, 5, 10, 0.3), rgba(3, 5, 10, 0.3)), url('background.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Cases Container: 6 case.png side by side horizontally */
        #cases-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 700px;
            margin-bottom: 15px;
        }
        .case-card {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }
        .case-card:hover:not(.opened) {
            transform: scale(1.08);
        }
        .case-img {
            width: 75px;
            height: 95px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(218, 165, 32, 0.6));
        }
        .case-val {
            margin-top: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #f0e682;
            text-shadow: 1px 1px 2px #000;
            min-height: 24px;
        }
        .case-card.opened {
            opacity: 0.5;
            cursor: default;
        }

        /* Turn info message */
        #turn-info {
            font-size: 1.1rem;
            color: #f0e682;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
            background: rgba(4, 6, 10, 0.8);
            padding: 6px 16px;
            border-radius: 6px;
            border: 1px solid #b8860b;
        }

        /* Boosters Dock */
        #boosters-dock {
            height: 65px;
            background: #050811;
            border-top: 1px solid #000000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 8px;
            z-index: 40;
        }
        .booster-slot {
            background: linear-gradient(135deg, #111827, #1f2937);
            border: 2px solid #b8860b;
            border-radius: 8px;
            width: 31%;
            height: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            box-shadow: 0 0 10px rgba(184, 134, 11, 0.2);
            transition: transform 0.1s, border-color 0.2s;
        }
        .booster-slot:active {
            transform: scale(0.96);
        }
        .booster-slot.maxed {
            border-color: #ef4444;
            opacity: 0.65;
            cursor: not-allowed;
            pointer-events: none;
        }
        .booster-name {
            font-size: 0.75rem;
            color: #f0e682;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .booster-counter {
            font-size: 0.8rem;
            color: #fff;
            margin-top: 2px;
        }

        /* Floating Overlays & Banners */
        #floating-banner {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(4, 6, 10, 0.9);
            border: 2px solid #daa520;
            color: #f0e682;
            padding: 12px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(218, 165, 32, 0.7);
            z-index: 100;
            display: none;
            text-align: center;
            pointer-events: none;
        }

        /* Expanded Final Fly Screen */
        #final-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 6, 10, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
        }
        #final-img {
            width: 550px;
            height: 550px;
            max-width: 90vw;
            max-height: 70vh;
            object-fit: contain;
            border: 3px solid #daa520;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(218, 165, 32, 0.8);
            margin-bottom: 20px;
        }
        #final-msg {
            font-size: 1.8rem;
            color: #f0e682;
            text-align: center;
            text-shadow: 0 0 10px #000;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        #restart-game-btn {
            background: linear-gradient(135deg, #8b6508, #daa520);
            border: 2px solid #fff;
            color: #fff;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 12px 35px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.8);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="start-screen">
        <button id="start-btn">Start Game</button>
    </div>

    <!-- Main Game Container -->
    <div id="game-container">
        <!-- Left Pane: Storyline Pictures (50%) -->
        <div id="story-pane">
            <img id="story-img" src="story1.png" alt="Storyline">
            <div id="story-title">Chapter I: The Awakening</div>
        </div>

        <!-- Right Pane: Game Box (50%) -->
        <div id="game-pane">
            <!-- Top Area: Battle Arena -->
            <div id="battle-arena">
                <div id="road"></div>
                
                <!-- Hero Container -->
                <div id="hero-container">
                    <img id="hero" src="hero.png" alt="Hero">
                </div>

                <!-- Angel Container -->
                <div id="angel-container">
                    <div class="angel-halo" id="angel-halo"></div>
                    <img id="angel" src="angel.png" alt="Angel">
                </div>

                <!-- Villains Grid Field (3x4 Formation) -->
                <div id="villains-grid-field"></div>
            </div>

            <!-- Bottom Area: Case Vault (Keeps background.png) -->
            <div id="claw-section">
                <div id="cases-container"></div>
                <div id="turn-info">Picks remaining: <span id="picks-left">1</span></div>

                <!-- Boosters Dock (3 Boosters) -->
                <div id="boosters-dock">
                    <div class="booster-slot" id="booster-0" onclick="triggerBooster(0)">
                        <div class="booster-name">Increase Number</div>
                        <div class="booster-counter" id="count-0">Lv.1</div>
                    </div>
                    <div class="booster-slot" id="booster-1" onclick="triggerBooster(1)">
                        <div class="booster-name">Choose More</div>
                        <div class="booster-counter" id="count-1">Lv.1</div>
                    </div>
                    <div class="booster-slot" id="booster-2" onclick="triggerBooster(2)">
                        <div class="booster-name">Bounce Overflow</div>
                        <div class="booster-counter" id="count-2">Lv.1</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Banner -->
    <div id="floating-banner">Victory!</div>

    <!-- Final Fly Screen -->
    <div id="final-screen">
        <img id="final-img" src="fly.png" alt="Final Fly">
        <div id="final-msg">Together In Eternity</div>
        <button id="restart-game-btn" onclick="location.reload()">Play Again</button>
    </div>

    <script>
        // Storyline Sequence Images & Titles
        const storyChapters = [
            { img: 'story1.png', title: 'Chapter I: The Awakening' },
            { img: 'story2.png', title: 'Chapter II: Trials of Abyss' },
            { img: 'story3.png', title: 'Chapter III: Ascending Light' }
        ];
        let currentChapterIndex = 0;

        // Game State Variables
        let stageLevel = 1; // Stage 1 to 4
        const maxStages = 4;
        
        // Boosters state
        // 0: Increase number (Max 7 levels: Lv.1 to Lv.7 -> values: 45, 65, 85, 115, 135, 155)
        // 1: Increase case choosing (Max 3 levels)
        // 2: Increase bounce (Max 5 levels)
        let boosters = [
            { level: 1, max: 7 },
            { level: 1, max: 3 },
            { level: 1, max: 5 }
        ];

        // Cases & Turn Management
        let baseCaseValues = [10, 30, 50, 80, 100, 120];
        let currentTurnCases = [];
        let picksAllowed = 1;
        let picksMadeThisTurn = 0;

        // Villains Data Setup (3x4 grid = 12 total units per stage, last unit in grid is Boss)
        let villains = [];
        let activeTargetIndex = 0;

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const gameContainer = document.getElementById('game-container');
        const storyImg = document.getElementById('story-img');
        const storyTitle = document.getElementById('story-title');
        const villainsGridField = document.getElementById('villains-grid-field');
        const floatingBanner = document.getElementById('floating-banner');
        const heroContainer = document.getElementById('hero-container');
        const angelContainer = document.getElementById('angel-container');
        const angelHalo = document.getElementById('angel-halo');
        const finalScreen = document.getElementById('final-screen');
        const casesContainer = document.getElementById('cases-container');
        const picksLeftSpan = document.getElementById('picks-left');

        // Initialize Game
        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            gameContainer.style.display = 'flex';
            initStage(stageLevel);
            initNewTurn();
        });

        // Initialize Stage Villains (3x4 = 12 units)
        function initStage(level) {
            villains = [];
            let totalUnits = 12;
            for(let i=0; i<totalUnits; i++) {
                let isBoss = (i === totalUnits - 1);
                let maxHp;
                if(isBoss) {
                    // Boss life is 200, final big boss life is 300 (Stage 4)
                    maxHp = (level === 4) ? 300 : 200;
                } else {
                    // Each villain life is 40 at stage 1 and 2, each villain life becomes 60 at stage 3 and 4
                    maxHp = (level <= 2) ? 40 : 60;
                }
                villains.push({
                    id: i,
                    isBoss: isBoss,
                    hp: maxHp,
                    maxHp: maxHp,
                    alive: true,
                    img: isBoss ? 'boss.png' : `minion${(i % 3) + 1}.png`
                });
            }
            activeTargetIndex = 0;
            updateActiveTarget();
            renderVillains();
        }

        // Render Villains in Strict 3x4 Grid
        function renderVillains() {
            villainsGridField.innerHTML = '';
            villains.forEach((v, idx) => {
                let cell = document.createElement('div');
                cell.className = 'grid-cell';

                if (v.alive) {
                    let unitDiv = document.createElement('div');
                    unitDiv.className = `villain-unit ${idx === activeTargetIndex ? 'active-target' : ''}`;
                    unitDiv.onclick = () => {
                        // Boss rule: boss is always the last to be bounced on/killed
                        if (v.isBoss && villains.some((item, i) => i !== idx && item.alive)) {
                            showBanner("Boss must be attacked last!");
                            return;
                        }
                        activeTargetIndex = idx;
                        renderVillains();
                    };

                    let hpCont = document.createElement('div');
                    hpCont.className = 'v-hp-container';
                    let hpBar = document.createElement('div');
                    hpBar.className = 'v-hp-bar';
                    hpBar.style.width = `${(v.hp / v.maxHp) * 100}%`;
                    hpCont.appendChild(hpBar);

                    let img = document.createElement('img');
                    img.className = `villain-img ${v.isBoss ? 'boss-img' : ''}`;
                    img.src = v.img;

                    unitDiv.appendChild(hpCont);
                    unitDiv.appendChild(img);
                    cell.appendChild(unitDiv);
                }
                villainsGridField.appendChild(cell);
            });
        }

        function updateActiveTarget() {
            if (villains[activeTargetIndex] && !villains[activeTargetIndex].alive) {
                let nextAlive = villains.findIndex((v, i) => v.alive && !v.isBoss);
                if (nextAlive !== -1) {
                    activeTargetIndex = nextAlive;
                } else {
                    let bossIndex = villains.findIndex(v => v.isBoss && v.alive);
                    if (bossIndex !== -1) activeTargetIndex = bossIndex;
                }
            }
        }

        // Case Generation and Management for Each Turn
        function initNewTurn() {
            picksMadeThisTurn = 0;
            picksAllowed = boosters[1].level; // Choose more booster level determines picks allowed per turn
            picksLeftSpan.innerText = picksAllowed - picksMadeThisTurn;

            // Generate shuffled hidden values with increase number booster bonus
            // Increase number booster levels 1-7 add values or specify max levels: 45, 65, 85, 115, 135, 155
            let bonusMap = [0, 45, 65, 85, 115, 135, 155]; 
            // Wait, let's map booster level 1 to base values (bonus 0), and levels 2-7 to specific fixed values or additions. 
            // Prompt: "for each booster level up increase numbers under each case by 5, Max seven level to 45, 65, 85, 115, 135, 155"
            // Let's calculate exact numbers based on level:
            let levelBonus = 0;
            let currentLvl = boosters[0].level;
            if (currentLvl === 1) levelBonus = 0;
            else if (currentLvl === 2) levelBonus = 45;
            else if (currentLvl === 3) levelBonus = 65;
            else if (currentLvl === 4) levelBonus = 85;
            else if (currentLvl === 5) levelBonus = 115;
            else if (currentLvl === 6) levelBonus = 135;
            else if (currentLvl === 7) levelBonus = 155;

            let shuffledValues = [...baseCaseValues].sort(() => Math.random() - 0.5);
            currentTurnCases = shuffledValues.map(val => {
                return {
                    val: val + levelBonus,
                    opened: false
                };
            });

            renderCases();
        }

        function renderCases() {
            casesContainer.innerHTML = '';
            currentTurnCases.forEach((c, idx) => {
                let card = document.createElement('div');
                card.className = `case-card ${c.opened ? 'opened' : ''}`;
                card.onclick = () => selectCase(idx);

                let img = document.createElement('img');
                img.className = 'case-img';
                img.src = 'case.png';

                let valDiv = document.createElement('div');
                valDiv.className = 'case-val';
                valDiv.innerText = c.opened ? `+${c.val}` : '?';

                card.appendChild(img);
                card.appendChild(valDiv);
                casesContainer.appendChild(card);
            });
        }

        function selectCase(idx) {
            let c = currentTurnCases[idx];
            if (c.opened || picksMadeThisTurn >= picksAllowed) return;

            c.opened = true;
            picksMadeThisTurn++;
            picksLeftSpan.innerText = picksAllowed - picksMadeThisTurn;
            renderCases();

            // Apply damage to active target
            applyDamageWithBounce(c.val);

            // Check if turn is complete
            if (picksMadeThisTurn >= picksAllowed) {
                setTimeout(() => {
                    executeVillainTurnAttacks();
                }, 600);
            }
        }

        // Apply Damage with Bounce Overflow Logic
        function applyDamageWithBounce(damageAmount) {
            let bounceLevel = boosters[2].level; 
            // bounceLevel 1: does not allow bounce (spill over 0 extra villains)
            // bounceLevel 2: spill over to 1 next villain
            // bounceLevel 3: spill over to 2 more villains
            // bounceLevel 4: spill over to 3 more villains
            // bounceLevel 5: spill over to 4 more villains
            let maxExtraTargets = bounceLevel - 1;

            let targetIndices = [];
            // Find current active target index
            let currIdx = activeTargetIndex;
            if (!villains[currIdx].alive) {
                updateActiveTarget();
                currIdx = activeTargetIndex;
            }

            if (!villains[currIdx].alive) return;

            targetIndices.push(currIdx);

            // Collect spill over targets sequentially from living villains
            if (maxExtraTargets > 0) {
                let count = 0;
                for (let i = 1; i < villains.length && count < maxExtraTargets; i++) {
                    let nextIdx = (currIdx + i) % villains.length;
                    // Boss rule check for spillover: do not spill over to boss if other minions are alive
                    let otherMinionsAlive = villains.some((v, vi) => vi !== nextIdx && v.isBoss && v.alive);
                    if (villains[nextIdx].alive) {
                        if (villains[nextIdx].isBoss && villains.some((v, vi) => !v.isBoss && v.alive)) {
                            continue; // Skip boss spillover if minions remain
                        }
                        targetIndices.push(nextIdx);
                        count++;
                    }
                }
            }

            let currentDamage = damageAmount;
            for (let i = 0; i < targetIndices.length; i++) {
                let tIdx = targetIndices[i];
                let target = villains[tIdx];
                if (!target.alive) continue;

                if (currentDamage >= target.hp) {
                    let overflow = currentDamage - target.hp;
                    target.hp = 0;
                    target.alive = false;
                    currentDamage = overflow;
                } else {
                    target.hp -= currentDamage;
                    currentDamage = 0;
                }

                if (currentDamage <= 0) break;
            }

            renderVillains();

            if (villains.every(v => !v.alive)) {
                handleStageClear();
            } else {
                updateActiveTarget();
                renderVillains();
            }
        }

        // Villain Attack Turn Mechanic
        function executeVillainTurnAttacks() {
            // "The Villain side will shoot out attacks to hero once each turn, by the nearest villain. If the hero receives more than 3 attacks each turn he loses and has to restart that level"
            // Let's shoot 3 attacks each turn from the nearest living villain towards the hero.
            let livingVillains = villains.filter(v => v.alive);
            if (livingVillains.length === 0) return;

            let nearestVillain = livingVillains[0]; // Nearest villain in grid view order

            let attackCount = 3;
            let attacksFired = 0;

            let attackInterval = setInterval(() => {
                if (attacksFired >= attackCount) {
                    clearInterval(attackInterval);
                    // Check if hero receives more than 3 attacks (here exactly 3 are fired, prompt says: "If the hero receives more than 3 attacks each turn he loses", so 3 or fewer is safe, or let's trigger loss if it exceeds 3).
                    // Wait, let's verify if 3 attacks causes defeat or if it needs > 3. "If the hero receives more than 3 attacks each turn he loses". Since 3 attacks are fired per turn, hero survives 3 attacks!
                    setTimeout(initNewTurn, 500);
                    return;
                }

                fireProjectileAtHero();
                attacksFired++;
            }, 300);
        }

        function fireProjectileAtHero() {
            let proj = document.createElement('div');
            proj.className = 'attack-projectile';
            
            // Get positions
            let arenaRect = document.getElementById('battle-arena').getBoundingClientRect();
            let heroRect = heroContainer.getBoundingClientRect();
            
            proj.style.left = `${arenaRect.width * 0.75}px`;
            proj.style.top = `${arenaRect.height * 0.5}px`;
            document.getElementById('battle-arena').appendChild(proj);

            setTimeout(() => {
                proj.style.left = `${heroRect.left - arenaRect.left + 50}px`;
                proj.style.top = `${heroRect.top - arenaRect.top + 100}px`;
            }, 50);

            setTimeout(() => {
                proj.remove();
            }, 450);
        }

        // Increment Booster & Check Max
        function incrementBooster(type) {
            if(boosters[type].level < boosters[type].max) {
                boosters[type].level++;
                document.getElementById(`count-${type}`).innerText = `Lv.${boosters[type].level}`;
                
                if(boosters[type].level >= boosters[type].max) {
                    let slot = document.getElementById(`booster-${type}`);
                    slot.classList.add('maxed');
                    showBanner(`${slot.querySelector('.booster-name').innerText} Maxed!`);
                }
            }
        }

        function triggerBooster(type) {
            incrementBooster(type);
        }

        function handleStageClear() {
            if(stageLevel < maxStages) {
                showBanner(`Stage ${stageLevel} Cleared! Advancing...`);
                setTimeout(() => {
                    stageLevel++;
                    if(currentChapterIndex < storyChapters.length - 1) {
                        currentChapterIndex++;
                        storyImg.src = storyChapters[currentChapterIndex].img;
                        storyTitle.innerText = storyChapters[currentChapterIndex].title;
                    }
                    initStage(stageLevel);
                    initNewTurn();
                }, 2000);
            } else {
                showBanner("All Trials Conquered!");
                setTimeout(triggerVictorySequence, 2000);
            }
        }

        // Victory Sequence: Hero moves to Angel and Angel appears
        function triggerVictorySequence() {
            heroContainer.style.left = '72%';
            setTimeout(() => {
                angelContainer.style.display = 'flex';
                angelHalo.style.display = 'block';
                startHeartFireworks();

                setTimeout(() => {
                    gameContainer.style.display = 'none';
                    finalScreen.style.display = 'flex';
                }, 3000);
            }, 2500);
        }

        function startHeartFireworks() {
            let interval = setInterval(() => {
                for(let i=0; i<5; i++) {
                    let heart = document.createElement('div');
                    heart.className = 'white-heart';
                    heart.innerHTML = '&#10084;';
                    let rect = angelContainer.getBoundingClientRect();
                    heart.style.left = `${rect.left + rect.width/2}px`;
                    heart.style.top = `${rect.top + rect.height/2}px`;
                    let angle = Math.random() * Math.PI * 2;
                    let dist = 60 + Math.random() * 90;
                    heart.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
                    heart.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 1400);
                }
            }, 300);
            setTimeout(() => clearInterval(interval), 3000);
        }

        function showBanner(text) {
            floatingBanner.innerText = text;
            floatingBanner.style.display = 'block';
            setTimeout(() => {
                floatingBanner.style.display = 'none';
            }, 1800);
        }
    </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angles & Demons & Banker</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #04060a;
            color: #d4af37;
            font-family: 'Times New Roman', Times, serif, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Fullscreen Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #060913;
            background-image: url('start.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 8vh;
            z-index: 100;
        }
        #start-btn {
            background: linear-gradient(135deg, #8b6508, #daa520);
            border: 2px solid #fff;
            color: #fff;
            font-size: 2.2rem;
            font-weight: bold;
            padding: 15px 55px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(218, 165, 32, 0.9);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Main Game Layout */
        #game-container {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: row;
        }

        /* Left Pane: Storyline Pictures */
        #story-pane {
            width: 50%;
            height: 100%;
            background-image: linear-gradient(rgba(4, 6, 10, 0.75), rgba(4, 6, 10, 0.75)), url('left.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            border-right: 3px solid #000000; /* Changed from yellow to black */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        #story-img {
            max-width: 100%;
            max-height: 65vh;
            border: 2px solid #daa520;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.4);
            object-fit: contain;
        }
        #story-title {
            margin-top: 15px;
            font-size: 1.4rem;
            color: #f0e682;
            letter-spacing: 1px;
            text-shadow: 1px 1px 3px #000;
        }

        /* Right Pane: Game Box */
        #game-pane {
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Area: Battle Arena */
        #battle-arena {
            height: 52%;
            width: 100%;
            position: relative;
            background-color: #090e1a;
            overflow: hidden;
            border-bottom: 3px solid #000000; /* Changed from yellow to black */
        }
        #road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(4, 6, 10, 0.55), rgba(4, 6, 10, 0.55)), url('sky.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
        }

        /* Hero Container & Movement */
        #hero-container {
            position: absolute;
            left: 5%;
            bottom: 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            transition: left 2.5s ease-in-out;
        }
        #hero {
            width: 150px;      
            height: 225px;      
            object-fit: contain;
            filter: drop-shadow(0 0 22px rgba(218, 165, 32, 0.85));
        }

        /* Angel Container & Alignment */
        #angel-container {
            position: absolute;
            right: 5%;
            bottom: 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 15;
            cursor: pointer;
            display: none;
        }
        #angel {
            width: 130px;      
            height: 195px;      
            object-fit: contain;
            filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.9));
            position: relative;
        }

        .angel-halo {
            position: absolute;
            top: -5px;
            width: 48px;
            height: 16px;
            border: 2px solid #fde047;
            border-radius: 50%;
            box-shadow: 0 0 15px #fde047;
            animation: haloGlow 1s infinite alternate;
            display: none;
        }
        @keyframes haloGlow {
            from { transform: scale(1); box-shadow: 0 0 10px #fde047; }
            to { transform: scale(1.1); box-shadow: 0 0 25px #fff; }
        }

        .white-heart {
            position: absolute;
            color: #ffffff;
            font-size: 20px;
            pointer-events: none;
            animation: heartFirework 1.4s forwards ease-out;
            z-index: 1;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #fde047;
        }
        @keyframes heartFirework {
            0% { transform: translate(0, 0) scale(0.4); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1.4); opacity: 0; }
        }

        /* Strict 3x4 Grid Formation Field */
        #villains-grid-field {
            position: absolute;
            right: 2%;
            top: 2%;
            width: 62%;
            height: 96%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            z-index: 10;
            background: transparent;
            border: none;
        }
        .grid-cell {
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .villain-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 1px;
            border-radius: 6px;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            transition: transform 0.1s;
            opacity: 1.0 !important;
        }
        .villain-unit:hover {
            transform: scale(1.1);
        }
        .villain-unit.active-target .villain-img {
            filter: drop-shadow(0 0 12px rgba(218, 165, 32, 0.9));
            transform: scale(1.06);
        }
        .v-hp-container {
            width: 48px;
            height: 4px;
            background: #222;
            border: 1px solid #d4af37;
            border-radius: 2px;
            margin-bottom: 1px;
            overflow: hidden;
        }
        .v-hp-bar {
            width: 100%;
            height: 100%;
            background: #b8860b;
        }
        .villain-img {
            width: 64px;
            height: 82px;
            object-fit: contain;
            transition: transform 0.2s, filter 0.2s;
        }
        .villain-img.boss-img {
            width: 115px;
            height: 145px;
            filter: drop-shadow(0 0 15px rgba(255, 69, 0, 0.8));
        }

        /* Bottom Area: Claw Vault */
        #claw-section {
            height: 48%;
            width: 100%;
            background-color: #03050a;
            background-image: linear-gradient(rgba(3, 5, 10, 0.3), rgba(3, 5, 10, 0.3)), url('background.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #vault-pit {
            position: relative;
            flex-grow: 1;
            width: 100%;
            margin: 0;
            background: transparent;
            border: none;
            border-radius: 0;
            overflow: hidden;
        }
        #gantry-track {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: rgba(184, 134, 11, 0.4);
            border: none;
            z-index: 28;
        }
        #claw-rig {
            position: absolute;
            top: 6px;
            left: 50%;
            width: 50px;
            height: 20px;
            transform: translateX(-50%);
            transition: left 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 30;
        }
        #vertical-cable {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 20px;
            background: linear-gradient(90deg, #b8860b, #f0e682, #b8860b);
            transform: translateX(-50%);
            transition: height 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #grand-claw-head {
            position: absolute;
            top: 20px;
            left: 50%;
            width: 56px;
            height: 36px;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: top 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .claw-crown {
            width: 32px;
            height: 12px;
            background: linear-gradient(135deg, #b8860b, #f0e682);
            border: 1px solid #fff;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(218, 165, 32, 0.9);
        }
        .claw-prongs {
            display: flex;
            justify-content: space-between;
            width: 56px;
            height: 24px;
            margin-top: -2px;
        }
        .prong-l, .prong-r {
            width: 16px;
            height: 24px;
            background: linear-gradient(135deg, #d4af37, #8b6508);
            border: 1px solid #fff;
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
            transition: transform 0.2s ease;
        }
        .prong-l {
            border-top-left-radius: 10px;
            border-bottom-left-radius: 12px;
            transform-origin: top right;
            transform: rotate(-15deg);
        }
        .prong-r {
            border-top-right-radius: 10px;
            border-bottom-right-radius: 12px;
            transform-origin: top left;
            transform: rotate(15deg);
        }
        #grand-claw-head.closed .prong-l { transform: rotate(10deg); }
        #grand-claw-head.closed .prong-r { transform: rotate(-10deg); }

        #bead-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        .treasure-bead {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.8), inset 0 -2px 4px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.4);
            transition: transform 0.2s ease-out, opacity 0.2s ease-out;
        }

        /* Direction Deck */
        #direction-deck {
            height: 52px;
            background: #080c16;
            border-top: 2px solid #000000; /* Changed from yellow to black */
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 0 10px;
            z-index: 40;
        }
        .dir-arrow-btn {
            background: linear-gradient(135deg, #111827, #1f2937);
            border: 2px solid #b8860b;
            color: #f0e682;
            border-radius: 8px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(184, 134, 11, 0.3);
        }
        .dir-arrow-btn:active {
            transform: scale(0.95);
            background: #b8860b;
            color: #fff;
        }
        #drop-grab-btn {
            background: linear-gradient(135deg, #8b6508, #daa520);
            border: 2px solid #fff;
            color: #fff;
            border-radius: 8px;
            padding: 6px 22px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(218, 165, 32, 0.6);
            text-transform: uppercase;
        }
        #drop-grab-btn:active {
            transform: scale(0.95);
        }

        /* Boosters Dock */
        #boosters-dock {
            height: 65px;
            background: #050811;
            border-top: 1px solid #000000; /* Changed from yellow to black */
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 8px;
            z-index: 40;
        }
        .booster-slot {
            background: linear-gradient(135deg, #111827, #1f2937);
            border: 2px solid #b8860b;
            border-radius: 8px;
            width: 23%;
            height: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            box-shadow: 0 0 10px rgba(184, 134, 11, 0.2);
            transition: transform 0.1s, border-color 0.2s;
        }
        .booster-slot:active {
            transform: scale(0.96);
        }
        .booster-slot.maxed {
            border-color: #ef4444;
            opacity: 0.65;
            cursor: not-allowed;
            pointer-events: none; /* Blocked from moving forward when maxed out */
        }
        .booster-name {
            font-size: 0.75rem;
            color: #f0e682;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .booster-counter {
            font-size: 0.8rem;
            color: #fff;
            margin-top: 2px;
        }

        /* Floating Overlays & Banners */
        #floating-banner {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(4, 6, 10, 0.9);
            border: 2px solid #daa520;
            color: #f0e682;
            padding: 12px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(218, 165, 32, 0.7);
            z-index: 100;
            display: none;
            text-align: center;
            pointer-events: none;
        }

        /* Expanded Final Fly Screen */
        #final-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 6, 10, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
        }
        #final-img {
            width: 550px; /* Made bigger as requested */
            height: 550px; /* Made bigger as requested */
            max-width: 90vw;
            max-height: 70vh;
            object-fit: contain;
            border: 3px solid #daa520;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(218, 165, 32, 0.8);
            margin-bottom: 20px;
        }
        #final-msg {
            font-size: 1.8rem;
            color: #f0e682;
            text-align: center;
            text-shadow: 0 0 10px #000;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        #restart-game-btn {
            background: linear-gradient(135deg, #8b6508, #daa520);
            border: 2px solid #fff;
            color: #fff;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 12px 35px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.8);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="start-screen">
        <button id="start-btn">Start Game</button>
    </div>

    <!-- Main Game Container -->
    <div id="game-container">
        <!-- Left Pane: Storyline Pictures (50%) -->
        <div id="story-pane">
            <img id="story-img" src="story1.png" alt="Storyline">
            <div id="story-title">Chapter I: The Awakening</div>
        </div>

        <!-- Right Pane: Game Box (50%) -->
        <div id="game-pane">
            <!-- Top Area: Battle Arena -->
            <div id="battle-arena">
                <div id="road"></div>
                
                <!-- Hero Container (Base placed at same height as angel) -->
                <div id="hero-container">
                    <img id="hero" src="hero.png" alt="Hero">
                </div>

                <!-- Angel Container (Base placed at same height as hero) -->
                <div id="angel-container">
                    <div class="angel-halo" id="angel-halo"></div>
                    <img id="angel" src="angel.png" alt="Angel">
                </div>

                <!-- Villains Grid Field (3x4 Formation) -->
                <div id="villains-grid-field"></div>
            </div>

            <!-- Bottom Area: Claw Vault -->
            <div id="claw-section">
                <div id="vault-pit">
                    <div id="gantry-track"></div>
                    <div id="claw-rig">
                        <div id="vertical-cable"></div>
                        <div id="grand-claw-head">
                            <div class="claw-crown"></div>
                            <div class="claw-prongs">
                                <div class="prong-l"></div>
                                <div class="prong-r"></div>
                            </div>
                        </div>
                    </div>
                    <div id="bead-container"></div>
                </div>

                <!-- Direction Deck -->
                <div id="direction-deck">
                    <button class="dir-arrow-btn" id="btn-left">&#9664;</button>
                    <button id="drop-grab-btn">Drop</button>
                    <button class="dir-arrow-btn" id="btn-right">&#9654;</button>
                </div>

                <!-- Boosters Dock -->
                <div id="boosters-dock">
                    <div class="booster-slot" id="booster-0" onclick="triggerBooster(0)">
                        <div class="booster-name">Power</div>
                        <div class="booster-counter" id="count-0">0/5</div>
                    </div>
                    <div class="booster-slot" id="booster-1" onclick="triggerBooster(1)">
                        <div class="booster-name">Speed</div>
                        <div class="booster-counter" id="count-1">0/5</div>
                    </div>
                    <div class="booster-slot" id="booster-2" onclick="triggerBooster(2)">
                        <div class="booster-name">Shield</div>
                        <div class="booster-counter" id="count-2">0/5</div>
                    </div>
                    <div class="booster-slot" id="booster-3" onclick="triggerBooster(3)">
                        <div class="booster-name">Bomb</div>
                        <div class="booster-counter" id="count-3">0/5</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Banner -->
    <div id="floating-banner">Victory!</div>

    <!-- Final Fly Screen -->
    <div id="final-screen">
        <img id="final-img" src="fly.png" alt="Final Fly">
        <div id="final-msg">Together In Eternity</div>
        <button id="restart-game-btn" onclick="location.reload()">Play Again</button>
    </div>

    <script>
        // Storyline Sequence Images & Titles
        const storyChapters = [
            { img: 'story1.png', title: 'Chapter I: The Awakening' },
            { img: 'story2.png', title: 'Chapter II: Trials of Abyss' },
            { img: 'story3.png', title: 'Chapter III: Ascending Light' }
        ];
        let currentChapterIndex = 0;

        // Game State Variables
        let stageLevel = 1; // Stage 1 to 3
        const maxStages = 3;
        
        // Boosters state (max 5 each)
        let boosters = [
            { count: 0, max: 5 },
            { count: 0, max: 5 },
            { count: 0, max: 5 },
            { count: 0, max: 5 }
        ];

        // Villains Data Setup (3x4 grid = 12 total units per stage, last unit in grid is Boss)
        let villains = [];
        let activeTargetIndex = 0;

        // Claw Rig State
        let clawX = 50; // percentage across track
        let clawState = 'IDLE'; // IDLE, MOVING_LEFT, MOVING_RIGHT, DROPPING, RETRACTING
        let beads = [];

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const gameContainer = document.getElementById('game-container');
        const storyImg = document.getElementById('story-img');
        const storyTitle = document.getElementById('story-title');
        const villainsGridField = document.getElementById('villains-grid-field');
        const clawRig = document.getElementById('claw-rig');
        const verticalCable = document.getElementById('vertical-cable');
        const grandClawHead = document.getElementById('grand-claw-head');
        const beadContainer = document.getElementById('bead-container');
        const dropGrabBtn = document.getElementById('drop-grab-btn');
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const floatingBanner = document.getElementById('floating-banner');
        const heroContainer = document.getElementById('hero-container');
        const angelContainer = document.getElementById('angel-container');
        const angelHalo = document.getElementById('angel-halo');
        const finalScreen = document.getElementById('final-screen');

        // Initialize Game
        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            gameContainer.style.display = 'flex';
            initStage(stageLevel);
            spawnBeads();
        });

        // Initialize Stage Villains (3x4 = 12 units)
        function initStage(level) {
            villains = [];
            // 11 regular minions + 1 Boss (Boss is always index 11, last in grid)
            let totalUnits = 12;
            for(let i=0; i<totalUnits; i++) {
                let isBoss = (i === totalUnits - 1);
                let maxHp = isBoss ? (level * 3) : level;
                villains.push({
                    id: i,
                    isBoss: isBoss,
                    hp: maxHp,
                    maxHp: maxHp,
                    alive: true,
                    img: isBoss ? 'boss.png' : `minion${(i % 3) + 1}.png`
                });
            }
            activeTargetIndex = 0;
            // Ensure boss is not selected first if there are living minions
            updateActiveTarget();
            renderVillains();
        }

        // Render Villains in Strict 3x4 Grid
        function renderVillains() {
            villainsGridField.innerHTML = '';
            villains.forEach((v, idx) => {
                let cell = document.createElement('div');
                cell.className = 'grid-cell';

                if (v.alive) {
                    let unitDiv = document.createElement('div');
                    unitDiv.className = `villain-unit ${idx === activeTargetIndex ? 'active-target' : ''}`;
                    unitDiv.onclick = () => {
                        // Boss rule: boss is always the last to be bounced on/killed
                        if (v.isBoss && villains.some((item, i) => i !== idx && item.alive)) {
                            showBanner("Boss must be attacked last!");
                            return;
                        }
                        activeTargetIndex = idx;
                        renderVillains();
                    };

                    let hpCont = document.createElement('div');
                    hpCont.className = 'v-hp-container';
                    let hpBar = document.createElement('div');
                    hpBar.className = 'v-hp-bar';
                    hpBar.style.width = `${(v.hp / v.maxHp) * 100}%`;
                    hpCont.appendChild(hpBar);

                    let img = document.createElement('img');
                    img.className = `villain-img ${v.isBoss ? 'boss-img' : ''}`;
                    img.src = v.img;

                    unitDiv.appendChild(hpCont);
                    unitDiv.appendChild(img);
                    cell.appendChild(unitDiv);
                }
                villainsGridField.appendChild(cell);
            });
        }

        function updateActiveTarget() {
            // Find first available non-boss target if current is boss or dead
            if (villains[activeTargetIndex] && !villains[activeTargetIndex].alive) {
                let nextAlive = villains.findIndex((v, i) => v.alive && !v.isBoss);
                if (nextAlive !== -1) {
                    activeTargetIndex = nextAlive;
                } else {
                    // Only boss left
                    let bossIndex = villains.findIndex(v => v.isBoss && v.alive);
                    if (bossIndex !== -1) activeTargetIndex = bossIndex;
                }
            }
        }

        // Spawn Beads in Claw Vault
        function spawnBeads() {
            beadContainer.innerHTML = '';
            beads = [];
            let beadCount = 8;
            for(let i=0; i<beadCount; i++) {
                let size = 38;
                let x = 10 + Math.random() * 80;
                let y = 15 + Math.random() * 65;
                let boosterType = i % 4; // Cycles through Power, Speed, Shield, Bomb
                let colors = ['radial-gradient(circle at 30% 30%, #fde047, #ca8a04)', 
                              'radial-gradient(circle at 30% 30%, #60a5fa, #2563eb)', 
                              'radial-gradient(circle at 30% 30%, #34d399, #059669)', 
                              'radial-gradient(circle at 30% 30%, #f43f5e, #e11d48)'];
                
                beads.push({
                    id: i,
                    x: x,
                    y: y,
                    size: size,
                    boosterType: boosterType,
                    collected: false
                });
            }
            renderBeads();
        }

        function renderBeads() {
            let html = '';
            beads.forEach(b => {
                if(!b.collected) {
                    let bg = ['#ca8a04', '#2563eb', '#059669', '#e11d48'][b.boosterType];
                    let label = ['P', 'S', 'Sh', 'B'][b.boosterType];
                    html += `<div class="treasure-bead" style="left: ${b.x}%; top: ${b.y}%; width: ${b.size}px; height: ${b.size}px; background: ${bg};">${label}</div>`;
                }
            });
            beadContainer.innerHTML = html;
        }

        // Claw Controls
        let moveInterval = null;
        
        function startMovingClaw(direction) {
            if(clawState !== 'IDLE') return;
            clawState = direction > 0 ? 'MOVING_RIGHT' : 'MOVING_LEFT';
            moveInterval = setInterval(() => {
                clawX += direction * 2.5;
                if(clawX < 5) clawX = 5;
                if(clawX > 95) clawX = 95;
                clawRig.style.left = `${clawX}%`;
            }, 30);
        }

        function stopMovingClaw() {
            if(clawState === 'MOVING_LEFT' || clawState === 'MOVING_RIGHT') {
                clearInterval(moveInterval);
                clawState = 'IDLE';
            }
        }

        btnLeft.addEventListener('mousedown', () => startMovingClaw(-1));
        btnLeft.addEventListener('mouseup', stopMovingClaw);
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); startMovingClaw(-1); });
        btnLeft.addEventListener('touchend', stopMovingClaw);

        btnRight.addEventListener('mousedown', () => startMovingClaw(1));
        btnRight.addEventListener('mouseup', stopMovingClaw);
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); startMovingClaw(1); });
        btnRight.addEventListener('touchend', stopMovingClaw);

        dropGrabBtn.addEventListener('click', triggerClawDrop);

        function triggerClawDrop() {
            if(clawState !== 'IDLE') return;
            clawState = 'DROPPING';

            // Extend Cable & Claw
            verticalCable.style.height = '140px';
            grandClawHead.style.top = '140px';

            setTimeout(() => {
                grandClawHead.classList.add('closed');
                
                // Check collision with beads
                let collectedBead = beads.find(b => !b.collected && Math.abs(b.x - clawX) < 12);
                if(collectedBead) {
                    collectedBead.collected = true;
                    renderBeads();
                    incrementBooster(collectedBead.boosterType);
                }

                setTimeout(() => {
                    // Retract Cable & Claw
                    verticalCable.style.height = '20px';
                    grandClawHead.style.top = '20px';
                    grandClawHead.classList.remove('closed');

                    setTimeout(() => {
                        clawState = 'IDLE';
                        if(collectedBead) {
                            applyDamageToActiveTarget();
                        }
                    }, 350);
                }, 350);
            }, 350);
        }

        // Increment Booster & Check Max
        function incrementBooster(type) {
            if(boosters[type].count < boosters[type].max) {
                boosters[type].count++;
                document.getElementById(`count-${type}`).innerText = `${boosters[type].count}/${boosters[type].max}`;
                
                if(boosters[type].count >= boosters[type].max) {
                    let slot = document.getElementById(`booster-${type}`);
                    slot.classList.add('maxed');
                    showBanner(`${slot.querySelector('.booster-name').innerText} Booster Maxed!`);
                    checkAllBoostersMaxed();
                }
            }
        }

        function triggerBooster(type) {
            if(boosters[type].count > 0 && boosters[type].count < boosters[type].max) {
                applyDamageToActiveTarget(2); // Booster special bonus damage
            }
        }

        // Apply Damage to Target Villain
        function applyDamageToActiveTarget(dmg = 1) {
            let target = villains[activeTargetIndex];
            if(!target || !target.alive) return;

            // Boss protection check: Boss can only take damage if all other villains are dead
            if(target.isBoss && villains.some(v => !v.isBoss && v.alive)) {
                showBanner("Defeat all other minions first!");
                return;
            }

            target.hp -= dmg;
            if(target.hp <= 0) {
                target.hp = 0;
                target.alive = true; // Keep object reference, mark defeated visually
                target.alive = false;
            }
            renderVillains();

            // Check if stage cleared
            if(villains.every(v => !v.alive)) {
                handleStageClear();
            } else {
                updateActiveTarget();
                renderVillains();
            }
        }

        function handleStageClear() {
            if(stageLevel < maxStages) {
                showBanner(`Stage ${stageLevel} Cleared! Advancing...`);
                setTimeout(() => {
                    stageLevel++;
                    currentChapterIndex++;
                    storyImg.src = storyChapters[currentChapterIndex].img;
                    storyTitle.innerText = storyChapters[currentChapterIndex].title;
                    initStage(stageLevel);
                    spawnBeads();
                }, 2000);
            } else {
                showBanner("All Trials Conquered!");
                setTimeout(triggerVictorySequence, 2000);
            }
        }

        // When all boosters maxed out, player can click anywhere on screen to move forward
        function checkAllBoostersMaxed() {
            if(boosters.every(b => b.count >= b.max)) {
                showBanner("All Boosters Maxed! Click anywhere to advance!");
                document.body.style.cursor = 'pointer';
                document.body.addEventListener('click', handleUniversalScreenAdvance, { once: true });
            }
        }

        function handleUniversalScreenAdvance() {
            document.body.style.cursor = 'default';
            if(stageLevel < maxStages) {
                stageLevel++;
                if(currentChapterIndex < storyChapters.length - 1) {
                    currentChapterIndex++;
                    storyImg.src = storyChapters[currentChapterIndex].img;
                    storyTitle.innerText = storyChapters[currentChapterIndex].title;
                }
                initStage(stageLevel);
                spawnBeads();
            } else {
                triggerVictorySequence();
            }
        }

        // Victory Sequence: Hero moves to Angel and Angel appears
        function triggerVictorySequence() {
            heroContainer.style.left = '72%'; // Hero moves across toward angel position
            setTimeout(() => {
                angelContainer.style.display = 'flex';
                angelHalo.style.display = 'block';
                startHeartFireworks();

                setTimeout(() => {
                    gameContainer.style.display = 'none';
                    finalScreen.style.display = 'flex';
                }, 3000);
            }, 2500);
        }

        function startHeartFireworks() {
            let interval = setInterval(() => {
                for(let i=0; i<5; i++) {
                    let heart = document.createElement('div');
                    heart.className = 'white-heart';
                    heart.innerHTML = '&#10084;';
                    let rect = angelContainer.getBoundingClientRect();
                    heart.style.left = `${rect.left + rect.width/2}px`;
                    heart.style.top = `${rect.top + rect.height/2}px`;
                    let angle = Math.random() * Math.PI * 2;
                    let dist = 60 + Math.random() * 90;
                    heart.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
                    heart.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 1400);
                }
            }, 300);
            setTimeout(() => clearInterval(interval), 3000);
        }

        function showBanner(text) {
            floatingBanner.innerText = text;
            floatingBanner.style.display = 'block';
            setTimeout(() => {
                floatingBanner.style.display = 'none';
            }, 1800);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angles & Demons & Banker</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #04060a;
            color: #d4af37;
            font-family: 'Times New Roman', Times, serif, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Fullscreen Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #060913;
            background-image: url('start.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 8vh;
            z-index: 100;
        }
        #start-btn {
            background: linear-gradient(135deg, #8b6508, #daa520);
            border: 2px solid #fff;
            color: #fff;
            font-size: 2.2rem;
            font-weight: bold;
            padding: 15px 55px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(218, 165, 32, 0.9);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Main Game Layout */
        #game-container {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: row;
        }

        /* Left Pane: Storyline Pictures */
        #story-pane {
            width: 35%;
            height: 100%;
            background-image: url('left.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            border-right: 3px solid #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        #story-img {
            max-width: 100%;
            max-height: 65vh;
            border: 2px solid #daa520;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.4);
            object-fit: contain;
        }
        #story-title {
            margin-top: 15px;
            font-size: 1.4rem;
            color: #f0e682;
            letter-spacing: 1px;
            text-shadow: 1px 1px 3px #000;
        }

        /* Right Pane: Game Box */
        #game-pane {
            width: 65%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Area: Battle Arena */
        #battle-arena {
            height: 60%;
            width: 100%;
            position: relative;
            background-color: #090e1a;
            overflow: hidden;
            border-bottom: 3px solid #000000;
        }
        #road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-image: url('sky.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
        }

        /* Game Title Overlay on Top Left of Battle Arena */
        #game-title-header {
            position: absolute;
            top: 12px;
            left: 15px;
            font-size: 1.05rem;
            color: #f0e682;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-shadow: 1px 1px 3px #000;
            z-index: 30;
            pointer-events: none;
            background: rgba(4, 6, 10, 0.6);
            padding: 4px 10px;
            border: 1px solid #b8860b;
            border-radius: 4px;
        }

        /* Hero Container & Movement */
        #hero-container {
            position: absolute;
            left: 5%;
            bottom: 12%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            transition: left 2.5s ease-in-out, bottom 2.5s ease-in-out;
        }
        #hero {
            width: 150px;      
            height: 225px;      
            object-fit: contain;
            filter: drop-shadow(0 0 22px rgba(218, 165, 32, 0.85));
        }

        /* Clear Christian Cross Projectile Styling & Animation */
        .christian-cross-projectile {
            position: absolute;
            width: 36px;
            height: 50px;
            background: transparent;
            z-index: 25;
            pointer-events: none;
            transition: all 0.35s linear;
        }
        .christian-cross-projectile::before {
            content: '';
            position: absolute;
            top: 0;
            left: 13px;
            width: 10px;
            height: 50px;
            background: linear-gradient(to bottom, #fff700, #ff9800, #ff3d00);
            border-radius: 3px;
            box-shadow: 0 0 15px #ff9800, 0 0 5px #ffffff;
        }
        .christian-cross-projectile::after {
            content: '';
            position: absolute;
            top: 12px;
            left: 3px;
            width: 30px;
            height: 10px;
            background: linear-gradient(to right, #fff700, #ff9800, #ff3d00);
            border-radius: 3px;
            box-shadow: 0 0 15px #ff9800, 0 0 5px #ffffff;
        }

        /* Fireball Projectile Animation for Villain Attacks */
        .fireball-projectile {
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #fff700, #ff4500, #ff0000);
            border-radius: 50%;
            box-shadow: 0 0 15px #ff4500, 0 0 30px #ff0000;
            z-index: 25;
            pointer-events: none;
            transition: all 0.4s linear;
        }

        /* Hero HP Bar */
        #hero-hp-container {
            width: 100px;
            height: 8px;
            background: #222;
            border: 1px solid #d4af37;
            border-radius: 4px;
            margin-bottom: 5px;
            overflow: hidden;
        }
        #hero-hp-bar {
            width: 100%;
            height: 100%;
            background: #22c55e;
            transition: width 0.3s ease;
        }

        /* Angel Setting & Elements (Resized to match hero height correctly) */
        #angel-container {
            position: absolute;
            right: 5%;
            bottom: 12%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 15;
            cursor: pointer;
            display: none;
            transition: transform 0.3s ease;
        }
        #angel {
            width: 150px;      
            height: 225px;      
            object-fit: contain;
            filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.9));
            position: relative;
        }

        .angel-halo {
            position: absolute;
            top: -8px;
            width: 52px;
            height: 18px;
            border: 2px solid #fde047;
            border-radius: 50%;
            box-shadow: 0 0 15px #fde047;
            animation: haloGlow 1s infinite alternate;
            display: none;
            z-index: 16;
        }
        @keyframes haloGlow {
            from { transform: scale(1); box-shadow: 0 0 10px #fde047; }
            to { transform: scale(1.1); box-shadow: 0 0 25px #fff; }
        }

        .white-heart {
            position: absolute;
            color: #ffffff;
            font-size: 22px;
            pointer-events: none;
            animation: heartFirework 1.4s forwards ease-out;
            z-index: 20;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #fde047;
        }
        @keyframes heartFirework {
            0% { transform: translate(0, 0) scale(0.4); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1.4); opacity: 0; }
        }

        /* Flying Fly.png Sparkles & Animation */
        .sparkle-spark {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #ffffff, #ffd700);
            border-radius: 50%;
            box-shadow: 0 0 10px #ffd700, 0 0 20px #fff;
            pointer-events: none;
            animation: sparkleDrop 1.2s forwards ease-out;
            z-index: 220;
        }
        @keyframes sparkleDrop {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(40px) scale(0.2); opacity: 0; }
        }

        #flying-sprite {
            position: absolute;
            width: 120px;
            height: 120px;
            object-fit: contain;
            z-index: 210;
            pointer-events: none;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.9));
            display: none;
            transition: all 0.5s linear;
        }

        /* Villains Grid Layout (3x4 invisible grid) */
        #villains-container {
            position: absolute;
            right: 2%;
            top: 5%;
            bottom: 5%;
            width: 65%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            z-index: 10;
        }
        .villain-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .villain-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .villain-unit:hover {
            transform: scale(1.05);
        }
        .v-hp-container {
            width: 45px;
            height: 5px;
            background: #222;
            border: 1px solid #d4af37;
            border-radius: 3px;
            margin-bottom: 2px;
            overflow: hidden;
        }
        .v-hp-bar {
            width: 100%;
            height: 100%;
            background: #b8860b;
        }
        .villain-img {
            width: 75px;
            height: 110px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(184, 134, 11, 0.5));
        }
        .boss-img {
            width: 160px;
            height: 220px;
            transform: scale(1.25);
            filter: drop-shadow(0 0 30px rgba(255, 69, 0, 0.95));
        }

        /* Bottom Area: Claw Section with Rings */
        #claw-section {
            height: 40%;
            width: 100%;
            background-color: #03050a;
            background-image: linear-gradient(rgba(3, 5, 10, 0.3), rgba(3, 5, 10, 0.3)), url('background.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Rings Container: 6 rings side by side horizontally */
        #cases-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 700px;
            margin-bottom: 15px;
        }
        .case-card {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }
        .case-card:hover:not(.opened) {
            transform: scale(1.08);
        }
        .case-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(218, 165, 32, 0.6));
        }
        .case-val {
            margin-top: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #f0e682;
            text-shadow: 1px 1px 2px #000;
            min-height: 24px;
        }
        .case-card.opened {
            opacity: 0.5;
            cursor: default;
        }

        /* Turn info message */
        #turn-info {
            font-size: 1.1rem;
            color: #f0e682;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
            background: rgba(4, 6, 10, 0.8);
            padding: 6px 16px;
            border-radius: 6px;
            border: 1px solid #b8860b;
        }

        /* Boosters Popout Modal */
        #booster-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 6, 10, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 120;
        }
        #booster-modal-box {
            background: #090e1a;
            border: 3px solid #daa520;
            padding: 25px 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 35px rgba(218, 165, 32, 0.8);
            max-width: 500px;
            width: 90%;
        }
        #booster-modal-title {
            font-size: 1.5rem;
            color: #f0e682;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .booster-choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .booster-choice-btn {
            background: linear-gradient(135deg, #111827, #1f2937);
            border: 2px solid #b8860b;
            color: #f0e682;
            padding: 12px 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.2s;
            text-transform: uppercase;
        }
        .booster-choice-btn:hover {
            border-color: #daa520;
            transform: scale(1.02);
        }
        .booster-choice-btn.maxed {
            border-color: #ef4444;
            opacity: 0.6;
            cursor: pointer; /* clickable to allow proceeding when all maxed */
        }
        .booster-maxed-hint {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #f0e682;
            font-style: italic;
            display: none;
        }

        /* Floating Overlays & Banners */
        #floating-banner {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(4, 6, 10, 0.9);
            border: 2px solid #daa520;
            color: #f0e682;
            padding: 12px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(218, 165, 32, 0.7);
            z-index: 100;
            display: none;
            text-align: center;
            pointer-events: none;
        }

        /* Stage Clear Popup Overlay */
        #stage-clear-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 6, 10, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 150;
        }
        #stage-clear-box {
            background: #090e1a;
            border: 3px solid #daa520;
            padding: 30px 50px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 35px rgba(218, 165, 32, 0.8);
        }
        #stage-clear-msg {
            font-size: 1.8rem;
            color: #f0e682;
            margin-bottom: 20px;
            font-weight: bold;
        }
        #next-level-btn {
            background: linear-gradient(135deg, #8b6508, #daa520);
            border: 2px solid #fff;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 10px 30px;
            cursor: pointer;
            border-radius: 6px;
            text-transform: uppercase;
        }

        /* Expanded Final Fly Screen */
        #final-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 6, 10, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
        }
        #final-img {
            width: 550px;
            height: 550px;
            max-width: 90vw;
            max-height: 70vh;
            object-fit: contain;
            border: 3px solid #daa520;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(218, 165, 32, 0.8);
            margin-bottom: 20px;
        }
        #final-msg {
            font-size: 1.8rem;
            color: #f0e682;
            text-align: center;
            text-shadow: 0 0 10px #000;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        #restart-game-btn {
            background: linear-gradient(135deg, #8b6508, #daa520);
            border: 2px solid #fff;
            color: #fff;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 12px 35px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.8);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="start-screen">
        <button id="start-btn">Start Game</button>
    </div>

    <!-- Main Game Container -->
    <div id="game-container">
        <!-- Left Pane: Storyline Pictures -->
        <div id="story-pane">
            <img id="story-img" src="S1L1.png" alt="Storyline">
            <div id="story-title">Stage 1: The Detective</div>
        </div>

        <!-- Right Pane: Game Box -->
        <div id="game-pane">
            <!-- Top Area: Battle Arena -->
            <div id="battle-arena">
                <div id="road"></div>
                <div id="game-title-header">Angels & Demons & Banker</div>
                
                <!-- Hero Container with HP bar -->
                <div id="hero-container">
                    <div id="hero-hp-container"><div id="hero-hp-bar"></div></div>
                    <img id="hero" src="hero.png" alt="Hero">
                </div>

                <!-- Angel Container -->
                <div id="angel-container" onclick="handleAngelClick()">
                    <div class="angel-halo" id="angel-halo"></div>
                    <img id="angel" src="angel.png" alt="Angel">
                </div>

                <!-- Villains Grid Layout (3x4 invisible grid) -->
                <div id="villains-container"></div>
            </div>

            <!-- Bottom Area: Claw Section with Rings -->
            <div id="claw-section">
                <div id="cases-container"></div>
                <div id="turn-info">choose one</div>
            </div>
        </div>
    </div>

    <!-- Booster Modal Popout -->
    <div id="booster-modal" onclick="handleBoosterModalClick(event)">
        <div id="booster-modal-box">
            <div id="booster-modal-title">Choose a Booster to Level Up</div>
            <div class="booster-choices-container" id="booster-choices-container"></div>
            <div id="booster-maxed-hint" class="booster-maxed-hint">All boosters are maxed! Click anywhere to proceed.</div>
        </div>
    </div>

    <!-- Floating Banner -->
    <div id="floating-banner">Victory!</div>

    <!-- Stage Clear Screen -->
    <div id="stage-clear-screen">
        <div id="stage-clear-box">
            <div id="stage-clear-msg">Level Cleared!</div>
            <button id="next-level-btn" onclick="proceedToNextLevel()">Continue</button>
        </div>
    </div>

    <!-- Final Fly Screen -->
    <div id="final-screen">
        <img id="final-img" src="congrat.png" alt="Congratulations">
        <div id="final-msg">Together In Eternity</div>
        <button id="restart-game-btn" onclick="location.reload()">Play Again</button>
    </div>

    <!-- Flying Sprite Element -->
    <img id="flying-sprite" src="fly.png" alt="Flying Sprite">

    <script>
        const stageData = {
            1: {
                title: "Stage 1: The Detective",
                levels: { 1: "S1L1.png", 2: "S1L2.png", 3: "S1L3.png", 4: "S1L4.png", 5: "S1L5.png" }
            },
            2: {
                title: "Stage 2: Detective’s Helper",
                levels: { 1: "S2L1.png", 2: "S2L2.png", 3: "S2L3.png", 4: "S2L4.png", 5: "S2L5.png" }
            },
            3: {
                title: "Stage 3: The Priest",
                levels: { 1: "S3L1.png", 2: "S3L2.png", 3: "S3L3.png", 4: "S3L4.png", 5: "S3L5.png" }
            },
            4: {
                title: "Stage 4: The Close",
                levels: { 1: "S4L1.png", 2: "S4L2.png", 3: "S4L3.png", 4: "S4L4.png", 5: "S4L5.png" }
            }
        };

        let stageLevel = 1;
        let subLevel = 1;
        const maxStages = 4;
        const maxSubLevels = 5;
        
        let heroHp = 100;
        let heroMaxHp = 100;

        // Boosters config: Increase Number maxed to 15, +5 per level
        let boosters = [
            { id: 0, name: "Increase Number", level: 1, max: 15 },
            { id: 1, name: "Increase Choice", level: 1, max: 3 },
            { id: 2, name: "Increase Bounce", level: 1, max: 5 }
        ];

        let baseRingValues = [30, 50, 80, 100, 120, 150];
        let currentTurnRings = [];
        let accumulatedPower = 0;
        let picksAllowedTotal = 1;
        let picksMadeCount = 0;
        let turnPhase = 'CHOOSE_RING';
        let lastAttackedIndex = -1;
        let waitingForAngelClick = false;

        let villainsGrid = [];

        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const gameContainer = document.getElementById('game-container');
        const storyImg = document.getElementById('story-img');
        const storyTitle = document.getElementById('story-title');
        const villainsContainer = document.getElementById('villains-container');
        const floatingBanner = document.getElementById('floating-banner');
        const heroContainer = document.getElementById('hero-container');
        const heroHpBar = document.getElementById('hero-hp-bar');
        const angelContainer = document.getElementById('angel-container');
        const angelHalo = document.getElementById('angel-halo');
        const finalScreen = document.getElementById('final-screen');
        const casesContainer = document.getElementById('cases-container');
        const turnInfo = document.getElementById('turn-info');
        const stageClearScreen = document.getElementById('stage-clear-screen');
        const stageClearMsg = document.getElementById('stage-clear-msg');
        const boosterModal = document.getElementById('booster-modal');
        const boosterChoicesContainer = document.getElementById('booster-choices-container');
        const boosterMaxedHint = document.getElementById('booster-maxed-hint');
        const flyingSprite = document.getElementById('flying-sprite');

        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            gameContainer.style.display = 'flex';
            updateStoryPane();
            initLevel();
            initNewTurn();
        });

        function updateStoryPane() {
            if (stageData[stageLevel] && stageData[stageLevel].levels[subLevel]) {
                storyImg.src = stageData[stageLevel].levels[subLevel];
                storyTitle.innerText = `${stageData[stageLevel].title} - Level ${subLevel}`;
            }
        }

        function initLevel() {
            villainsGrid = new Array(12).fill(null);

            let villainHp = (stageLevel <= 2) ? 40 : 65;
            let bossHp = 250 + (stageLevel * 75);
            let bossSlotIndex = 7;

            if (subLevel === 5) {
                let bossImages = ['villain6.png', 'villain3.png', 'villain7.png', 'villain8.png'];
                let selectedBossImg = bossImages[stageLevel - 1] || 'boss.png';

                villainsGrid[bossSlotIndex] = { id: bossSlotIndex, isBoss: true, hp: bossHp, maxHp: bossHp, alive: true, img: selectedBossImg };

                let availableSlots = [0, 1, 2, 3, 4, 5, 6, 8, 9, 10, 11];
                let countNormal = 3 + Math.floor(Math.random() * 3);
                availableSlots.sort(() => Math.random() - 0.5);

                for (let i = 0; i < Math.min(countNormal, availableSlots.length); i++) {
                    let slotIdx = availableSlots[i];
                    villainsGrid[slotIdx] = { id: slotIdx, isBoss: false, hp: villainHp, maxHp: villainHp, alive: true, img: 'villain4.png' };
                }
            } else {
                let countVillains = (stageLevel === 1) ? (1 + Math.floor(Math.random() * 3)) : (3 + Math.floor(Math.random() * 4));
                let availableSlots = Array.from({length: 12}, (_, i) => i);
                availableSlots.sort(() => Math.random() - 0.5);

                let vImg = 'villain1.png';
                if (subLevel === 2) vImg = 'villain2.png';
                else if (subLevel === 3) vImg = 'villain4.png';
                else if (subLevel === 4) vImg = Math.random() < 0.5 ? 'villain1.png' : 'villain2.png';

                for (let i = 0; i < countVillains; i++) {
                    let slotIdx = availableSlots[i];
                    villainsGrid[slotIdx] = { id: slotIdx, isBoss: false, hp: villainHp, maxHp: villainHp, alive: true, img: vImg };
                }
            }

            renderVillainsGrid();
        }

        function renderVillainsGrid() {
            villainsContainer.innerHTML = '';
            villainsGrid.forEach((v, idx) => {
                let slotDiv = document.createElement('div');
                slotDiv.className = 'villain-slot';

                if (v && v.alive) {
                    let unitDiv = document.createElement('div');
                    unitDiv.className = 'villain-unit';
                    unitDiv.onclick = () => {
                        if (turnPhase === 'SELECT_TARGET') {
                            if (v.isBoss && villainsGrid.some((item, i) => item && !item.isBoss && item.alive)) {
                                showBanner("Boss must be attacked last!");
                                return;
                            }
                            selectTargetVillain(idx);
                        }
                    };

                    let hpCont = document.createElement('div');
                    hpCont.className = 'v-hp-container';
                    let hpBar = document.createElement('div');
                    hpBar.className = 'v-hp-bar';
                    hpBar.style.width = `${(v.hp / v.maxHp) * 100}%`;
                    hpCont.appendChild(hpBar);

                    let img = document.createElement('img');
                    img.className = `villain-img ${v.isBoss ? 'boss-img' : ''}`;
                    img.src = v.img;

                    unitDiv.appendChild(hpCont);
                    unitDiv.appendChild(img);
                    slotDiv.appendChild(unitDiv);
                }
                villainsContainer.appendChild(slotDiv);
            });
        }

        function initNewTurn() {
            if (waitingForAngelClick) return;
            turnPhase = 'CHOOSE_RING';
            accumulatedPower = 0;
            picksMadeCount = 0;
            
            picksAllowedTotal = boosters[1].level;
            turnInfo.innerText = `Choose rings (${picksMadeCount}/${picksAllowedTotal})`;

            // Increase Number booster: +5 for each level up under each ring
            let numberLevel = boosters[0].level;
            let levelBonus = (numberLevel - 1) * 5;

            let shuffledValues = [...baseRingValues].sort(() => Math.random() - 0.5);
            currentTurnRings = shuffledValues.map(val => {
                return {
                    val: val + levelBonus,
                    opened: false
                };
            });

            renderRings();
        }

        function renderRings() {
            casesContainer.innerHTML = '';
            currentTurnRings.forEach((c, idx) => {
                let card = document.createElement('div');
                card.className = `case-card ${c.opened ? 'opened' : ''}`;
                card.onclick = () => selectRing(idx);

                let img = document.createElement('img');
                img.className = 'case-img';
                img.src = 'case.png';

                let valDiv = document.createElement('div');
                valDiv.className = 'case-val';
                valDiv.innerText = c.opened ? `+${c.val}` : '';

                card.appendChild(img);
                card.appendChild(valDiv);
                casesContainer.appendChild(card);
            });
        }

        function selectRing(idx) {
            if (turnPhase !== 'CHOOSE_RING') return;
            let c = currentTurnRings[idx];
            if (c.opened) return;

            c.opened = true;
            accumulatedPower += c.val;
            picksMadeCount++;
            renderRings();

            if (picksMadeCount < picksAllowedTotal) {
                turnInfo.innerText = `Power: ${accumulatedPower} - Pick next ring (${picksMadeCount}/${picksAllowedTotal})`;
                showBanner(`Ring Opened: +${c.val}! Pick another ring.`);
            } else {
                turnPhase = 'SELECT_TARGET';
                turnInfo.innerText = `Total Power: ${accumulatedPower} - Choose target villain`;
                showBanner(`Total Power: ${accumulatedPower}! Choose target villain.`);
            }
        }

        function selectTargetVillain(targetIdx) {
            if (turnPhase !== 'SELECT_TARGET') return;
            lastAttackedIndex = targetIdx;

            let bounceLevel = boosters[2].level;
            let maxExtraTargets = bounceLevel;

            let targetIndices = [];
            if (villainsGrid[targetIdx] && villainsGrid[targetIdx].alive) {
                targetIndices.push(targetIdx);
            }

            if (maxExtraTargets > 0) {
                let count = 0;
                for (let i = 0; i < villainsGrid.length && count < maxExtraTargets; i++) {
                    let nextIdx = (targetIdx + i + 1) % villainsGrid.length;
                    let target = villainsGrid[nextIdx];
                    if (target && target.alive && !targetIndices.includes(nextIdx)) {
                        if (target.isBoss && villainsGrid.some(v => v && !v.isBoss && v.alive)) {
                            continue;
                        }
                        targetIndices.push(nextIdx);
                        count++;
                    }
                }
            }

            fireBouncingChristianCross(targetIndices, () => {
                applyDamageToList(accumulatedPower, targetIndices, targetIdx);

                if (villainsGrid.every(v => !v || !v.alive)) {
                    handleLevelClear();
                } else {
                    setTimeout(() => {
                        executeVillainTurnFireballAttacks();
                    }, 500);
                }
            });
        }

        function fireBouncingChristianCross(targetIndices, callback) {
            let arenaRect = document.getElementById('battle-arena').getBoundingClientRect();
            let heroRect = heroContainer.getBoundingClientRect();
            let villainSlots = villainsContainer.querySelectorAll('.villain-slot');

            if (targetIndices.length === 0) {
                if (callback) callback();
                return;
            }

            let proj = document.createElement('div');
            proj.className = 'christian-cross-projectile';
            
            let startX = heroRect.left - arenaRect.left + 50;
            let startY = heroRect.top - arenaRect.top + 100;
            
            proj.style.left = `${startX}px`;
            proj.style.top = `${startY}px`;
            document.getElementById('battle-arena').appendChild(proj);

            let currentIndex = 0;

            function moveToNextTarget() {
                if (currentIndex >= targetIndices.length) {
                    setTimeout(() => {
                        proj.remove();
                        if (callback) callback();
                    }, 200);
                    return;
                }

                let tIdx = targetIndices[currentIndex];
                let targetSlot = villainSlots[tIdx];

                if (targetSlot) {
                    let targetRect = targetSlot.getBoundingClientRect();
                    let destX = targetRect.left - arenaRect.left + targetRect.width / 2 - 18;
                    let destY = targetRect.top - arenaRect.top + targetRect.height / 2 - 25;

                    proj.style.transition = 'all 0.35s linear';
                    proj.style.left = `${destX}px`;
                    proj.style.top = `${destY}px`;

                    setTimeout(() => {
                        proj.style.transform = 'scale(1.3) rotate(15deg)';
                        setTimeout(() => {
                            proj.style.transform = 'scale(1) rotate(0deg)';
                            currentIndex++;
                            moveToNextTarget();
                        }, 150);
                    }, 350);
                } else {
                    currentIndex++;
                    moveToNextTarget();
                }
            }

            setTimeout(moveToNextTarget, 50);
        }

        function applyDamageToList(damageAmount, targetIndices, startTargetIdx) {
            let currentDamage = damageAmount;
            let wasTargetDefeated = false;

            for (let i = 0; i < targetIndices.length; i++) {
                let tIdx = targetIndices[i];
                let target = villainsGrid[tIdx];
                if (!target || !target.alive) continue;

                if (currentDamage >= target.hp) {
                    let overflow = currentDamage - target.hp;
                    target.hp = 0;
                    target.alive = false;
                    currentDamage = overflow;
                    if (tIdx === startTargetIdx) wasTargetDefeated = true;
                } else {
                    target.hp -= currentDamage;
                    currentDamage = 0;
                    if (tIdx === startTargetIdx) wasTargetDefeated = false;
                }

                if (currentDamage <= 0) break;
            }

            renderVillainsGrid();
            return wasTargetDefeated;
        }

        function executeVillainTurnFireballAttacks() {
            let livingVillains = villainsGrid.filter(v => v && v.alive);
            if (livingVillains.length === 0) return;

            let villainSlots = villainsContainer.querySelectorAll('.villain-slot');
            let arenaRect = document.getElementById('battle-arena').getBoundingClientRect();
            let heroRect = heroContainer.getBoundingClientRect();

            let activeIndices = [];
            villainsGrid.forEach((v, idx) => {
                if (v && v.alive) activeIndices.push(idx);
            });

            let attackers = activeIndices.filter(idx => idx !== lastAttackedIndex);
            if (attackers.length === 0) {
                attackers = activeIndices;
            }

            let attacksToFire = Math.min(attackers.length, 2);
            let fired = 0;

            let interval = setInterval(() => {
                if (fired >= attacksToFire) {
                    clearInterval(interval);
                    
                    let damageToHero = 10 + (stageLevel * 5);
                    heroHp = Math.max(0, heroHp - damageToHero);
                    heroHpBar.style.width = `${(heroHp / heroMaxHp) * 100}%`;

                    if (heroHp <= 0) {
                        showBanner("Hero Defeated! Restarting level...");
                        setTimeout(() => {
                            heroHp = 100;
                            heroHpBar.style.width = '100%';
                            initLevel();
                            initNewTurn();
                        }, 1500);
                    } else {
                        setTimeout(initNewTurn, 400);
                    }
                    return;
                }

                let chosenIdx = attackers[Math.floor(Math.random() * attackers.length)];
                let slot = villainSlots[chosenIdx];
                if (slot) {
                    let vRect = slot.getBoundingClientRect();
                    let fireball = document.createElement('div');
                    fireball.className = 'fireball-projectile';

                    let x1 = vRect.left - arenaRect.left + vRect.width / 2 - 15;
                    let y1 = vRect.top - arenaRect.top + vRect.height / 2 - 15;
                    let x2 = heroRect.left - arenaRect.left + heroRect.width / 2 - 15;
                    let y2 = heroRect.top - arenaRect.top + heroRect.height / 2 - 15;

                    fireball.style.left = `${x1}px`;
                    fireball.style.top = `${y1}px`;
                    document.getElementById('battle-arena').appendChild(fireball);

                    setTimeout(() => {
                        fireball.style.transition = 'all 0.4s ease-in';
                        fireball.style.left = `${x2}px`;
                        fireball.style.top = `${y2}px`;
                    }, 50);

                    setTimeout(() => fireball.remove(), 450);
                }

                fired++;
            }, 350);
        }

        function handleLevelClear() {
            if (subLevel === 5) {
                turnPhase = 'STAGE_CLEARED_ANGEL';
                waitingForAngelClick = true;
                turnInfo.innerText = "Touch the angel to clear stage!";
                casesContainer.innerHTML = '';
                
                angelContainer.style.display = 'flex';
                angelContainer.style.right = '5%';
                angelContainer.style.bottom = '12%';
                showBanner("Angel appeared! Click the Angel to finish stage!");
            } else {
                promptBoosterSelection();
            }
        }

        function handleAngelClick() {
            if (!waitingForAngelClick) return;
            waitingForAngelClick = false;

            heroContainer.style.left = '68%';
            heroContainer.style.bottom = '12%';

            setTimeout(() => {
                angelHalo.style.display = 'block';
                triggerFourWavesOfHearts();

                setTimeout(() => {
                    heroContainer.style.left = '5%';
                    heroContainer.style.bottom = '12%';
                    angelContainer.style.display = 'none';
                    angelHalo.style.display = 'none';

                    if (stageLevel === maxStages && subLevel === maxSubLevels) {
                        triggerFinalVictorySequence();
                    } else {
                        promptBoosterSelection();
                    }
                }, 3200);
            }, 2500);
        }

        function triggerFourWavesOfHearts() {
            let waveCount = 0;
            let waveInterval = setInterval(() => {
                waveCount++;
                spawnHeartBurst();
                if (waveCount >= 4) {
                    clearInterval(waveInterval);
                }
            }, 600);
        }

        function spawnHeartBurst() {
            for (let i = 0; i < 8; i++) {
                let heart = document.createElement('div');
                heart.className = 'white-heart';
                heart.innerHTML = '&#10084;';
                let rect = angelContainer.getBoundingClientRect();
                heart.style.left = `${rect.left + rect.width / 2}px`;
                heart.style.top = `${rect.top + rect.height / 2}px`;
                let angle = Math.random() * Math.PI * 2;
                let dist = 70 + Math.random() * 80;
                heart.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
                heart.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 1400);
            }
        }

        function promptBoosterSelection() {
            boosterChoicesContainer.innerHTML = '';
            
            let allMaxed = boosters.every(b => b.level >= b.max);

            boosters.forEach(b => {
                let btn = document.createElement('button');
                btn.className = `booster-choice-btn ${b.level >= b.max ? 'maxed' : ''}`;
                btn.innerText = `${b.name} (Lv. ${b.level}/${b.max})`;
                
                if (b.level < b.max) {
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        b.level++;
                        showBanner(`${b.name} Upgraded to Lv.${b.level}!`);
                        boosterModal.style.display = 'none';
                        showStageClearPopup();
                    };
                } else {
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        showBanner(`${b.name} is already maxed!`);
                    };
                }
                boosterChoicesContainer.appendChild(btn);
            });

            if (allMaxed) {
                boosterMaxedHint.style.display = 'block';
            } else {
                boosterMaxedHint.style.display = 'none';
            }

            boosterModal.style.display = 'flex';
        }

        function handleBoosterModalClick(e) {
            let allMaxed = boosters.every(b => b.level >= b.max);
            if (allMaxed) {
                boosterModal.style.display = 'none';
                showStageClearPopup();
            }
        }

        function showStageClearPopup() {
            stageClearMsg.innerText = `Stage ${stageLevel} Level ${subLevel} Cleared!`;
            stageClearScreen.style.display = 'flex';
        }

        function proceedToNextLevel() {
            stageClearScreen.style.display = 'none';

            subLevel++;
            if (subLevel > maxSubLevels) {
                subLevel = 1;
                stageLevel++;
            }

            heroHp = heroMaxHp;
            heroHpBar.style.width = '100%';

            updateStoryPane();
            initLevel();
            initNewTurn();
        }

        function triggerFinalVictorySequence() {
            gameContainer.style.display = 'none';
            finalScreen.style.display = 'flex';
            startFlySpriteSparkles();
        }

        function startFlySpriteSparkles() {
            flyingSprite.style.display = 'block';
            let posX = window.innerWidth / 2 - 60;
            let posY = window.innerHeight / 2 - 60;
            flyingSprite.style.left = `${posX}px`;
            flyingSprite.style.top = `${posY}px`;

            let flyInterval = setInterval(() => {
                posX = 50 + Math.random() * (window.innerWidth - 200);
                posY = 50 + Math.random() * (window.innerHeight - 200);
                flyingSprite.style.left = `${posX}px`;
                flyingSprite.style.top = `${posY}px`;

                for (let i = 0; i < 4; i++) {
                    let spark = document.createElement('div');
                    spark.className = 'sparkle-spark';
                    spark.style.left = `${posX + 40 + (Math.random() * 40 - 20)}px`;
                    spark.style.top = `${posY + 60 + (Math.random() * 20)}px`;
                    document.body.appendChild(spark);
                    setTimeout(() => spark.remove(), 1200);
                }
            }, 800);

            window.flyIntervalRef = flyInterval;
        }

        function showBanner(text) {
            floatingBanner.innerText = text;
            floatingBanner.style.display = 'block';
            setTimeout(() => {
                floatingBanner.style.display = 'none';
            }, 1800);
        }
    </script>
</body>
</html>

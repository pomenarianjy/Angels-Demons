<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angles & Demons & Banker</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #04060a;
            color: #d4af37;
            font-family: 'Times New Roman', Times, serif, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Fullscreen Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #060913;
            background-image: url('start.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 8vh;
            z-index: 100;
        }
        #start-btn {
            background: linear-gradient(135deg, #8b6508, #daa520);
            border: 2px solid #fff;
            color: #fff;
            font-size: 2.2rem;
            font-weight: bold;
            padding: 15px 55px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(218, 165, 32, 0.9);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Main Game Layout */
        #game-container {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: row;
        }

        /* Left Pane: Storyline Pictures (Exact 50/50 and exact left.png background setting) */
        #story-pane {
            width: 50%;
            height: 100%;
            background-image: url('left.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            border-right: 3px solid #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        #story-img {
            max-width: 100%;
            max-height: 65vh;
            border: 2px solid #daa520;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.4);
            object-fit: contain;
        }
        #story-title {
            margin-top: 15px;
            font-size: 1.4rem;
            color: #f0e682;
            letter-spacing: 1px;
            text-shadow: 1px 1px 3px #000;
        }

        /* Right Pane: Game Box (Exact 50/50 width) */
        #game-pane {
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Area: Battle Arena */
        #battle-arena {
            height: 52%;
            width: 100%;
            position: relative;
            background-color: #090e1a;
            overflow: hidden;
            border-bottom: 3px solid #000000;
        }
        #road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-image: url('sky.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
        }

        /* Hero Container & Movement */
        #hero-container {
            position: absolute;
            left: 5%;
            bottom: 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            transition: left 2.5s ease-in-out;
        }
        #hero {
            width: 150px;      
            height: 225px;      
            object-fit: contain;
            filter: drop-shadow(0 0 22px rgba(218, 165, 32, 0.85));
        }

        /* Hero Cross Projectile Animation (Hero shoots to Villain) */
        .cross-projectile {
            position: absolute;
            width: 30px;
            height: 30px;
            background: transparent;
            z-index: 25;
            pointer-events: none;
            transition: all 0.4s linear;
        }
        .cross-projectile::before, .cross-projectile::after {
            content: '';
            position: absolute;
            background: radial-gradient(circle, #ffeb3b, #ff9800, #f44336);
            box-shadow: 0 0 12px #ff9800;
        }
        .cross-projectile::before {
            top: 10px;
            left: 0;
            width: 30px;
            height: 10px;
            border-radius: 3px;
        }
        .cross-projectile::after {
            top: 0;
            left: 10px;
            width: 10px;
            height: 30px;
            border-radius: 3px;
        }

        /* Villain Laser Beam Animation (Villain attacks Hero automatically with laser at end of turn) */
        .laser-beam {
            position: absolute;
            height: 4px;
            background: radial-gradient(circle, #ff0055, #ff0000);
            box-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
            z-index: 25;
            pointer-events: none;
            transform-origin: left center;
            animation: laserFlash 0.3s forwards ease-out;
        }
        @keyframes laserFlash {
            0% { opacity: 1; transform: scaleX(1); }
            100% { opacity: 0; transform: scaleX(1); }
        }

        /* Hero HP Bar */
        #hero-hp-container {
            width: 100px;
            height: 8px;
            background: #222;
            border: 1px solid #d4af37;
            border-radius: 4px;
            margin-bottom: 5px;
            overflow: hidden;
        }
        #hero-hp-bar {
            width: 100%;
            height: 100%;
            background: #22c55e;
            transition: width 0.3s ease;
        }

        /* Angel Container & Alignment */
        #angel-container {
            position: absolute;
            right: 5%;
            bottom: 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 15;
            cursor: pointer;
            display: none;
        }
        #angel {
            width: 130px;      
            height: 195px;      
            object-fit: contain;
            filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.9));
            position: relative;
        }

        .angel-halo {
            position: absolute;
            top: -5px;
            width: 48px;
            height: 16px;
            border: 2px solid #fde047;
            border-radius: 50%;
            box-shadow: 0 0 15px #fde047;
            animation: haloGlow 1s infinite alternate;
            display: none;
        }
        @keyframes haloGlow {
            from { transform: scale(1); box-shadow: 0 0 10px #fde047; }
            to { transform: scale(1.1); box-shadow: 0 0 25px #fff; }
        }

        .white-heart {
            position: absolute;
            color: #ffffff;
            font-size: 20px;
            pointer-events: none;
            animation: heartFirework 1.4s forwards ease-out;
            z-index: 1;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #fde047;
        }
        @keyframes heartFirework {
            0% { transform: translate(0, 0) scale(0.4); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1.4); opacity: 0; }
        }

        /* Villains Grid Layout (3x4 invisible grid) */
        #villains-container {
            position: absolute;
            right: 2%;
            top: 5%;
            bottom: 5%;
            width: 65%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            z-index: 10;
        }
        .villain-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .villain-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .villain-unit:hover {
            transform: scale(1.05);
        }
        .v-hp-container {
            width: 45px;
            height: 5px;
            background: #222;
            border: 1px solid #d4af37;
            border-radius: 3px;
            margin-bottom: 2px;
            overflow: hidden;
        }
        .v-hp-bar {
            width: 100%;
            height: 100%;
            background: #b8860b;
        }
        .villain-img {
            width: 75px;
            height: 110px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(184, 134, 11, 0.5));
        }
        .boss-img {
            width: 110px;
            height: 160px;
            filter: drop-shadow(0 0 20px rgba(255, 69, 0, 0.8));
        }

        /* Bottom Area: Claw Section with Rings (User requested claw section setup to stay) */
        #claw-section {
            height: 48%;
            width: 100%;
            background-color: #03050a;
            background-image: linear-gradient(rgba(3, 5, 10, 0.3), rgba(3, 5, 10, 0.3)), url('background.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Rings Container: 6 rings side by side horizontally */
        #cases-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 700px;
            margin-bottom: 15px;
        }
        .case-card {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }
        .case-card:hover:not(.opened) {
            transform: scale(1.08);
        }
        .case-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(218, 165, 32, 0.6));
        }
        .case-val {
            margin-top: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #f0e682;
            text-shadow: 1px 1px 2px #000;
            min-height: 24px;
        }
        .case-card.opened {
            opacity: 0.5;
            cursor: default;
        }

        /* Turn info message */
        #turn-info {
            font-size: 1.1rem;
            color: #f0e682;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
            background: rgba(4, 6, 10, 0.8);
            padding: 6px 16px;
            border-radius: 6px;
            border: 1px solid #b8860b;
        }

        /* Boosters Dock */
        #boosters-dock {
            height: 65px;
            background: #050811;
            border-top: 1px solid #000000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 8px;
            z-index: 40;
        }
        .booster-slot {
            background: linear-gradient(135deg, #111827, #1f2937);
            border: 2px solid #b8860b;
            border-radius: 8px;
            width: 31%;
            height: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            box-shadow: 0 0 10px rgba(184, 134, 11, 0.2);
            transition: transform 0.1s, border-color 0.2s;
        }
        .booster-slot:active {
            transform: scale(0.96);
        }
        .booster-slot.maxed {
            border-color: #ef4444;
            opacity: 0.65;
            cursor: not-allowed;
            pointer-events: none;
        }
        .booster-name {
            font-size: 0.75rem;
            color: #f0e682;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .booster-counter {
            font-size: 0.8rem;
            color: #fff;
            margin-top: 2px;
        }

        /* Floating Overlays & Banners */
        #floating-banner {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(4, 6, 10, 0.9);
            border: 2px solid #daa520;
            color: #f0e682;
            padding: 12px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(218, 165, 32, 0.7);
            z-index: 100;
            display: none;
            text-align: center;
            pointer-events: none;
        }

        /* Stage Clear Popup Overlay */
        #stage-clear-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 6, 10, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 150;
        }
        #stage-clear-box {
            background: #090e1a;
            border: 3px solid #daa520;
            padding: 30px 50px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 35px rgba(218, 165, 32, 0.8);
        }
        #stage-clear-msg {
            font-size: 1.8rem;
            color: #f0e682;
            margin-bottom: 20px;
            font-weight: bold;
        }
        #next-level-btn {
            background: linear-gradient(135deg, #8b6508, #daa520);
            border: 2px solid #fff;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 10px 30px;
            cursor: pointer;
            border-radius: 6px;
            text-transform: uppercase;
        }

        /* Expanded Final Fly Screen */
        #final-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 6, 10, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
        }
        #final-img {
            width: 550px;
            height: 550px;
            max-width: 90vw;
            max-height: 70vh;
            object-fit: contain;
            border: 3px solid #daa520;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(218, 165, 32, 0.8);
            margin-bottom: 20px;
        }
        #final-msg {
            font-size: 1.8rem;
            color: #f0e682;
            text-align: center;
            text-shadow: 0 0 10px #000;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        #restart-game-btn {
            background: linear-gradient(135deg, #8b6508, #daa520);
            border: 2px solid #fff;
            color: #fff;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 12px 35px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.8);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="start-screen">
        <button id="start-btn">Start Game</button>
    </div>

    <!-- Main Game Container -->
    <div id="game-container">
        <!-- Left Pane: Storyline Pictures (50%) -->
        <div id="story-pane">
            <img id="story-img" src="S1L1.png" alt="Storyline">
            <div id="story-title">Stage 1: The Detective</div>
        </div>

        <!-- Right Pane: Game Box (50%) -->
        <div id="game-pane">
            <!-- Top Area: Battle Arena -->
            <div id="battle-arena">
                <div id="road"></div>
                
                <!-- Hero Container with HP bar -->
                <div id="hero-container">
                    <div id="hero-hp-container"><div id="hero-hp-bar"></div></div>
                    <img id="hero" src="hero.png" alt="Hero">
                </div>

                <!-- Angel Container -->
                <div id="angel-container">
                    <div class="angel-halo" id="angel-halo"></div>
                    <img id="angel" src="angel.png" alt="Angel">
                </div>

                <!-- Villains Grid Container (3x4 invisible grid) -->
                <div id="villains-container"></div>
            </div>

            <!-- Bottom Area: Claw Section with Rings -->
            <div id="claw-section">
                <div id="cases-container"></div>
                <div id="turn-info">Select <span id="picks-left">1</span> ring(s)</div>

                <!-- Boosters Dock (3 Boosters specified) -->
                <div id="boosters-dock">
                    <div class="booster-slot" id="booster-0" onclick="triggerBooster(0)">
                        <div class="booster-name">Increase Number</div>
                        <div class="booster-counter" id="count-0">Lv.1</div>
                    </div>
                    <div class="booster-slot" id="booster-1" onclick="triggerBooster(1)">
                        <div class="booster-name">Increase Ring Choosing</div>
                        <div class="booster-counter" id="count-1">Lv.1</div>
                    </div>
                    <div class="booster-slot" id="booster-2" onclick="triggerBooster(2)">
                        <div class="booster-name">Increase Bounce</div>
                        <div class="booster-counter" id="count-2">Lv.1</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Banner -->
    <div id="floating-banner">Victory!</div>

    <!-- Stage Clear Screen -->
    <div id="stage-clear-screen">
        <div id="stage-clear-box">
            <div id="stage-clear-msg">Level Cleared!</div>
            <button id="next-level-btn" onclick="proceedToNextLevel()">Continue</button>
        </div>
    </div>

    <!-- Final Fly Screen -->
    <div id="final-screen">
        <img id="final-img" src="fly.png" alt="Final Fly">
        <div id="final-msg">Together In Eternity</div>
        <button id="restart-game-btn" onclick="location.reload()">Play Again</button>
    </div>

    <script>
        // Storyline Sequence Data for all Stages & Levels
        const stageData = {
            1: {
                title: "Stage 1: The Detective",
                levels: {
                    1: "S1L1.png",
                    2: "S1L2.png",
                    3: "S1L3.png",
                    4: "S1L4.png",
                    5: "S1L5.png"
                }
            },
            2: {
                title: "Stage 2: Detective’s Helper",
                levels: {
                    1: "S2L1.png",
                    2: "S2L2.png",
                    3: "S2L3.png",
                    4: "S2L4.png",
                    5: "S2L5.png"
                }
            },
            3: {
                title: "Stage 3: The Priest",
                levels: {
                    1: "S3L1.png",
                    2: "S3L2.png",
                    3: "S3L3.png",
                    4: "S3L4.png",
                    5: "S3L5.png"
                }
            },
            4: {
                title: "Stage 4: The Close",
                levels: {
                    1: "S4L1.png",
                    2: "S4L2.png",
                    3: "S4L3.png",
                    4: "S4L4.png",
                    5: "S4L5.png"
                }
            }
        };

        // Game State Variables (4 stages, 5 levels each = 20 levels total)
        let stageLevel = 1; // 1 to 4
        let subLevel = 1;   // 1 to 5
        const maxStages = 4;
        const maxSubLevels = 5;
        
        // Hero HP tracking
        let heroHp = 100;
        let heroMaxHp = 100;

        // Boosters state
        let boosters = [
            { level: 1, max: 7 },
            { level: 1, max: 3 },
            { level: 1, max: 5 }
        ];

        // Rings & Turn Management
        let baseRingValues = [10, 30, 50, 80, 100, 120];
        let currentTurnRings = [];
        let picksAllowed = 1;
        let picksMadeThisTurn = 0;
        let accumulatedPower = 0;
        let turnPhase = 'CHOOSE_CASES'; // 'CHOOSE_CASES' or 'SELECT_TARGET'

        // Villains Data Setup for 3x4 Grid
        let villainsGrid = [];

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const gameContainer = document.getElementById('game-container');
        const storyImg = document.getElementById('story-img');
        const storyTitle = document.getElementById('story-title');
        const villainsContainer = document.getElementById('villains-container');
        const floatingBanner = document.getElementById('floating-banner');
        const heroContainer = document.getElementById('hero-container');
        const heroHpBar = document.getElementById('hero-hp-bar');
        const angelContainer = document.getElementById('angel-container');
        const angelHalo = document.getElementById('angel-halo');
        const finalScreen = document.getElementById('final-screen');
        const casesContainer = document.getElementById('cases-container');
        const picksLeftSpan = document.getElementById('picks-left');
        const turnInfo = document.getElementById('turn-info');
        const stageClearScreen = document.getElementById('stage-clear-screen');
        const stageClearMsg = document.getElementById('stage-clear-msg');

        // Initialize Game
        startBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            gameContainer.style.display = 'flex';
            updateStoryPane();
            initLevel();
            initNewTurn();
        });

        function updateStoryPane() {
            if (stageData[stageLevel] && stageData[stageLevel].levels[subLevel]) {
                storyImg.src = stageData[stageLevel].levels[subLevel];
                storyTitle.innerText = `${stageData[stageLevel].title} - Level ${subLevel}`;
            }
        }

        // Initialize Level Villains (3x4 Grid setup)
        function initLevel() {
            villainsGrid = new Array(12).fill(null);

            let villainHp = (stageLevel <= 2) ? 40 : 65;
            let bossHp = 200 + (stageLevel * 50);

            if (subLevel === 5) {
                let bossImages = ['villain6.png', 'villain3.png', 'villain7.png', 'villain8.png'];
                let selectedBossImg = bossImages[stageLevel - 1] || 'boss.png';

                villainsGrid[5] = {
                    id: 5,
                    isBoss: true,
                    hp: bossHp,
                    maxHp: bossHp,
                    alive: true,
                    img: selectedBossImg
                };

                let availableSlots = [0, 1, 2, 4, 6, 7, 8, 9, 10, 11];
                let countNormal = 3 + Math.floor(Math.random() * 3);
                availableSlots.sort(() => Math.random() - 0.5);

                for (let i = 0; i < Math.min(countNormal, availableSlots.length); i++) {
                    let slotIdx = availableSlots[i];
                    villainsGrid[slotIdx] = {
                        id: slotIdx,
                        isBoss: false,
                        hp: villainHp,
                        maxHp: villainHp,
                        alive: true,
                        img: 'villain4.png'
                    };
                }
            } else {
                let countVillains = 3 + Math.floor(Math.random() * 5);
                let availableSlots = Array.from({length: 12}, (_, i) => i);
                availableSlots.sort(() => Math.random() - 0.5);

                let vImg = 'villain1.png';
                if (subLevel === 2) vImg = 'villain2.png';
                else if (subLevel === 3) vImg = 'villain4.png';
                else if (subLevel === 4) {
                    vImg = Math.random() < 0.5 ? 'villain1.png' : 'villain2.png';
                }

                for (let i = 0; i < countVillains; i++) {
                    let slotIdx = availableSlots[i];
                    villainsGrid[slotIdx] = {
                        id: slotIdx,
                        isBoss: false,
                        hp: villainHp,
                        maxHp: villainHp,
                        alive: true,
                        img: vImg
                    };
                }
            }

            renderVillainsGrid();
        }

        // Render Villains Grid (3x4)
        function renderVillainsGrid() {
            villainsContainer.innerHTML = '';
            villainsGrid.forEach((v, idx) => {
                let slotDiv = document.createElement('div');
                slotDiv.className = 'villain-slot';

                if (v && v.alive) {
                    let unitDiv = document.createElement('div');
                    unitDiv.className = 'villain-unit';
                    unitDiv.onclick = () => {
                        if (turnPhase === 'SELECT_TARGET') {
                            if (v.isBoss && villainsGrid.some((item, i) => item && !item.isBoss && item.alive)) {
                                showBanner("Boss must be attacked last!");
                                return;
                            }
                            selectTargetVillain(idx);
                        }
                    };

                    let hpCont = document.createElement('div');
                    hpCont.className = 'v-hp-container';
                    let hpBar = document.createElement('div');
                    hpBar.className = 'v-hp-bar';
                    hpBar.style.width = `${(v.hp / v.maxHp) * 100}%`;
                    hpCont.appendChild(hpBar);

                    let img = document.createElement('img');
                    img.className = `villain-img ${v.isBoss ? 'boss-img' : ''}`;
                    img.src = v.img;

                    unitDiv.appendChild(hpCont);
                    unitDiv.appendChild(img);
                    slotDiv.appendChild(unitDiv);
                }
                villainsContainer.appendChild(slotDiv);
            });
        }

        // Ring Generation and Management for Each Turn
        function initNewTurn() {
            turnPhase = 'CHOOSE_CASES';
            picksMadeThisTurn = 0;
            accumulatedPower = 0;
            picksAllowed = boosters[1].level;
            picksLeftSpan.innerText = picksAllowed - picksMadeThisTurn;
            turnInfo.innerHTML = `Select <span id="picks-left">${picksAllowed - picksMadeThisTurn}</span> ring(s)`;

            let levelBonus = 0;
            let currentLvl = boosters[0].level;
            if (currentLvl === 2) levelBonus = 45;
            else if (currentLvl === 3) levelBonus = 65;
            else if (currentLvl === 4) levelBonus = 85;
            else if (currentLvl === 5) levelBonus = 115;
            else if (currentLvl === 6) levelBonus = 135;
            else if (currentLvl === 7) levelBonus = 155;

            let extraPerLevel = (currentLvl - 1) * 5;
            let totalBonus = levelBonus + (currentLvl > 1 ? extraPerLevel : 0);

            let shuffledValues = [...baseRingValues].sort(() => Math.random() - 0.5);
            currentTurnRings = shuffledValues.map(val => {
                return {
                    val: val + totalBonus,
                    opened: false
                };
            });

            renderRings();
        }

        function renderRings() {
            casesContainer.innerHTML = '';
            currentTurnRings.forEach((c, idx) => {
                let card = document.createElement('div');
                card.className = `case-card ${c.opened ? 'opened' : ''}`;
                card.onclick = () => selectRing(idx);

                let img = document.createElement('img');
                img.className = 'case-img';
                img.src = 'ring.png';

                let valDiv = document.createElement('div');
                valDiv.className = 'case-val';
                valDiv.innerText = c.opened ? `+${c.val}` : '?';

                card.appendChild(img);
                card.appendChild(valDiv);
                casesContainer.appendChild(card);
            });
        }

        function selectRing(idx) {
            if (turnPhase !== 'CHOOSE_CASES') return;
            let c = currentTurnRings[idx];
            if (c.opened || picksMadeThisTurn >= picksAllowed) return;

            c.opened = true;
            accumulatedPower += c.val;
            picksMadeThisTurn++;
            
            let span = document.getElementById('picks-left');
            if(span) span.innerText = picksAllowed - picksMadeThisTurn;
            renderRings();

            if (picksMadeThisTurn >= picksAllowed) {
                turnPhase = 'SELECT_TARGET';
                turnInfo.innerHTML = `Total Power: ${accumulatedPower} - Click villain to attack!`;
                showBanner(`Power Collected: ${accumulatedPower}! Click a villain to attack.`);
            }
        }

        function selectTargetVillain(targetIdx) {
            if (turnPhase !== 'SELECT_TARGET') return;

            // Hero shoots cross projectile to villain
            fireHeroCrossToVillain(targetIdx, () => {
                applyDamageWithBounce(accumulatedPower, targetIdx);

                if (villainsGrid.every(v => !v || !v.alive)) {
                    handleLevelClear();
                } else {
                    setTimeout(() => {
                        executeVillainTurnLaserAttacks();
                    }, 500);
                }
            });
        }

        function fireHeroCrossToVillain(targetIdx, callback) {
            let proj = document.createElement('div');
            proj.className = 'cross-projectile';
            
            let arenaRect = document.getElementById('battle-arena').getBoundingClientRect();
            let heroRect = heroContainer.getBoundingClientRect();
            
            let villainSlots = villainsContainer.querySelectorAll('.villain-slot');
            let targetSlot = villainSlots[targetIdx];
            
            proj.style.left = `${heroRect.left - arenaRect.left + 50}px`;
            proj.style.top = `${heroRect.top - arenaRect.top + 100}px`;
            document.getElementById('battle-arena').appendChild(proj);

            if (targetSlot) {
                let targetRect = targetSlot.getBoundingClientRect();
                setTimeout(() => {
                    proj.style.left = `${targetRect.left - arenaRect.left + targetRect.width / 2}px`;
                    proj.style.top = `${targetRect.top - arenaRect.top + targetRect.height / 2}px`;
                }, 50);
            }

            setTimeout(() => {
                proj.remove();
                if (callback) callback();
            }, 450);
        }

        function applyDamageWithBounce(damageAmount, startTargetIdx) {
            let bounceLevel = boosters[2].level; 
            let maxExtraTargets = bounceLevel - 1;

            let targetIndices = [];
            if (villainsGrid[startTargetIdx] && villainsGrid[startTargetIdx].alive) {
                targetIndices.push(startTargetIdx);
            }

            if (maxExtraTargets > 0) {
                let count = 0;
                for (let i = 0; i < villainsGrid.length && count < maxExtraTargets; i++) {
                    let nextIdx = (startTargetIdx + i + 1) % villainsGrid.length;
                    let target = villainsGrid[nextIdx];
                    if (target && target.alive && !targetIndices.includes(nextIdx)) {
                        if (target.isBoss && villainsGrid.some(v => v && !v.isBoss && v.alive)) {
                            continue;
                        }
                        targetIndices.push(nextIdx);
                        count++;
                    }
                }
            }

            let currentDamage = damageAmount;
            for (let i = 0; i < targetIndices.length; i++) {
                let tIdx = targetIndices[i];
                let target = villainsGrid[tIdx];
                if (!target || !target.alive) continue;

                if (currentDamage >= target.hp) {
                    let overflow = currentDamage - target.hp;
                    target.hp = 0;
                    target.alive = false;
                    currentDamage = overflow;
                } else {
                    target.hp -= currentDamage;
                    currentDamage = 0;
                }

                if (currentDamage <= 0) break;
            }

            renderVillainsGrid();
        }

        // Villain automatically attacks Hero at end of turn with lasers
        function executeVillainTurnLaserAttacks() {
            let livingVillains = villainsGrid.filter(v => v && v.alive);
            if (livingVillains.length === 0) return;

            let villainSlots = villainsContainer.querySelectorAll('.villain-slot');
            let arenaRect = document.getElementById('battle-arena').getBoundingClientRect();
            let heroRect = heroContainer.getBoundingClientRect();

            let activeIndices = [];
            villainsGrid.forEach((v, idx) => {
                if (v && v.alive) activeIndices.push(idx);
            });

            let attacksToFire = Math.min(activeIndices.length, 2);
            let fired = 0;

            let interval = setInterval(() => {
                if (fired >= attacksToFire) {
                    clearInterval(interval);
                    
                    // Apply damage to hero automatically
                    let damageToHero = 10 + (stageLevel * 5);
                    heroHp = Math.max(0, heroHp - damageToHero);
                    heroHpBar.style.width = `${(heroHp / heroMaxHp) * 100}%`;

                    if (heroHp <= 0) {
                        showBanner("Hero Defeated! Restarting level...");
                        setTimeout(() => {
                            heroHp = 100;
                            heroHpBar.style.width = '100%';
                            initLevel();
                            initNewTurn();
                        }, 1500);
                    } else {
                        setTimeout(initNewTurn, 400);
                    }
                    return;
                }

                let chosenIdx = activeIndices[Math.floor(Math.random() * activeIndices.length)];
                let slot = villainSlots[chosenIdx];
                if (slot) {
                    let vRect = slot.getBoundingClientRect();
                    let laser = document.createElement('div');
                    laser.className = 'laser-beam';

                    let x1 = vRect.left - arenaRect.left + vRect.width / 2;
                    let y1 = vRect.top - arenaRect.top + vRect.height / 2;
                    let x2 = heroRect.left - arenaRect.left + heroRect.width / 2;
                    let y2 = heroRect.top - arenaRect.top + heroRect.height / 2;

                    let length = Math.hypot(x2 - x1, y2 - y1);
                    let angle = Math.atan2(y2 - y1, x2 - x1) * (180 / Math.PI);

                    laser.style.width = `${length}px`;
                    laser.style.left = `${x1}px`;
                    laser.style.top = `${y1}px`;
                    laser.style.transform = `rotate(${angle}deg)`;

                    document.getElementById('battle-arena').appendChild(laser);
                    setTimeout(() => laser.remove(), 300);
                }

                fired++;
            }, 300);
        }

        function incrementBooster(type) {
            if (boosters[type].level < boosters[type].max) {
                boosters[type].level++;
                document.getElementById(`count-${type}`).innerText = `Lv.${boosters[type].level}`;
                
                if (boosters[type].level >= boosters[type].max) {
                    let slot = document.getElementById(`booster-${type}`);
                    slot.classList.add('maxed');
                    showBanner(`${slot.querySelector('.booster-name').innerText} Maxed!`);
                }
            }
        }

        function triggerBooster(type) {
            incrementBooster(type);
        }

        function handleLevelClear() {
            if (subLevel < maxSubLevels || stageLevel < maxStages) {
                stageClearMsg.innerText = `Stage ${stageLevel} Level ${subLevel} Cleared!`;
                stageClearScreen.style.display = 'flex';
            } else {
                showBanner("All Trials Conquered!");
                setTimeout(triggerVictorySequence, 2000);
            }
        }

        function proceedToNextLevel() {
            stageClearScreen.style.display = 'none';

            let randomBoosterType = Math.floor(Math.random() * 3);
            incrementBooster(randomBoosterType);

            subLevel++;
            if (subLevel > maxSubLevels) {
                subLevel = 1;
                stageLevel++;
            }

            heroHp = heroMaxHp;
            heroHpBar.style.width = '100%';

            updateStoryPane();
            initLevel();
            initNewTurn();
        }

        function triggerVictorySequence() {
            heroContainer.style.left = '72%';
            setTimeout(() => {
                angelContainer.style.display = 'flex';
                angelHalo.style.display = 'block';
                startHeartFireworks();

                setTimeout(() => {
                    gameContainer.style.display = 'none';
                    finalScreen.style.display = 'flex';
                }, 3000);
            }, 2500);
        }

        function startHeartFireworks() {
            let interval = setInterval(() => {
                for(let i=0; i<5; i++) {
                    let heart = document.createElement('div');
                    heart.className = 'white-heart';
                    heart.innerHTML = '&#10084;';
                    let rect = angelContainer.getBoundingClientRect();
                    heart.style.left = `${rect.left + rect.width/2}px`;
                    heart.style.top = `${rect.top + rect.height/2}px`;
                    let angle = Math.random() * Math.PI * 2;
                    let dist = 60 + Math.random() * 90;
                    heart.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
                    heart.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 1400);
                }
            }, 300);
            setTimeout(() => clearInterval(interval), 3000);
        }

        function showBanner(text) {
            floatingBanner.innerText = text;
            floatingBanner.style.display = 'block';
            setTimeout(() => {
                floatingBanner.style.display = 'none';
            }, 1800);
        }
    </script>
</body>

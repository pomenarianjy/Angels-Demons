<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angels & Demons & Banker - Grid Formation & Physics Claw</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #04060a;
            color: #d4af37;
            font-family: 'Times New Roman', Times, serif, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Fullscreen Start Screen with start.png */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #060913 url('start.png') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 8vh;
            z-index: 100;
        }
        #start-btn {
            background: linear-gradient(135deg, #8b6508, #daa520);
            border: 2px solid #fff;
            color: #fff;
            font-size: 2.2rem;
            font-weight: bold;
            padding: 15px 55px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(218, 165, 32, 0.9);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Main Game Layout */
        #game-container {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: row;
        }

        /* Left Pane: Storyline Pictures */
        #story-pane {
            width: 35%;
            height: 100%;
            background: rgba(8, 11, 18, 0.96);
            border-right: 3px solid #b8860b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        #story-img {
            max-width: 100%;
            max-height: 70vh;
            border: 2px solid #daa520;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.4);
            object-fit: contain;
        }
        #story-title {
            margin-top: 15px;
            font-size: 1.4rem;
            color: #f0e682;
            letter-spacing: 1px;
        }

        /* Right Pane: Game Box */
        #game-pane {
            width: 65%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Area: Battle Arena with 3x4 Grid Formation */
        #battle-arena {
            height: 45%;
            width: 100%;
            position: relative;
            background: #090e1a;
            overflow: hidden;
            border-bottom: 3px solid #b8860b;
        }
        #road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: rgba(14, 20, 32, 0.75);
        }

        /* Hero & Angel */
        #hero-container {
            position: absolute;
            left: 6%;
            bottom: 15%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        #hero {
            width: 85px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(218, 165, 32, 0.5));
        }
        #angel {
            position: absolute;
            left: 16%;
            bottom: 15%;
            width: 85px;
            height: 120px;
            object-fit: contain;
            display: none;
            z-index: 10;
        }

        /* 3x4 Grid Formation Field for Villains */
        #villains-grid-field {
            position: absolute;
            right: 5%;
            top: 8%;
            width: 55%;
            height: 84%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            z-index: 10;
        }
        .grid-cell {
            background: rgba(15, 23, 42, 0.6);
            border: 1px dashed rgba(184, 134, 11, 0.3);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .villain-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 2px;
            border-radius: 6px;
            transition: transform 0.1s;
        }
        .villain-unit:hover {
            transform: scale(1.06);
        }
        .villain-unit.active-target {
            background: rgba(218, 165, 32, 0.3);
            border: 1px solid #d4af37;
            box-shadow: 0 0 10px rgba(218, 165, 32, 0.6);
        }
        .villain-unit.disabled-target {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .v-hp-container {
            width: 38px;
            height: 4px;
            background: #222;
            border: 1px solid #d4af37;
            border-radius: 2px;
            margin-bottom: 2px;
            overflow: hidden;
        }
        .v-hp-bar {
            width: 100%;
            height: 100%;
            background: #b8860b;
        }
        .villain-img {
            width: 38px;
            height: 52px;
            object-fit: contain;
        }

        /* Bottom Area: 180-Degree Clock-Arm Rotating Claw & Physics Bead Pile Pit */
        #claw-section {
            height: 55%;
            width: 100%;
            background: #03050a;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }

        #vault-pit {
            position: absolute;
            bottom: 0;
            left: 10%;
            width: 80%;
            height: 95%;
            background: #080d19;
            border-top: 3px solid #b8860b;
            border-left: 3px solid #1f293d;
            border-right: 3px solid #1f293d;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            overflow: hidden;
        }

        /* Fixed Root Anchor point exactly at top-center of the vault pit */
        #claw-pivot {
            position: absolute;
            top: 0px;
            left: 50%;
            width: 16px;
            height: 16px;
            background: #daa520;
            border-radius: 50%;
            transform: translateX(-50%);
            z-index: 30;
            box-shadow: 0 0 10px #d4af37;
        }

        /* Clock-Arm Rotating & Extending Mechanism resting above bead pile */
        #rotating-arm {
            position: absolute;
            top: 8px;
            left: 50%;
            width: 6px;
            height: 40px;
            background: #8b6508;
            transform-origin: top center;
            transform: translateX(-50%) rotate(0deg);
            z-index: 25;
            pointer-events: none;
        }

        #claw-head {
            position: absolute;
            bottom: -22px;
            left: 50%;
            width: 36px;
            height: 22px;
            transform: translateX(-50%);
            display: flex;
            justify-content: space-between;
            z-index: 26;
        }
        .claw-hook-l, .claw-hook-r {
            width: 10px;
            height: 22px;
            background: #b8860b;
            border: 1px solid #f0e682;
        }
        .claw-hook-l { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
        .claw-hook-r { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }

        /* Physics Bead Pile Elements - Correctly spawned at bottom and piled up */
        .physics-bead {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: bold;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.8);
        }

        /* HUD Overlays */
        #hud {
            position: absolute;
            top: 8px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: bold;
            color: #f0e682;
            text-shadow: 1px 1px 2px #000;
            z-index: 40;
        }

        /* Cardinal's Cross Bullet */
        .cardinal-bullet {
            position: absolute;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 25;
            pointer-events: none;
        }
        .cardinal-bullet::before {
            content: '';
            position: absolute;
            width: 4px;
            height: 20px;
            background: #d4af37;
            box-shadow: 0 0 8px #fff;
        }
        .cardinal-bullet::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 4px;
            background: #d4af37;
            box-shadow: 0 0 8px #fff;
            top: 6px;
        }

        /* Modal Overlay & Upgrades Selector */
        #overlay-msg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 60;
            text-align: center;
            padding: 20px;
        }
        #overlay-msg h2 {
            font-size: 2.2rem;
            color: #f0e682;
            margin-bottom: 15px;
        }
        .upgrade-container {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .upgrade-card {
            background: #111827;
            border: 2px solid #b8860b;
            border-radius: 8px;
            padding: 12px;
            width: 160px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .upgrade-card:hover {
            transform: scale(1.05);
            background: #1f2937;
        }
        .upgrade-card h3 {
            font-size: 1rem;
            color: #f0e682;
            margin-top: 0;
        }
        .upgrade-card p {
            font-size: 0.8rem;
            color: #ccc;
        }
        #overlay-btn {
            background: #b8860b;
            color: #fff;
            border: 2px solid #fff;
            padding: 12px 35px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="start-screen">
        <button id="start-btn" onclick="startGame()">Start Game</button>
    </div>

    <!-- Main Container -->
    <div id="game-container">
        <!-- Left Pane: Storyline Pictures -->
        <div id="story-pane">
            <div id="story-title">Stage 1: The Detective</div>
            <img id="story-img" src="S1L1.png" alt="Storyline">
        </div>

        <!-- Right Pane: Game Box -->
        <div id="game-pane">
            <div id="hud">
                <div id="hud-info">Stage 1 - Level 1</div>
                <div id="hud-power">Power: 0 | Scoop beads at bottom pit, then hit current active column!</div>
            </div>

            <!-- Top Area: Battle Arena with 3x4 Grid Formation -->
            <div id="battle-arena">
                <div id="road">
                    <div id="hero-container">
                        <img id="hero" src="hero.png" alt="Hero">
                    </div>
                    <img id="angel" src="angel.png" alt="Angel">
                    <!-- 3x4 Grid Formation Container -->
                    <div id="villains-grid-field"></div>
                </div>
            </div>

            <!-- Bottom Area: 180-Degree Clock-Arm Rotating Claw & Bead Pile Pit -->
            <div id="claw-section" onpointerdown="handleClawTrigger(event)">
                <div id="vault-pit">
                    <div id="claw-pivot"></div>
                    <div id="rotating-arm">
                        <div id="claw-head">
                            <div class="claw-hook-l"></div>
                            <div class="claw-hook-r"></div>
                        </div>
                    </div>
                    <div id="bead-container" style="position: absolute; width: 100%; height: 100%; top:0; left:0; pointer-events: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Overlay & Upgrades Selector -->
    <div id="overlay-msg">
        <h2 id="msg-title">Level Cleared</h2>
        <p id="msg-desc" style="color: #fff; margin-bottom: 10px;"></p>
        <div id="upgrade-box" class="upgrade-container"></div>
        <button id="overlay-btn" style="display:none;" onclick="proceedNext()">Continue</button>
    </div>

    <script>
        let stage = 1;
        let level = 1;
        let heroPower = 0;
        let isClawBusy = false;
        let gridData = []; // 3 rows x 4 cols grid storing villain objects or null
        let physicsBeads = [];

        let upgrades = {
            reach: 1,  // Max 7
            power: 1,  // Max 7
            bounce: 1  // Max 7
        };

        const villainFiles = {
            1: 'villain1.png', 2: 'villain2.png', 3: 'villain3.png', 4: 'villain4.png',
            5: 'villain5.png', 6: 'villain6.png', 7: 'villain7.png', 8: 'villain8.png'
        };

        const stagesConfig = {
            1: { name: "The Detective", prefix: "S1" },
            2: { name: "Detective’s Helper", prefix: "S2" },
            3: { name: "The Priest", prefix: "S3" },
            4: { name: "The Close", prefix: "S4" }
        };

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            setupLevel();
        }

        function setupLevel() {
            const cfg = stagesConfig[stage];
            document.getElementById('story-img').src = `${cfg.prefix}L${level}.png`;
            document.getElementById('story-title').innerText = `Stage ${stage}: ${cfg.name}`;
            document.getElementById('hud-info').innerText = `Stage ${stage} - Level ${level}`;
            document.getElementById('angel').style.display = 'none';

            // Initialize 3 rows x 4 columns grid with random arrangements and some empty spaces
            gridData = [];
            for (let r = 0; r < 3; r++) {
                let rowArr = [];
                for (let c = 0; c < 4; c++) {
                    // Random chance to spawn a villain or leave space empty (do not fill all spaces)
                    if (Math.random() < 0.75) {
                        let vId = level === 5 ? Math.min(stage + 4, 8) : Math.min(stage + ((r + c) % 4), 8);
                        let maxHp = level === 5 ? 180 + (stage * 30) : 50 + (stage * 15) + (level * 12);
                        rowArr.push({
                            row: r,
                            col: c,
                            id: vId,
                            hp: maxHp,
                            maxHp: maxHp,
                            forwardOffset: 0
                        });
                    } else {
                        rowArr.push(null);
                    }
                }
                gridData.push(rowArr);
            }

            // Ensure at least one villain exists in column 0 so game is immediately playable
            let colZeroHasVillain = gridData.some(row => row[0] !== null);
            if (!colZeroHasVillain) {
                let rRand = Math.floor(Math.random() * 3);
                let vId = Math.min(stage, 8);
                let maxHp = 50 + (stage * 15);
                gridData[rRand][0] = { row: rRand, col: 0, id: vId, hp: maxHp, maxHp: maxHp, forwardOffset: 0 };
            }

            renderGrid();
            initPhysicsBeadPile();
        }

        function renderGrid() {
            const field = document.getElementById('villains-grid-field');
            field.innerHTML = '';

            // Find current active column (first column from left index 0 to 3 that still has living villains)
            let activeCol = -1;
            for (let c = 0; c < 4; c++) {
                let hasAlive = false;
                for (let r = 0; r < 3; r++) {
                    if (gridData[r][c] !== null && gridData[r][c].hp > 0) {
                        hasAlive = true;
                        break;
                    }
                }
                if (hasAlive) {
                    activeCol = c;
                    break;
                }
            }

            // Render all 12 cells of the 3x4 grid
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 4; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    
                    const villain = gridData[r][c];
                    if (villain !== null && villain.hp > 0) {
                        const unit = document.createElement('div');
                        let isTargetable = (c === activeCol);
                        unit.className = `villain-unit ${isTargetable ? 'active-target' : 'disabled-target'}`;
                        
                        if (isTargetable) {
                            unit.onclick = () => fireCrossBullet(r, c);
                        }

                        let pct = Math.max(0, (villain.hp / villain.maxHp) * 100);
                        unit.innerHTML = `
                            <div class="v-hp-container"><div class="v-hp-bar" style="width: ${pct}%;"></div></div>
                            <img class="villain-img" src="${villainFiles[villain.id]}" alt="Villain">
                        `;
                        cell.appendChild(unit);
                    }
                    field.appendChild(cell);
                }
            }

            // Check win condition
            if (activeCol === -1) {
                triggerLevelClear();
            }
        }

        // Initialize beads strictly at the bottom of the vault pit, piled upwards
        function initPhysicsBeadPile() {
            const container = document.getElementById('bead-container');
            container.innerHTML = '';
            physicsBeads = [];

            const pit = document.getElementById('vault-pit');
            const pitWidth = pit.clientWidth || 300;
            const pitHeight = pit.clientHeight || 250;

            const rows = 6;
            const cols = 14;
            let idCounter = 0;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const isGold = Math.random() < (0.18 + upgrades.power * 0.02);
                    const size = 18;
                    // Positioned at the bottom floor of the vault pit underneath the pivot
                    const x = (pitWidth / 2) - 140 + c * 20 + (r % 2) * 8;
                    const y = 10 + r * 16; // Bottom-aligned stacking

                    if (x > 10 && x < pitWidth - 10) {
                        physicsBeads.push({
                            id: idCounter,
                            type: isGold ? 'gold' : 'white',
                            value: isGold ? (5 * upgrades.power) : (1 * upgrades.power),
                            x: x,
                            y: y,
                            collected: false
                        });

                        const beadEl = document.createElement('div');
                        beadEl.className = 'physics-bead';
                        beadEl.id = `bead-${idCounter}`;
                        beadEl.style.width = `${size}px`;
                        beadEl.style.height = `${size}px`;
                        beadEl.style.left = `${x}px`;
                        beadEl.style.bottom = `${y}px`; // Bottom physical stacking
                        beadEl.style.background = isGold 
                            ? 'radial-gradient(circle at 30% 30%, #fde047 0%, #eab308 60%, #a16207 100%)' 
                            : 'radial-gradient(circle at 30% 30%, #ffffff 0%, #d1d5db 60%, #9ca3af 100%)';
                        beadEl.style.color = isGold ? '#fff' : '#1f2937';
                        beadEl.innerText = isGold ? '★' : '';
                        container.appendChild(beadEl);
                        idCounter++;
                    }
                }
            }
        }

        // 180-Degree Clock-Arm Physics Mechanics pointing directly where tapped
        function handleClawTrigger(event) {
            if (isClawBusy) return;
            isClawBusy = true;

            const pit = document.getElementById('vault-pit');
            const rect = pit.getBoundingClientRect();
            
            const pivotX = rect.width / 2;
            const pivotY = 8; // Top center anchor

            const clickX = event.clientX - rect.left - pivotX;
            const clickY = event.clientY - rect.top - pivotY;

            // Calculate angle within bottom 180 degrees (-90 to +90 degrees)
            let rad = Math.atan2(clickX, Math.max(5, clickY));
            let deg = rad * (180 / Math.PI);
            deg = Math.max(-88, Math.min(88, deg));

            const arm = document.getElementById('rotating-arm');
            arm.style.transform = `translateX(-50%) rotate(${deg}deg)`;

            const tapDist = Math.hypot(clickX, clickY);
            const maxReachDist = Math.min(Math.max(tapDist, 50), 110 + (upgrades.reach * 18));
            arm.style.height = `${maxReachDist}px`;

            setTimeout(() => {
                let collectedPoints = 0;

                physicsBeads.forEach(b => {
                    if (!b.collected) {
                        const beadAngle = Math.atan2(b.x - pivotX, pit.clientHeight - b.y - pivotY) * (180 / Math.PI);
                        const angleDiff = Math.abs(deg - beadAngle);
                        const beadDistFromPivot = Math.hypot(b.x - pivotX, pit.clientHeight - b.y - pivotY);

                        if (angleDiff < 25 && Math.abs(beadDistFromPivot - maxReachDist) < 35) {
                            b.collected = true;
                            collectedPoints += b.value;
                            const el = document.getElementById(`bead-${b.id}`);
                            if (el) {
                                el.style.transform = 'scale(0) translateY(-30px)';
                                el.style.transition = 'transform 0.3s ease-out';
                            }
                        }
                    }
                });

                heroPower += collectedPoints;
                document.getElementById('hud-power').innerText = `Power: ${heroPower} | Scooped +${collectedPoints}! Click active column villain!`;

                arm.style.height = '40px';
                arm.style.transform = 'translateX(-50%) rotate(0deg)';

                setTimeout(() => {
                    isClawBusy = false;
                    if (physicsBeads.every(b => b.collected)) {
                        initPhysicsBeadPile();
                    }
                }, 300);
            }, 300);
        }

        // Fire cross bullet to selected villain in the active column
        function fireCrossBullet(r, c) {
            if (heroPower <= 0) {
                document.getElementById('hud-power').innerText = `No Power! Scoop beads in the bottom pit first!`;
                return;
            }

            const arena = document.getElementById('battle-arena');
            const bullet = document.createElement('div');
            bullet.className = 'cardinal-bullet';
            bullet.style.left = '14%';
            bullet.style.bottom = '22%';
            arena.appendChild(bullet);

            // Approximate target screen position inside grid
            const field = document.getElementById('villains-grid-field');
            const arenaRect = arena.getBoundingClientRect();
            const fieldRect = field.getBoundingClientRect();
            
            const targetX = fieldRect.left - arenaRect.left + (c + 0.5) * (fieldRect.width / 4);
            const targetY = fieldRect.top - arenaRect.top + (r + 0.5) * (fieldRect.height / 3);

            let currentX = arenaRect.width * 0.14;
            let currentY = arenaRect.height * 0.78;
            let distanceX = targetX - currentX;
            let distanceY = targetY - currentY;
            let steps = 18;
            let step = 0;

            const flight = setInterval(() => {
                step++;
                currentX += distanceX / steps;
                currentY += distanceY / steps;
                bullet.style.left = currentX + 'px';
                bullet.style.bottom = (arenaRect.height - currentY) + 'px';

                if (step >= steps) {
                    clearInterval(flight);
                    bullet.remove();
                    processDamage(r, c);
                }
            }, 18);
        }

        function processDamage(r, c) {
            let villain = gridData[r][c];
            if (!villain || villain.hp <= 0) return;

            let damageDealt = heroPower + (upgrades.bounce * 3);
            heroPower = 0;
            document.getElementById('hud-power').innerText = `Power: 0 | Tap bottom bead pit to reload!`;

            villain.hp -= damageDealt;

            if (villain.hp <= 0) {
                gridData[r][c] = null; // Remove dead villain from 3x4 grid space
            }

            renderGrid();
        }

        function triggerLevelClear() {
            if (level === 5) {
                document.getElementById('angel').style.display = 'block';
                setTimeout(() => {
                    if (stage === 4) {
                        showGameOverModal("VICTORY", "All formations defeated! Light triumphs!");
                    } else {
                        showUpgradeModal(`Stage ${stage} Cleared`, "Choose an upgrade before entering next stage.");
                    }
                }, 1000);
            } else {
                showUpgradeModal(`Level ${level} Cleared`, "Select a power-up for your equipment (Up to Level 7).");
            }
        }

        function showUpgradeModal(title, desc) {
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-desc').innerText = desc;
            document.getElementById('overlay-btn').style.display = 'none';

            const upgradeBox = document.getElementById('upgrade-box');
            upgradeBox.innerHTML = '';

            const choices = [
                { key: 'reach', name: 'Enhance Reach', desc: `Current Lvl: ${upgrades.reach}/7` },
                { key: 'power', name: 'Enhance Power', desc: `Current Lvl: ${upgrades.power}/7` },
                { key: 'bounce', name: 'Enhance Bounce', desc: `Current Lvl: ${upgrades.bounce}/7` }
            ];

            choices.forEach(c => {
                const card = document.createElement('div');
                card.className = 'upgrade-card';
                card.innerHTML = `<h3>${c.name}</h3><p>${c.desc}</p><p style="color:#d4af37; margin-top:5px;">${upgrades[c.key] < 7 ? 'Upgrade (+1)' : 'MAXED'}</p>`;
                card.onclick = () => {
                    if (upgrades[c.key] < 7) upgrades[c.key]++;
                    closeUpgradeModal();
                };
                upgradeBox.appendChild(card);
            });

            document.getElementById('overlay-msg').style.display = 'flex';
        }

        function closeUpgradeModal() {
            document.getElementById('overlay-msg').style.display = 'none';
            if (level === 5) {
                stage++;
                level = 1;
            } else {
                level++;
            }
            setupLevel();
        }

        function showGameOverModal(title, desc) {
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-desc').innerText = desc;
            document.getElementById('upgrade-box').innerHTML = '';
            document.getElementById('overlay-btn').style.display = 'inline-block';
            document.getElementById('overlay-btn').innerText = "Play Again";
            document.getElementById('overlay-btn').onclick = () => location.reload();
            document.getElementById('overlay-msg').style.display = 'flex';
        }
    </script>
</body>
</html>
